#Show the med bag button on the inventory screen while one is worn
inventoryButton = true
#Hide the outline on the block you're aiming at (1.4.0). Still shown in creative and spectator.
hideBlockOutline = true

#Worn sleeping bag / tent roll, same units (centre of the roll). y: - = higher, above the shoulders
[wornBedroll]
	#Range: -1.0 ~ 1.0
	x = 0.0
	#Range: -1.0 ~ 2.0
	y = -0.02
	#Distance behind the back with no backpack on
	#Range: -1.0 ~ 2.0
	z = 0.25
	#Distance behind the back while a backpack is worn
	#Range: -1.0 ~ 2.0
	zWithBackpack = 0.33
	#Range: 0.1 ~ 2.0
	scale = 0.85

#Worn medical / ammo bag: sits on top of the backpack, where the sleeping bag and tent go (0.8.0; before that it hung
#across the lower back under [wornMedBag], which is no longer read). Blocks from the top of the body (1 block = 16 pixels).
#x: + = to the player's left, y: + = down, z: + = further behind the back
[wornBagOnPack]
	#Range: -1.0 ~ 1.0
	x = 0.0
	#Height of the bag's top (- = above the shoulders)
	#Range: -1.0 ~ 2.0
	y = -0.27
	#Distance behind the back with no backpack on
	#Range: -1.0 ~ 2.0
	z = 0.25
	#Distance behind the back while a backpack is worn
	#Range: -1.0 ~ 2.0
	zWithBackpack = 0.33
	#Range: 0.1 ~ 2.0
	scale = 0.8
	#Tilt in degrees (+ = bottom swings out)
	#Range: -90.0 ~ 90.0
	pitch = 0.0

#Worn backpack (1.0). y: where its top sits below the neck (+ = lower); z: how far behind the spine its strap side is.
[wornBackpack]
	#Range: -1.0 ~ 2.0
	y = 0.03
	#Range: -1.0 ~ 2.0
	z = 0.19
	#Range: 0.1 ~ 2.0
	scale = 1.0

#Anomaly Zone artifact container (1.4.0): with a backpack, strapped onto the pack's outer face; without one, on the upper back (no hip belt).
#Pixels from the top of the body (16 = 1 block). x: + = left, y: + = down (top edge of the container), z: + = further back
[containerOnPack]
	enabled = true
	#Range: -16.0 ~ 16.0
	x = 0.0
	#Range: -16.0 ~ 32.0
	y = 3.3
	#Range: -16.0 ~ 32.0
	z = 9.0
	#Size compared with Anomaly Zone's own (1.0)
	#Range: 0.1 ~ 2.0
	scale = 0.75
	#No backpack worn: height on the upper back (top edge, pixels below the neck)
	#Range: -16.0 ~ 32.0
	yNoBackpack = 2.5
	#No backpack worn: extra distance from the back (added to Anomaly Zone's armour-aware gap)
	#Range: -16.0 ~ 16.0
	zNoBackpack = 0.0

