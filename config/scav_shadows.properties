# SCAVENGER shadow filter (client). Only applies while a shader draws its shadow map.
# Skip every entity except players in shader shadows.
onlyPlayersCastShadows=true
# Players: draw only the body + layers matching keepLayerClassRegex (armor, held items, slung guns, capes... are skipped).
playerShadowOnlyBodyAndBackpacks=true
keepLayerClassRegex=(?i)curios|backpack|zonebackpacks
# Inside the Curios layer: only curios whose renderer class matches this regex.
keepCurioRendererClassRegex=(?i)backpack|bedroll|medbag|radiopack
# Log the player layer classes kept/skipped once (30 s after the first shadow frame).
logLayersOnce=true
