
[weapon_ready]
	#Milliseconds before you can fire after the weapon comes up from lowered.
	#Range: 0 ~ 2000
	raiseDelayMs = 300
	#Top walking speed while the weapon is raised (1.0 = normal, 0.5 = 50%). Eases in; if your Alt + scroll pace is slower, that wins.
	#Range: 0.2 ~ 1.0
	raisedSpeed = 0.5

[headlamp]
	#How far the headlamp cone reaches, in blocks (light pools at 10%, 25%, 42%, 62% and 85% of this).
	#Range: 4.0 ~ 48.0
	range = 24.0
	#Brightness of the nearest light in the cone (1-15); the further pools get dimmer.
	#Range: 1 ~ 15
	brightness = 15
	#Brightness of the soft glow around your head (1-15). 0 = off.
	#Range: 0 ~ 15
	nearBrightness = 11
	#Give every new player a headlamp (worn in the Curios head slot) the first time they join.
	starterHeadlamp = true
	#0.78: the server places invisible light blocks for headlamps (the old way; can flicker).
	#Off = each client draws headlamps with Sodium Dynamic Lights instead (smooth, follows the view every frame).
	serverLightBlocks = false

[radiation]
	#Radiation protection comes from the helmet only. Body armour gives none.
	#A helmet of tier N fully protects you in radiation zones up to level N (it shows this in its tooltip).
	#When on, the allArmor/perArmorPoint/overrides settings below only affect thermal, chemical and psi.
	helmetsOnly = true
	#Helmet radiation tiers: "id=tier" (1-4). Helmets not listed have tier 0 (no radiation protection).
	#1 = respirator, 2 = full gas mask, 3 = sealed helmet, 4 = endgame (the city).
	helmetTiers = ["itz:rookie_respirator=1", "brimm:gasmask_h=4", "brimm:gasmask_alt_h=4", "itz:hazmat_mask=4", "fracturepoint:ratnik_pmk-4=4", "itz:psz_helmet_loner=2", "itz:psz_helmet_freedom=2", "itz:psz_helmet_military=2", "itz:psz_helmet_monolith=2", "itz:bulat_helmet=3", "itz:berill_helmet=3", "itz:corundum_helmet=3", "itz:marauder_helmet=3", "anomalyzone:scientific_helmet=3", "anomalyzone:tishina_helmet=3", "anomalyzone:paladin_helmet=3", "anomalyzone:experiment_n83_helmet=3", "anomalyzone:k105a_helmet=3", "anomalyzone:ten_helmet=3", "itz:exo_bulat_helmet=4", "itz:exo_berill_helmet=4", "itz:exo_corundum_helmet=4", "itz:exo_marauder_helmet=4", "anomalyzone:shepot_helmet=4", "projectarmor_:alt_helmet=4", "zone_tactical_anims:bunny_mask=4", "brimm:hazard_kit_h=4"]
	#Action-bar message (and a warning beep if you're unprotected) when you enter a radiation zone or change helmets in one.
	warnings = true
	#Give Anomaly Zone radiation protection to every armor piece (Anomaly Zone's own suits keep their values).
	#Anomaly Zone adds the four pieces up (max 400). A zone of level N stops hurting you at N x 100 protection.
	allArmor = true
	#Radiation protection per armor point of the piece (iron chestplate = 6 points).
	#Range: 0.0 ~ 50.0
	perArmorPoint = 6.0
	#Cap per piece from the formula above.
	#Range: 0 ~ 100
	maxPerPiece = 40
	#Exact Zone protection for specific items: "id=radiation" or "id=radiation,thermal,chemical,psi" (Anomaly Zone suit pieces are 50 each).
	#Everything else uses the formula above for radiation, with half of it as thermal/chemical and a quarter as psi.
	overrides = ["itz:rookie_respirator=25,10,25,5", "projectarmor_:diy_chestplate=0,0,0,0", "projectarmor_:d_3_crx_chestplate=0,0,0,0", "projectarmor_:a_6b_4_chestplate=5,5,0,0", "projectarmor_:a_6b_2_chestplate=10,5,5,0", "projectarmor_:nfm_chestplate=10,5,5,0", "projectarmor_:a_6b_5_chestplate=10,10,5,0", "projectarmor_:lbt_chestplate=15,10,10,0", "projectarmor_:ghel_chestplate=15,10,10,0", "projectarmor_:un_chestplate=15,10,10,0", "projectarmor_:iotv_chestplate=20,15,10,0", "projectarmor_:fs_chestplate=20,15,10,0", "projectarmor_:wartech_chestplate=20,15,10,0", "projectarmor_:a_6b_43_chestplate=25,15,15,0", "projectarmor_:gb_helmet=0,0,0,0", "projectarmor_:ssh_68_helmet=5,5,0,5", "projectarmor_:striker_ulach_helmet=10,5,5,5", "projectarmor_:sai_helmet=10,5,5,5", "projectarmor_:oonh_helmet=10,5,5,5", "projectarmor_:lhs_helmet=10,10,5,5", "projectarmor_:exfil_helmet=10,10,5,10", "projectarmor_:exfi_lpnv_helmet=10,10,5,10", "projectarmor_:h_6b_47_helmet=15,10,5,10", "projectarmor_:h_6b_47_pnv_helmet=15,10,5,10", "projectarmor_:alt_helmet=20,15,15,10", "zone_tactical_anims:bunny_mask=20,15,15,10"]
	#Armour values replaced to fit Anomaly Zone's suits: "id=armor,toughness,knockbackResistance".
	#(AZ suit chest: light 6/0, standard 8/2, heavy 8/3 +0.1 knockback. Helmets 2-3.)
	armorBalance = ["projectarmor_:diy_chestplate=3,0,0", "projectarmor_:d_3_crx_chestplate=3,0,0", "projectarmor_:a_6b_4_chestplate=4,0.5,0", "projectarmor_:a_6b_2_chestplate=5,0.5,0", "projectarmor_:nfm_chestplate=5,1,0", "projectarmor_:a_6b_5_chestplate=6,1,0", "projectarmor_:lbt_chestplate=6,1.5,0", "projectarmor_:ghel_chestplate=7,2,0", "projectarmor_:un_chestplate=7,2,0", "projectarmor_:iotv_chestplate=8,2.5,0", "projectarmor_:fs_chestplate=8,2.5,0", "projectarmor_:wartech_chestplate=8,3,0", "projectarmor_:a_6b_43_chestplate=9,3,0.1", "projectarmor_:gb_helmet=0,0,0", "projectarmor_:ssh_68_helmet=2,0,0", "projectarmor_:striker_ulach_helmet=2,0.5,0", "projectarmor_:sai_helmet=2,1,0", "projectarmor_:oonh_helmet=2,1,0", "projectarmor_:lhs_helmet=3,1,0", "projectarmor_:exfil_helmet=3,1.5,0", "projectarmor_:exfi_lpnv_helmet=3,1.5,0", "projectarmor_:h_6b_47_helmet=3,2,0", "projectarmor_:h_6b_47_pnv_helmet=3,2,0", "projectarmor_:alt_helmet=3,3,0.1", "zone_tactical_anims:bunny_mask=3,3,0.1"]
	#Radiation zone level inside the city (Anomaly Zone's zone biomes are 2). 0 = off. 4 = only endgame helmets protect.
	#Range: 0 ~ 4
	cityLevel = 4
	#City area: [minX, minZ, maxX, maxZ] in the overworld.
	cityBox = [-330, -520, 710, 620]
	#Armour mods capped at Anomaly Zone's heavy suits (any item from these mods that isn't listed above).
	armorCeilingMods = ["brimm", "fracturepoint"]
	#Caps for those mods: helmet, chest, legs, boots armour, then toughness and knockback resistance.
	armorCeiling = [3.0, 9.0, 7.0, 3.0, 3.0, 0.1]
	#Spots inside the city with no city radiation (bases, quest NPCs): "x,z,radius" in blocks.
	#The city fog still covers them; only the radiation is switched off.
	citySafeZones = ["-270,327,48"]
	#Our own psi fields (the Brain Scorcher north of the Radio Mast): "x,z,radius,level" in the overworld.
	#Inside one you are in an Anomaly Zone psi zone of that level: the psi dose builds while your psi protection is below level x 100.
	#Lev's Psy-Helmet gives 300, an Anomaly Zone suit piece 50. Overlapping circles: the highest level wins. Empty = off.
	psiFields = ["-540,-330,100,2", "-540,-330,50,3"]
	#Psi field level over the whole city box (0 = off, 4 = max). The City sings: only players who finished Lev's
	#questline (quest cityPsiQuest) AND wear Lev's Psy-Helmet are shielded (their level is lowered to 3, which the helmet's 300 covers).
	#Range: 0 ~ 4
	cityPsiLevel = 4
	#Custom NPCs quest that must be finished for Lev's Psy-Helmet to shield you in the city (153 = The Shift Chief's Reel).
	#Range: 0 ~ 100000
	cityPsiQuest = 153
	#Spots inside the city box with no city psi field: "x,z,radius" (the Military base, the Armoury).
	cityPsiSafeZones = ["-270,327,80", "264,-499,40", "-350,200,45"]
	#0.83: anti-radiation meds from other mods (they only know their own mod's radiation) now lower Anomaly Zone's
	#radiation dose when you finish using them: "id=percent of the full scale removed" (100 = clears it; damage starts at 20%).
	#Server side. Empty = off.
	radMeds = ["tarkovdayz:anti_radpill=35", "itz:anti_rads=100", "itz:radio_protectant=20"]

[world]
	#Real minutes for one full day/night. Vanilla 20; S.T.A.L.K.E.R.'s classic 10x clock is 144.
	#Keep this the same on the server and every client.
	#Range: 20.0 ~ 1440.0
	dayLengthMinutes = 144.0
	#Mute players' distance-based footsteps; each client plays them on the leg animation instead (client stepSync).
	animatedFootsteps = true

[npcs]
	#Gun NPCs (bandits etc.): damage they deal to players, as a multiplier. 1 = full TaCZ damage.
	#Range: 0.0 ~ 4.0
	damageToPlayers = 0.5
	#Gun NPCs: random aim error per shot, in degrees. 0 = perfect aim (TaCZ NPCs Mod default).
	#Range: 0.0 ~ 30.0
	aimSpread = 2.0
	#NPCs on the same team as you (faction) can't hurt you, and you can't hurt them. Players can still hurt each other.
	noFriendlyFire = true
	#Gun NPCs: ticks they spend aiming at a new target before the first shot (20 ticks = 1 second). 0 = shoot at once.
	#Range: 0 ~ 200
	aimDelayTicks = 20
	#Gun NPCs: ticks after the first shot over which their aim settles from aimSpreadStart to aimSpreadEnd.
	#Range: 0 ~ 600
	aimSettleTicks = 60
	#Gun NPCs: aim error multiplier (times aimSpread) on their first shots at a target.
	#Range: 0.0 ~ 10.0
	aimSpreadStart = 1.5
	#Gun NPCs: aim error multiplier (times aimSpread) once they've been aiming for aimSettleTicks.
	#Range: 0.0 ~ 10.0
	aimSpreadEnd = 0.35
	#Gun NPCs: if they lose sight of their target for this many ticks, they have to aim again (delay and settle start over).
	#Range: 1 ~ 400
	reaimAfterLostTicks = 20

[emissions]
	#Turn off Into The Zone's emission (the one without the siren). Anomaly Zone's emission stays.
	itzEmissionsOff = true

[pda]
	#Multiplier on the wait between new PDA contract offers. Anomaly Zone waits 30-60 min after a job (5-15 min otherwise);
	#0.33 makes that about 10-20 min (2-5 min). 1.0 = Anomaly Zone's default.
	#Range: 0.05 ~ 1.0
	contractWait = 0.33
	#PDA jobs whose target is farther than this many blocks from you are skipped (a new one is offered instead).
	#Range: 200 ~ 100000
	contractMaxDistance = 2000
	#Our own PDA contract sites: "structure=minX,minY,minZ,maxX,maxY,maxZ" (Anomaly Zone structure name without anomalyzone:).
	#A contract that needs that structure goes to the nearest box listed here (centre) instead of searching the world, so
	#hand-built copies count. red_forest_laboratory boxes also count as 'inside the lab' for Test Subjects (the lab's lower
	#part: you must be at least 8 blocks below the box top). Route uses psi_crater_basin, bio_chasm and red_forest_zgrls.
	#Several boxes per structure are fine. Structures with no box here use Anomaly Zone's normal search.
	sites = []

[pace]
	#Slowest walking pace you can scroll down to (Alt + mouse wheel). 1.0 = normal speed.
	#Range: 0.1 ~ 1.0
	minPace = 0.3
	#How quickly your speed eases to a new pace (share of the gap closed each tick). 1.0 = instant.
	#Range: 0.02 ~ 1.0
	smoothing = 0.25

[food]
	#Modded items that only give buffs also fill the hunger bar: "id=hunger,saturation".
	#Hunger is in half-shanks (20 = full bar; a cooked steak is 8,0.8). Items that are already normal food are skipped.
	hungerValues = ["anomalyzone:stew_can=8,0.8", "anomalyzone:field_ration=10,0.8", "anomalyzone:solyanka=9,0.8", "anomalyzone:ksm=6,0.6", "anomalyzone:thermos=3,0.3", "anomalyzone:nuka_kola=2,0.1", "anomalyzone:energy_drink=2,0.1", "anomalyzone:vodka_hryuchevo=1,0.1", "itz:chocolate_bar=4,0.3", "itz:rad_bread=5,0.6", "itz:energy_drink=1,0.1", "itz:vodka=1,0.1", "tarkovdayz:mre=10,0.8", "tarkovdayz:tea=2,0.2", "tarkovdayz:cola=2,0.1"]

[inventory]
	#Guns only ever go in pocket slot 1 (the holster slot), and slot 1 only takes guns. A second gun goes to your backpack.
	#Stops quick-swapping between guns instead of reloading. Creative mode is exempt.
	gunSlotOnly = true

[jetpack]
	#0.78.7: a charged Player Jetpack lets you fly like creative flight (jump, tap Space again; Space up, Shift down, hover).
	#Drains the pack's charge while flying; empty = you fall. false = the jetpack mod's own thrust controls.
	creativeFlight = true
	#Minutes of flight on a full charge (any upgrade level). Ward: 2 hours.
	#Range: 1 ~ 1440
	flightMinutes = 120

[az_prices]
	#Anomaly Zone trader prices (what players PAY; selling to them is unchanged). Both client and server read these,
	#so keep the pack's copy and the server's copy the same or the shown price differs from the charged one.
	#Suits/armour (Scientific set: chest 39,000 -> 312,000 at 8.0; Lev sells it for 500,000).
	#Range: 0.01 ~ 1000.0
	suits = 8.0
	#Everything else the Seller has: anomalous core/batteries, PDA, bolts, phases, essence, serum.
	#Range: 0.01 ~ 1000.0
	gear = 2.0
	#Food, drinks and meds listed in consumableIds (AZ stew 3,200 is already above Vera's 1,500).
	#Range: 0.01 ~ 1000.0
	consumables = 1.0
	#Artifacts the Seller sells (125,000 - 3,300,000).
	#Range: 0.01 ~ 1000.0
	artifacts = 1.0
	#Everything the Gunsmith sells (guns, ammo, attachments; already close to ours: AK-74 110k at Hrytsenko).
	#The Gunsmith's tier rows still use the original prices.
	#Range: 0.01 ~ 1000.0
	gunsmith = 1.0
	#Items priced as consumables.
	consumableIds = ["anomalyzone:injection_800", "anomalyzone:injection_run_heal", "anomalyzone:udar", "anomalyzone:topot", "anomalyzone:adrenaline", "anomalyzone:neurostim", "anomalyzone:barricade", "anomalyzone:phoenix", "anomalyzone:berserk", "anomalyzone:nuka_kola", "anomalyzone:thermos", "anomalyzone:stew_can", "anomalyzone:field_ration", "anomalyzone:adaptogen", "anomalyzone:solyanka", "anomalyzone:energy_drink", "anomalyzone:vodka_hryuchevo"]
	#Exact prices that win over the multipliers: "itemid=rubles" (e.g. "anomalyzone:pda=50000").
	overrides = []

