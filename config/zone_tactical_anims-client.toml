[pose]
	#Third person, weapon raised: how much of TaCZ's sideways torso twist to keep (0 = torso square with the legs, 1 = TaCZ default).
	#Range: 0.0 ~ 1.0
	raisedTorsoTwist = 1.0

[atmosphere]
	#Bleak Zone colours on every biome (existing world too): drained grass/leaves, murky water, greyer sky and fog.
	#Changes show on chunks re-rendered (F3+A reloads them).
	enabled = true
	#Grass/leaf colour drained toward grey (0 = vanilla, 1 = fully grey).
	#Range: 0.0 ~ 1.0
	grassDesaturate = 0.8
	#Dry tint mixed into grass/leaves (#RRGGBB).
	grassTintColor = "#6B5F3E"
	#Range: 0.0 ~ 1.0
	grassTint = 0.5
	#Water surface colour (#RRGGBB) and how much it replaces the biome's own.
	waterColor = "#48523C"
	#Range: 0.0 ~ 1.0
	water = 0.8
	#Underwater fog colour (#RRGGBB) and amount.
	waterFogColor = "#252B1E"
	#Range: 0.0 ~ 1.0
	waterFog = 0.85
	#Sky colour drained toward grey.
	#Range: 0.0 ~ 1.0
	skyDesaturate = 0.7
	#Distance fog colour drained toward grey.
	#Range: 0.0 ~ 1.0
	fogDesaturate = 0.6

[pace]
	#How much one notch of Alt + mouse wheel changes your pace (0.05 = 5%).
	#Range: 0.01 ~ 0.5
	scrollStep = 0.05
	#Briefly show your pace above the hotbar when you change it.
	showPace = true

[music]
	#Anomaly Zone biomes where its own zone music is turned off, so the normal music keeps playing.
	#Options: anomalyzone:red_forest, anomalyzone:psi_zone, anomalyzone:bio_zone, anomalyzone:thermo_zone, anomalyzone:klondike
	keepMusicIn = ["anomalyzone:red_forest", "anomalyzone:psi_zone", "anomalyzone:bio_zone", "anomalyzone:thermo_zone", "anomalyzone:klondike"]

[color_grade]
	#Color grade added on top of Elaris (needs Elaris' Filmic Tonemap turned on).
	#Options: stalker (muted, green shadows, warm grey highlights), tarkov (cold blue-grey, contrasty),
	#vanilla_plus (light touch, close to normal colors), off.
	#Cycle presets in game with the color grade key (F7 by default, Controls > Zone Tactical).
	preset = "tarkov"
	#How strong the grade is. 1.0 = full, 0.5 = half way between Elaris' look and the grade.
	#Range: 0.0 ~ 1.0
	strength = 1.0
	#How much Elaris' fog takes on the world fog colour (the colour Distant Horizons' fog uses).
	#1.0 = same colour, so near fog and far LOD fog blend seamlessly. 0 = Elaris' own sky-lit fog colour.
	#Range: 0.0 ~ 1.0
	elarisFogMatch = 1.0

[zone_fx]
	#Zone FX (with Elaris): screen effects drawn in Elaris' final pass. false = all off.
	enabled = true
	#Film grain, flicker and colour loss while you're in radiation (and during emissions). 0 = off, 1 = default.
	#Range: 0.0 ~ 2.0
	radiationGrain = 1.0
	#Psi fields: colour fringes (chromatic aberration) and a slow wobble. Weaker while your gear shields you. 0 = off.
	#Range: 0.0 ~ 2.0
	psiAberration = 1.0
	#Emissions: red tint and a slow pulse that builds while the City sings. 0 = off.
	#Range: 0.0 ~ 2.0
	emission = 1.0
	#Low health (below 40%): darker edges, colour drains, a pulse with your heartbeat. 0 = off.
	#Range: 0.0 ~ 2.0
	lowHealth = 1.0
	#Rain drops on the lens while you look up in the rain (first person). 0 = off.
	#Range: 0.0 ~ 2.0
	lensRain = 1.0
	#Smudges on a closed helmet / gas mask visor that light up in bright light (first person). 0 = off.
	#Range: 0.0 ~ 2.0
	visorDirt = 1.0
	#Always-on subtle vignette (darker corners). 0 = off.
	#Range: 0.0 ~ 0.6
	vignette = 0.16
	#Soft bloom around bright things (sky, lamps, fire, sunlit surfaces). 0 = off.
	#Range: 0.0 ~ 2.0
	bloom = 0.25
	#Softens what is deep in the fog (pixels close to the fog colour). 0 = off.
	#Range: 0.0 ~ 1.5
	fogBlur = 0.0
	#0.78.7 auto exposure: in daytime shade (under trees, indoors, under bridges) the picture
	#brightens its dark tones over about a second, and settles back in the open. No boost at night. 0 = off, 1 = normal, 2 = strong.
	#Range: 0.0 ~ 2.0
	autoExposure = 0.7

[quest_givers]
	#0.82: gold ! over NPCs with a quest you can take now, gold ? over NPCs you can hand a finished quest to.
	#Only you see your own icons.
	icons = true
	#Size of the icons (1.0 = about three times a name tag's letters).
	#Range: 0.3 ~ 3.0
	iconScale = 1.0

[helmetOnBack]
	#0.86.1: OFF by default (players did not like it). 0.84: a helmet taken off with the hide key hangs on your back / backpack (third person, other players) instead of vanishing.
	enabled = false
	#Down from the shoulders, in blocks (the helmet's neck opening; with pitch 90 that is the helmet's middle).
	#Range: -1.0 ~ 2.0
	y = 0.3
	#Out from the spine with no backpack.
	#Range: -1.0 ~ 2.0
	z = 0.16
	#Out from the spine with a backpack worn.
	#Range: -1.0 ~ 2.0
	zWithBackpack = 0.4
	#Range: 0.2 ~ 2.0
	scale = 0.85
	#180 = the helmet faces backwards.
	#Range: -360.0 ~ 360.0
	yaw = 180.0
	#Tilt, degrees. 90 = the front of the helmet points down, the top points away from your back.
	#Range: -180.0 ~ 180.0
	pitch = 90.0
	#0.86: out from the spine with the Survival Essentials backpack worn (its outer pocket ends about 0.60 out).
	#Range: -1.0 ~ 2.0
	zWithZoneBackpack = 0.62

[cameraInertia]
	#0.89.3: Camera Inertia (tilt/sway/shake) pauses while a Cinematic Interactions station scene runs (workbench, furnace, campfire...)
	#and fades back in over about a second after you step away, so the two camera mods don't fight.
	quietAtStations = true

[performance]
	#0.89.7 (Ward's institute profile: ~19% of the frame): many modded armour pieces (MCreator, e.g. Extinction Z)
	#build their 3D model from scratch every time it is asked for, several times per frame in first person. When on, a modded
	#model layer is built once and reused (vanilla 'minecraft:' layers are never touched; cleared on resource reload).
	cacheModdedModelLayers = true
	#Comma-separated namespaces (mod ids) to leave alone if one of them misbehaves with the cache.
	cacheExcludeNamespaces = ""
	#0.89.8: Concord Deco clutter decals (cobwebs, dust, damp, drips) are only drawn within this many blocks
	#of the camera (the mod draws to 64). They're drawn every frame, so a shorter range is a cheap FPS win.
	#Range: 8 ~ 64
	decalRange = 32
	#0.89.9: also draw Concord Deco decals into the shader shadow map. They are flat, so their shadows are
	#practically invisible; off saves ~2% of the frame with shaders on.
	decalShadows = false
	#0.90.0: TaCZ NPC soldiers' guns are not drawn beyond this many blocks (0 = always draw). Players' guns are never affected.
	#Each NPC gun costs ~1% of the frame; past ~48 blocks it's only a few pixels.
	#Range: 0 ~ 256
	npcGunDistance = 48
	#0.90.0: TaCZ NPC soldiers' gun attachments are not drawn beyond this many blocks (0 = always draw).
	#Range: 0 ~ 256
	npcAttachmentDistance = 16

[watch]
	#0.93 wrist check (Y): seconds the watch stays up.
	#Range: 0.8 ~ 8.0
	seconds = 2.6
	#Third person, no gun out: left arm pose [pitch, yaw, roll] in degrees. -90 pitch = straight forward, + yaw = across the chest.
	armPose = [-70.0, 32.0, 0.0]
	#Third person, no gun out: head pitch while looking at the watch (degrees, + = down).
	#Range: -30.0 ~ 80.0
	headPitch = 28.0
	#Third person, gun out: degrees ADDED to the left arm's gun pose [pitch, yaw, roll] (a small wrist turn).
	gunArmTurn = [-14.0, 12.0, 0.0]
	#Third person, gun out: degrees the head tips down toward the wrist.
	#Range: -30.0 ~ 60.0
	gunHeadTip = 12.0
	#Worn watch: extra pixels of clearance around the wrist (raise it if a jacket sleeve covers the strap).
	#Range: 0.0 ~ 3.0
	wornClearance = 0.35
	#Worn watch: pixels up (-) / down (+) the arm from the wrist.
	#Range: -6.0 ~ 3.0
	wornOffsetY = -1.5
	#Worn watch: where the face sits round the wrist, degrees. 0 = inside of the wrist (faces up while aiming),
	#90 = toward the body, 180 = back of the wrist, 270 = outer side.
	#Range: 0.0 ~ 360.0
	faceAngle = 0.0
	#Third person, no gun out: head turn toward the watch (degrees, - = left).
	#Range: -60.0 ~ 60.0
	headYaw = -10.0
	#First person, no gun: extra rotation of the raised forearm [x, y, z] in degrees (camera space).
	fpArmTurn = [50.0, -50.0, 50.0]
	#First person, no gun: twist of the forearm round its own length, degrees (turns the watch face toward you).
	#Range: -180.0 ~ 180.0
	fpTwist = 15.0
	#First person: degrees your view tips down toward the wrist. 0 = off.
	#Range: 0.0 ~ 40.0
	fpViewDip = 8.0
	#First person, gun out: how far the gun dips (blocks).
	#Range: 0.0 ~ 1.0
	fpGunDrop = 0.18
	#First person, gun out: degrees the gun tips down.
	#Range: -45.0 ~ 45.0
	fpGunPitch = 10.0
	#First person, gun out: degrees the gun cants (+ = to the right, as the support wrist turns).
	#Range: -60.0 ~ 60.0
	fpGunRoll = 14.0

#0.93.6: the SCAVENGER faction patch on your right sleeve (pixels of the player model).
[sleeve_patch]
	#Top edge of the patch below the shoulder.
	#Range: -2.0 ~ 8.0
	y = 0.6
	#Patch width and height.
	#Range: 1.0 ~ 6.0
	size = 3.4
	#Shift toward the front (+) or back (-) of the arm.
	#Range: -2.0 ~ 2.0
	z = 0.0
	#Gap between the sleeve and the patch, so it never flickers into it.
	#Range: 0.0 ~ 1.0
	surface = 0.02
	#How far out the sleeve of our Survival Essentials jackets is (from the arm's centre line, same for slim and normal skins).
	#Range: 2.0 ~ 6.0
	jacketSleeve = 4.0
	#0.93.8: the same for any other armour on the chest / in the body slot (Ward 11/27: 3.75 sat right on his armour).
	#Range: 2.0 ~ 6.0
	armourSleeve = 3.75

