
[fresh_animations]
	#Degrees the legs are turned while a gun is out (Fresh Animations).
	#Negative = turn left (counter-clockwise seen from above), positive = right.
	#Range: -90.0 ~ 90.0
	legOffset = 35.0
	#Max degrees the hips turn toward your movement direction (diagonals).
	#Range: 0.0 ~ 90.0
	maxHipTurn = 45.0
	#Left strafe: false = Fresh Animations' normal left strafe,
	#true = the right strafe played in reverse (experimental).
	mirrorLeftStrafe = false
	#Max degrees the torso turns off your aim while moving with a gun (hip-fire). 0 = off.
	#Range: 0.0 ~ 45.0
	torsoTwist = 20.0
	#(old setting, no longer used)
	#Range: 0.0 ~ 6.0
	landingDip = 1.5
	#How long the landing dip lasts, in seconds.
	#Range: 0.1 ~ 1.0
	landingTime = 0.35
	#(old setting, no longer used - Fresh Animations bobs the torso now)
	#Range: 0.0 ~ 3.0
	walkBob = 0.6
	#Degrees the arms/gun bob with each step.
	#Range: 0.0 ~ 15.0
	walkBobArms = 1.0
	#Shifts the bounce timing against the footsteps (degrees). Change if the dip isn't on the footfall.
	#Range: -180.0 ~ 180.0
	walkBobPhase = 0.0
	#Landing with a gun: how much the upper body follows Fresh Animations' leg crouch.
	#1.0 = exactly (feet stay planted), 0 = off.
	#Range: 0.0 ~ 2.0
	landingFollow = 1.0
	#Raised weapon: degrees the torso turns into the shooting stance (negative = the other way).
	#Range: -90.0 ~ 90.0
	raisedTorsoYaw = 10.0
	#Raised weapon: degrees the torso leans forward.
	#Range: -30.0 ~ 30.0
	raisedTorsoPitch = 2.0
	#How much the gun arms follow the torso's movement (landing drop, walk bob). 1.0 = fully, 0 = not at all.
	#Range: 0.0 ~ 1.5
	armFollow = 1.0
	#Raised: how much the gun arms turn with the torso stance (1.0 = together, 0 = not, -1.0 = opposite).
	#Range: -1.5 ~ 1.5
	armsWithTorso = 0.0
	#Raised: degrees to turn the gun arms' aim. Negative = gun toward your left, positive = right.
	#Range: -90.0 ~ 90.0
	raisedArmYaw = -12.0
	#Same as armFollow, but while the weapon is raised (lower = stiffer, steadier aim).
	#Range: 0.0 ~ 1.5
	armFollowRaised = 0.5
	#Raised: lowers (+) or raises (-) the support (left) arm, in degrees.
	#Range: -45.0 ~ 45.0
	raisedLeftArmPitch = 20.0
	#While aiming down sights: how much the gun arms follow torso movement (0 = rock steady).
	#Range: 0.0 ~ 1.5
	adsArmFollow = 0.1
	#While aiming down sights: degrees the head tilts onto the stock (cheek weld). Negative = other way, 0 = off.
	#Range: -30.0 ~ 30.0
	adsHeadTilt = 20.0
	#While aiming: how much to cancel the torso's walking sway (1.0 = fully steady, 0 = natural sway).
	#Range: 0.0 ~ 1.0
	adsTorsoSteady = 1.0
	#Raised weapon while moving: how much of the torso stance to keep (legs face the walk direction then).
	#Range: 0.0 ~ 1.0
	movingTorsoYaw = 0.5
	#Footstep sounds, view bob and gun bob all follow the third-person leg animation (Fresh Animations step cycle).
	stepSync = true
	#Shift (degrees) of the footfall within the leg cycle. Tune if steps land between footfalls. /zta reload after editing.
	#Range: -360.0 ~ 360.0
	stepPhase = 90.0

[first_person]
	#Field of view for the gun in first person (like STALKER's HUD FOV).
	#70 = normal. Higher = gun looks smaller/further away, lower = bigger. Scopes are not affected.
	#Range: 40.0 ~ 110.0
	viewModelFov = 85.0
	#Degrees the gun tilts down in first person when lowered (negative = up).
	#Range: -60.0 ~ 60.0
	lowerPitch = 18.0
	#How far the gun drops in first person when lowered (negative = up).
	#Range: -1.0 ~ 1.0
	lowerDrop = 0.05
	#Shaders: reload the shader pack once, 2 seconds after you first hold a gun in a world.
	#Works around black streaks that TaCZ guns can leave in Oculus shaders until a reload.
	shaderFixOnFirstGun = true
	#Shaders: draw held guns in the shadow pass. false = players still cast a shadow, but the gun doesn't (much cheaper).
	gunShadows = false
	#Shaders: when gunShadows is false, the held gun still casts a shadow as a plain static model
	#(same model as the gun on your back: no reload/inspect animation, attachments or muzzle flash in the shadow). false = no gun in the shadow.
	staticGunShadow = false
	#Shaders (Elaris): draw the worn Sophisticated Backpack into the player shadow as a solid model (it was missing).
	backpackShadow = true
	#Shaders: guns held by NPCs and mobs (quest-givers, bandits) cast a shadow. false (0.79) = no NPC gun shadows (cheaper).
	npcGunShadows = false
	#Shaders: skip Brimm armour in the shadow pass. Brimm draws its armour into the main frame buffer, so with shaders a tiny
	#copy of the armour (seen from the sun) showed at the centre of the screen and in scopes. false = Brimm's own behaviour.
	brimmShadowFix = true
	#0.91.1: Brimm shoulder patches follow the arm (they floated when the arm moved) and sit 1 px in on slim arms.
	brimmPatchesOnArms = true
	#A Brimm torso patch further than this from the centre line (blocks; torso half-width = 0.25) counts as a shoulder patch.
	#Range: 0.0 ~ 1.0
	brimmPatchArmEdge = 0.24
	#0.91.1 Holster Rig, no backpack: the second slung gun sits this much higher than the first (blocks, negative = up).
	#Range: -1.0 ~ 1.0
	holsterRigUp = -0.2
	#0.91.1 Holster Rig, no backpack: and this much further off the back (so the two guns don't clip).
	#Range: -0.5 ~ 0.5
	holsterRigOut = 0.04
	#0.91.1: how Anomaly Zone draws anomalies (same as its /anomalyshader command). 1 = normal lit render (visible with our
	#shader pack), 2 = unlit baked texture, 0 = AZ auto (unlit whenever a shader pack is on: anomalies vanish with ours), -1 = don't touch.
	#Range: -1 ~ 2
	anomalyShaderMode = 1
	#0.91.1 / 0.93.6: your SCAVENGER faction patch (patch slot) also shows on the top right of your backpack.
	backpackPatch = true
	#Backpack patch centre, body space in blocks: x (negative = wearer's right = top right seen from behind).
	#Range: -1.0 ~ 1.0
	backpackPatchX = -0.16
	#Backpack patch top edge (blocks below the neck).
	#Range: -1.0 ~ 1.0
	backpackPatchY = 0.05
	#Backpack patch distance out from the body (the pack's back face).
	#Range: -1.0 ~ 2.0
	backpackPatchZ = 0.505
	#Backpack patch width in blocks (height follows the patch image).
	#Range: 0.02 ~ 1.0
	backpackPatchSize = 0.16
	#0.91.1: armour worn in the Curios body (cosmetic) slot is drawn instead of the real chest armour (the real one is hidden, its stats still count).
	cosmeticHidesChest = true
	#0.91.1: Weather Glass redraws the rain/frost/dust on glass only every N client ticks (20 ticks = 1 s). Each redraw writes into
	#the block atlas, which stalls the frame; 4 = 5 times a second (stepped, stop-motion drops). 1 = Weather Glass's own (every tick).
	#Range: 1 ~ 20
	weatherGlassUploadEvery = 4
	#0.91.1: a faint beam cone in front of other players' (and NPCs') lit headlamps. Never drawn for yourself in first person.
	headlampCone = true
	#Headlamp cone length in blocks.
	#Range: 1.0 ~ 12.0
	headlampConeLength = 4.0
	#Headlamp cone strength at the lamp (fades to 0 at the end).
	#Range: 0.0 ~ 1.0
	headlampConeAlpha = 0.22
	#0.92.0: also draw the cone shape while a shader pack is on (off: the SCAVENGER shader draws real beams in the air instead).
	headlampConeWithShaders = false

[third_person]
	#(old setting, no longer used)
	#Range: 0.0 ~ 80.0
	lowerArmAngle = 15.0
	#Lowered (low ready) pose in third person, in degrees [pitch, yaw, roll].
	#Arm angles adapted from Dochi's Warfare 'low ready' NPC pose (MIT licence, credit: Dochi).
	#Torso. Pitch leans forward, yaw turns, roll tilts.
	lowBody = [6.0, 0.0, 0.0]
	#Right arm (trigger hand). Pitch -90 = straight forward, 0 = hanging down.
	lowRightArm = [-70.0, -30.0, 4.0]
	#Left arm (support hand).
	lowLeftArm = [-60.0, 28.0, -24.0]
	#Extra turn on the gun itself while lowered, pivoting at the hand (arms don't move).
	#[pitch, yaw, roll]: pitch + = muzzle up, yaw + = muzzle swings toward the support hand, roll + = cants the gun.
	lowGun = [0.0, 30.0, 0.0]

[lowered]
	#Degrees the lowered gun is angled across your body (first AND third person).
	#Positive = muzzle toward your left, negative = right, 0 = straight.
	#Range: -60.0 ~ 60.0
	lowerYaw = 20.0

[visor]
	#Camera effect while wearing a face-covering helmet in first person (looking through a visor).
	enabled = true
	#Helmets that count as face-covering (item ids). Hidden helmets (Anomaly Zone's hide key) don't count.
	helmets = ["anomalyzone:tishina_helmet", "anomalyzone:scientific_helmet", "anomalyzone:k105a_helmet", "anomalyzone:experiment_n83_helmet", "itz:hazmat_mask", "itz:exo_bulat_helmet", "itz:exo_berill_helmet", "itz:exo_corundum_helmet", "itz:exo_marauder_helmet"]
	#Lens bulge (fisheye). 0 = off.
	#Range: 0.0 ~ 1.0
	distortion = 0.1
	#Colour fringing toward the screen edges. 0 = off.
	#Range: 0.0 ~ 2.0
	fringe = 0.2
	#Film grain strength. 0 = off.
	#Range: 0.0 ~ 1.0
	grain = 0.0
	#Glow around bright areas. 0 = off (also the cheapest setting).
	#Range: 0.0 ~ 3.0
	bloom = 0.4
	#Dark corners. 0 = off.
	#Range: 0.0 ~ 1.0
	vignette = 0.35
	#Seconds to fade in/out when the helmet goes on or off.
	#Range: 0.0 ~ 5.0
	fadeSeconds = 1.0
	#Black mask frame around the view (rounded corners, nose bridge). 0 = off, 1 = solid black.
	#Range: 0.0 ~ 1.0
	mask = 1.0
	#Size of the mask opening. Bigger = frame pushed further out of view.
	#Range: 0.7 ~ 1.5
	maskSize = 0.86
	#(old, not used since 0.89.1: see profiles) true = every helmet counts as face-covering, except the ones in openHelmets.
	#false = only the helmets in the helmets list count.
	allHelmets = true
	#Helmets that do NOT cover the face (item ids, e.g. "minecraft:leather_helmet"). Used when allHelmets = true.
	openHelmets = ["lrarmor:atf_helmet", "lrarmor:dea_helmet", "lrarmor:fbi_helmet", "lrarmor:irs_helmet", "lrarmor:joker_helmet"]
	#Masks and respirators: no visor overlay and no muffling, but you still hear the breathing loop.
	breathingOnly = ["itz:rookie_respirator"]
	#0.85: fade the visor view out while an emission is active. Safety switch for the white screen some setups got with a visor helmet during an emission;
	#0.85 also stops the visor pass from changing the frame's alpha / blend state, which is the suspected cause. Set false to keep the visor during emissions.
	offDuringEmission = true
	#0.89.1: what each helmet / mask does, "id=overlay,muffle,breathing".
	#overlay: 1 = visor/goggle frame + visor effects in first person. muffle: 0..1, share of [helmet] muffle and reverb
	#(0.35 headset or ear covers, 0.65 visor or face shield, 1 = sealed suit helmet). breathing: 1 = respirator breathing loop
	#and your voice sounds muffled on voice chat. Works for the helmet slot AND the Curios mask/face slot (strongest of the two wins).
	#Anything not listed here does nothing (caps, open helmets). The old allHelmets/openHelmets/breathingOnly/helmets lists below are no longer used.
	profiles = ["brimm:base_h=0,0.35,0", "brimm:airframe_h=0,0.35,0", "brimm:assault_h=0,0.35,0", "brimm:pmc_h=0,0.35,0", "brimm:us_veteran_h=0,0.35,0", "brimm:ukrainian_veteran_h=0,0.35,0", "brimm:maid_h=0,0.35,0", "brimm:ghost_h=0,0.35,0", "brimm:nato_h=0,0.35,0", "brimm:six_b_four_seven_h=0,0.35,0", "brimm:zch_h=0,0.35,0", "brimm:tshfour_h=0,0.35,0", "brimm:tshfour_green_h=0,0.35,0", "brimm:gpnvg_h=1,0.35,0", "brimm:zabralo_h=1,0.65,0", "brimm:sobr_kit_h=1,0.65,0", "brimm:swat_kit_h=0,0,0", "brimm:killa_h=1,0.65,0", "brimm:press_h=1,0.65,0", "brimm:taro_h=1,0.65,0", "brimm:concord_h=1,0.65,0", "brimm:cqb_kit_h=1,0.35,1", "brimm:medic_h=1,0.65,1", "brimm:gasmask_h=1,1,1", "brimm:gasmask_alt_h=1,1,1", "brimm:hazard_kit_h=1,1,1", "itz:rookie_respirator=0,0,1", "itz:hazmat_mask=1,0.65,1", "itz:psz_helmet_freedom=1,0.65,1", "itz:psz_helmet_loner=1,0.65,1", "itz:psz_helmet_military=1,0.65,1", "itz:psz_helmet_monolith=1,0.65,1", "itz:bulat_helmet=1,1,1", "itz:berill_helmet=1,1,1", "itz:corundum_helmet=1,1,1", "itz:marauder_helmet=1,1,1", "itz:exo_bulat_helmet=1,1,1", "itz:exo_berill_helmet=1,1,1", "itz:exo_corundum_helmet=1,1,1", "itz:exo_marauder_helmet=1,1,1", "anomalyzone:scientific_helmet=1,1,1", "anomalyzone:tishina_helmet=1,1,1", "anomalyzone:paladin_helmet=1,1,1", "anomalyzone:experiment_n83_helmet=1,1,1", "anomalyzone:k105a_helmet=1,1,1", "anomalyzone:shepot_helmet=1,1,1", "anomalyzone:ten_helmet=1,1,1", "projectarmor_:striker_ulach_helmet=0,0.35,0", "projectarmor_:exfil_helmet=0,0.35,0", "projectarmor_:h_6b_47_helmet=0,0.35,0", "projectarmor_:sai_helmet=0,0.35,0", "projectarmor_:h_6b_47_pnv_helmet=0,0.35,0", "projectarmor_:lhs_helmet=0,0.35,0", "projectarmor_:exfi_lpnv_helmet=0,0.35,0", "projectarmor_:oonh_helmet=0,0.35,0", "projectarmor_:alt_helmet=1,0.65,0", "zone_tactical_anims:bunny_mask=1,0.65,0", "fracturepoint:ru_helmet=0,0.35,0", "fracturepoint:nato_sqad_leader_helmet=0,0.35,0", "fracturepoint:nato_ukr_helmet=0,0.35,0", "fracturepoint:nato_helmet=0,0.35,0", "fracturepoint:nato_sqad_leader_helmet_woodland=0,0.35,0", "fracturepoint:nato_ukr_helmet_woodland=0,0.35,0", "fracturepoint:nato_helmet_woodland=0,0.35,0", "fracturepoint:insurgency_commander_helmet=0,0.35,0", "fracturepoint:insurgency_shturmovik_helmet=0,0.35,0", "fracturepoint:sso_squad_leader_helmet=0,0.35,0", "fracturepoint:sso_soldier_helmet=0,0.35,0", "fracturepoint:sso_machine_gunner_helmet=0,0.35,0", "fracturepoint:fsb_soldier_helmet=0,0.35,0", "fracturepoint:fsb_squad_leader_helmet=0,0.35,0", "fracturepoint:fsb_machine_gunner_helmet=0,0.35,0", "fracturepoint:ratnik_helmet=0,0.35,0", "fracturepoint:ghillie_helmet_acacia=0,0.35,0", "fracturepoint:ghillie_helmet_birch=0,0.35,0", "fracturepoint:ghillie_helmet_dark_oak=0,0.35,0", "fracturepoint:ghillie_helmet_jungle=0,0.35,0", "fracturepoint:ghillie_helmet_mangrove=0,0.35,0", "fracturepoint:ghillie_helmet_oak=0,0.35,0", "fracturepoint:ghillie_helmet_snow=0,0.35,0", "fracturepoint:ghillie_helmet_spruce=0,0.35,0", "fracturepoint:iz_helmet_desert=1,0.35,0", "fracturepoint:iz_helmet_forest=1,0.35,0", "fracturepoint:iz_helmet_ops=1,0.35,0", "fracturepoint:iz_helmet_snow=1,0.35,0", "fracturepoint:iz_helmet_urban=1,0.35,0", "fracturepoint:iz_machine_gunner_helmet_desert=1,0.35,0", "fracturepoint:iz_machine_gunner_helmet_forest=1,0.35,0", "fracturepoint:iz_machine_gunner_helmet_ops=1,0.35,0", "fracturepoint:iz_machine_gunner_helmet_snow=1,0.35,0", "fracturepoint:iz_machine_gunner_helmet_urban=1,0.35,0", "fracturepoint:beta7_helmet=1,0.65,1", "fracturepoint:beta7_helmet_slate=1,0.65,1", "fracturepoint:beta7_helmet_ash=1,0.65,1", "fracturepoint:beta7_nvg_helmet=1,0.65,1", "fracturepoint:beta7_nvg_helmet_slate=1,0.65,1", "fracturepoint:beta7_nvg_helmet_ash=1,0.65,1", "fracturepoint:killa_helmet=1,0.65,0", "fracturepoint:tagilla_helmet=1,0.65,0", "fracturepoint:ratnik_pmk-4=1,0.35,1", "lrarmor:armored_chemical_helmet=1,1,1", "lrarmor:chemical_protective_helmet=1,1,1", "lrarmor:medical_helmet=1,0.65,1", "lrarmor:defender_helmet=1,0.65,1", "lrarmor:attacker_helmet=1,0.35,0", "lrarmor:joker_armed_helmet=1,0.65,0", "lrarmor:joker_helmet=1,0,0", "lrarmor:scout_helmet=0,0.35,0", "lrarmor:dea_armed_helmet=0,0.35,0", "lrarmor:atf_vest_helmet=0,0.35,0", "lrarmor:fbi_armed_helmet=0,0.35,0", "esap:motorcycle_helmet=1,0.65,0"]

[helmet]
	#Seconds the take-off sequence lasts (the helmet flips at the halfway point).
	#Range: 0.2 ~ 10.0
	secondsOff = 3.0
	#Seconds the put-on sequence lasts.
	#Range: 0.2 ~ 10.0
	secondsOn = 3.0
	#Third-person arm pose at the head, degrees [pitch, yaw, roll] for the right arm (left is mirrored).
	#Pitch -180 = straight up, -90 = straight forward. Roll tips the hands toward each other.
	armPose = [-150.0, 0.0, 22.0]
	#Volume of the breathing loop while a face-covering helmet is on. 0 = off.
	#Range: 0.0 ~ 2.0
	breathingVolume = 0.6
	#How muffled world sounds are while a face-covering helmet is on. 0 = off, 1 = heavy.
	#Range: 0.0 ~ 1.0
	muffle = 0.6
	#Tiny, very short echo of sounds bouncing around inside a face-covering helmet. 0 = off, 1 = strong.
	#Range: 0.0 ~ 1.0
	reverb = 0.7
	#Simple Voice Chat: how muffled YOUR voice sounds to others while your mouth is covered (helmet or respirator). 0 = off.
	#Range: 0.0 ~ 1.0
	voiceMuffle = 0.6
	#First person: degrees your view dips down (head bows) while taking a helmet off or putting it on. 0 = off.
	#Range: 0.0 ~ 60.0
	headDip = 20.0

[spores]
	#Glowing spores drifting through the air in radiation areas.
	enabled = true
	#Biomes that always have spores in the air.
	biomes = ["anomalyzone:red_forest"]
	#Also show spores for a few seconds whenever your radiation dose is climbing (rad anomalies, vents).
	whenIrradiated = true
	#Spores spawned per tick around you (they live ~8-16 s, so 1.0 = roughly 250 in the air).
	#Range: 0.0 ~ 10.0
	density = 1.2
	#How far around you they appear (blocks).
	#Range: 4.0 ~ 48.0
	radius = 18.0
	#Level 4 radiation (the city): extra spores, bigger and darker, drifting down like ash. Multiplier on density. 0 = off.
	#Range: 0.0 ~ 10.0
	heavyLevel4 = 3.0

[combat_audio]
	#Tarkov-style gunshot distance / echo and longer-range footsteps.
	enabled = true
	#TaCZ sounds whose range is at least this many blocks count as gunshots (reloads etc. are 16-24).
	#Range: 1.0 ~ 1000.0
	shotMinRange = 40.0
	#How much distant gunshots lose their crack (high frequencies). 0 = off, 1 = strong.
	#Range: 0.0 ~ 1.0
	shotDarken = 0.85
	#Distance (blocks) where shots start to sound distant: echo begins, crack fades. Closer = dry and sharp.
	#Range: 0.0 ~ 500.0
	tailStart = 60.0
	#Distance (blocks) where the echo tail is at full strength.
	#Range: 1.0 ~ 1000.0
	tailFull = 200.0
	#Loudness of the echo tail. 0 = off.
	#Range: 0.0 ~ 1.0
	tailGain = 0.6
	#How far (blocks) other players', NPCs' and mobs' footsteps can be heard. Vanilla is 16.
	#Range: 16.0 ~ 96.0
	stepRange = 34.0
	#Footstep loudness multiplier for others (vanilla 1.0).
	#Range: 1.0 ~ 6.0
	stepBoost = 2.5
	#Loudness of other players' and NPCs' gunshots (your own gun is unchanged). 1 = TaCZ default.
	#Range: 0.05 ~ 1.0
	otherShotGain = 0.55
	#Volume of every TaCZ sound except gunfire (reloads, draw/holster, inspect, bolt, fire select, dry fire, melee, hit and kill markers). 1 = TaCZ default; 0.65 = 35% quieter.
	#Range: 0.0 ~ 1.0
	taczOtherVolume = 0.65
	#Volume of every sound from Pomkots Mechs Extension. 1 = default; 0.4 = pack default.
	#Range: 0.0 ~ 1.0
	pomkotsExtensionVolume = 0.4
	#0.88: crack/whiz when someone else's bullet passes close to your head (players and NPCs).
	bulletPassby = true
	#How close (blocks) a bullet must pass your head to be heard.
	#Range: 0.5 ~ 8.0
	bulletPassbyRadius = 3.0
	#Loudness of the bullet pass-by.
	#Range: 0.0 ~ 2.0
	bulletPassbyVolume = 1.0
	#0.89.4 (Ward: vanilla ambience in the Deep much too loud): volume of vanilla ambience (cave noises, biome loops / additions / mood)
	#while you are below undergroundAmbienceY. 1 = vanilla.
	#Range: 0.0 ~ 1.0
	undergroundAmbienceVolume = 0.3
	#Height below which undergroundAmbienceVolume applies (the Deep starts around y 0).
	#Range: -64 ~ 320
	undergroundAmbienceY = 20

[ui]
	#Paint over Inventory Free's locked slots in modded screens (backpacks etc.).
	hideLockedSlots = true
	#Fade the hotbar out when you haven't touched it for a while. It comes back when you switch or pick up items.
	hotbarFade = true
	#Seconds before the hotbar starts fading.
	#Range: 0.5 ~ 60.0
	hotbarFadeDelay = 4.0
	#Seconds the fade takes.
	#Range: 0.05 ~ 5.0
	hotbarFadeTime = 0.8
	#XP, hearts, armour and hunger fade with the hotbar. Hearts come back when hurt/healed or low, hunger when low or eating.
	fadeVitals = true
	#Seconds hearts/hunger stay up after a change.
	#Range: 0.5 ~ 60.0
	vitalsShowSeconds = 5.0
	#Hearts always shown at or below this many hearts.
	#Range: 0.0 ~ 20.0
	lowHearts = 4.0
	#Hunger always shown at or below this many drumsticks.
	#Range: 0.0 ~ 10.0
	lowFood = 3.0
	#First person: hide your bare arm when you're holding nothing.
	hideEmptyHand = true
	#Anomaly Zone's health/stamina panel on the left (out from under the ammo counter).
	vitalsLeft = true
	#Distance from the left edge.
	#Range: 0 ~ 400
	vitalsMargin = 8
	#Replace the crosshair with a tiny dot.
	crosshairDot = true
	#Dot colour as ARGB (0xAARRGGBB as a number). Default: white at ~70%.
	#Range: 0 ~ 4294967295
	crosshairDotColor = 3036676095
	#STALKER-style identification: look at someone to see their name and faction (green friendly, red hostile, white neutral).
	factionId = true
	#How far away (blocks) you can identify someone.
	#Range: 4.0 ~ 128.0
	factionIdRange = 48.0
	#Draw the Anomaly Zone PDA at full brightness (it goes dark under shaders otherwise).
	pdaFullbright = true
	#Fade the helmet visor overlay out while the PDA is held up, so its corners aren't hidden.
	pdaHideVisor = true
	#Fog distance (blocks) inside the City of Gresham. 0 = normal fog.
	#Range: 0.0 ~ 512.0
	cityFog = 56.0
	#Anomaly Zone health/stamina panel: show health only while hurt and stamina only while it's being used.
	vitalsAutoHide = true
