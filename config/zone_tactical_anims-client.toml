	pdaJobMarkers = true
	#Zone soundtrack: pick music by place (city, underground, the Bar, day/night, emission) from the Zone Soundtrack resource pack.
	zoneMusic = true
	#Volume of Anomaly Zone's emission siren and rumble (1.0 = as the mod ships it).
	#Range: 0.0 ~ 1.0
