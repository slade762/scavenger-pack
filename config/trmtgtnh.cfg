    # Ground cover that holds its square rather than coming off it, filled in by detection and yours to add to. Saplings and flowers are found automatically; a modded herb or a magical bloom that ought to be spared is one line here. Same format as the lists above - registry names, with any metadata suffix accepted and ignored. Anything named here that is not ground cover in the first place is ignored, because holding is one of two answers to what happens when the ground gives way and a block that was never going to be asked cannot answer either.
    S:groundCoverHoldsBlocks <
        farmersdelight:wild_beetroots
        farmersdelight:wild_cabbages
        farmersdelight:wild_carrots
        farmersdelight:wild_onions
        farmersdelight:wild_potatoes
        farmersdelight:wild_tomatoes
        herbalists_delight:blue_thistle_plant
        herbalists_delight:crimson_tulip_plant
        herbalists_delight:frostcap_plant
        herbalists_delight:ghastleaf_plant
        herbalists_delight:ghost_orchid_plant
        herbalists_delight:glowroot_plant
        herbalists_delight:goldleaf_plant
        herbalists_delight:ironleaf_plant
        herbalists_delight:lavaroot_plant
        herbalists_delight:magmacap_plant
        herbalists_delight:molten_rose_plant
        herbalists_delight:nightshade_berry_bush_plant
        herbalists_delight:redroot_plant
        herbalists_delight:sky_lily_plant
        herbalists_delight:soulbloom_plant
        herbalists_delight:sundew_rose_plant
        herbalists_delight:weeping_fern_plant
        loafcats:catnip
        minecraft:acacia_sapling
        minecraft:allium
        minecraft:azure_bluet
        minecraft:birch_sapling
        minecraft:blue_orchid
        minecraft:cornflower
        minecraft:dandelion
