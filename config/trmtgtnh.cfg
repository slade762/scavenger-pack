# Configuration file

########################################################################################################
# The rules of wear itself: whether it happens, how fast, how far a blast or a fall reaches, and what the tampers cost to use. These belong to the server - a client's copy of them is only used when there is no server, and is overwritten by whatever it connects to.
########################################################################################################

general {
    # Master switch. When false the server stops accumulating wear and tells clients to clear their overlays. Stored data is kept, so turning this back on restores every path exactly as it was.
    B:enabled=true

    # When true, erosion only happens in the dimensions listed below. When false, it happens everywhere except them.
    B:dimensionListIsWhitelist=false

    # Dimensions the whitelist/blacklist above applies to, by number or by name. The Overworld is 0 or minecraft:overworld, the Nether -1 or minecraft:the_nether and the End 1 or minecraft:the_end; any other dimension is listed by its name, as twilightforest:twilight_forest. On the 1.7.10 and 1.12.2 editions a dimension is a number, and a modded one is whatever id its mod was given - which this version cannot recover, so such a number is ignored here and named once in the log, as a name is ignored there. The list ships empty, and empty means opposite things in the two modes: in blacklist mode nothing is excluded, so ground wears everywhere, and in whitelist mode nothing is included, so ground wears nowhere at all. Turning that switch on and leaving this list alone therefore does not narrow erosion down to somewhere sensible - it stops it in every dimension there is, because the dimension test is asked before anything is tracked, worn, broken or tampered with. Name at least one dimension here before setting that switch to whitelist.
    I:dimensionList <
     >

    # Sneaking adds no wear, so you can cross a lawn without leaving a mark.
    B:sneakSuppresses=true

    # Whether wearing a surface in has a small chance to shed something from it: grass drops a random seed - vanilla wheat, or any seed the pack's farming mods have registered - snow drops a snowball, and gravel drops flint. Rolled once each time something wears an exposed surface block in - once however many stages that moves it, so a blast or a landing that drives a square down several sheds at most one thing, while a tamper, which wears a square a gradation at a time, rolls for each gradation it wears in - and only above the very bottom of the world, so an area tamper drops from the ground it exposes rather than from every block in the cube.
    B:wearDropsEnabled=true

    # The chance, from 0 to 1, that a stage of wear on a dropping surface sheds its item. The default is one in a hundred, low enough to be a surprise rather than a way to farm. [range: 0.0 ~ 1.0, default: 0.01]
    D:wearDropChance=0.01

    # Whether a mover that has just worn a block has to leave it alone for a while before it can wear it again. Wear is already counted per block entered rather than per tick, so standing still never wears anything; this is the next step - it stops a mob pacing a pen, or anything jumping on one square, from grinding that square to bare earth without actually going anywhere. The block is freed again once the mover is retriggerBlocks away or retriggerSeconds have passed, whichever comes first.
    B:retriggerCooldown=true

    # Whether that same cooldown is imposed on players too. Off by default: a player laying out a path deliberately should be able to work one spot as hard as they like. On, a player is throttled exactly as mobs are.
    B:retriggerCooldownPlayers=false

    # How many seconds a block a mover just wore is left alone before that same mover may wear it again. Reached at the same time as the distance below - whichever comes first frees the block. 0 turns the time limit off, leaving only the distance one. [range: 0 ~ 600, default: 10]
    I:retriggerSeconds=10

    # How far, measured flat along the ground, a mover has to get from a block it just wore before it may wear it again ahead of the time limit. The point is that walking on somewhere else and coming back is fine, but treading the same square on the spot is not. 0 turns the distance route off, leaving only the time one. [range: 0.0 ~ 64.0, default: 3.0]
    D:retriggerBlocks=3.0

    # Lowest world Y that will ever be tracked. [range: -2032 ~ 2031, default: -64]
    I:minY=-64

    # Highest world Y that will ever be tracked. [range: -2032 ~ 2031, default: 319]
    I:maxY=319

    # When true a fully worn grass block keeps going as bare, then scuffed, earth. When false it stops at the last grass stage, which reads gentler: paths thin out but never go bald. This is the only switch turf answers to. wearThroughToOtherSurfaces below is about materials with a substance of their own to hollow out instead of showing what is under them, which turf has not: it is a face, with no depth of its own, so the earth beneath it is the only rut it can have.
    B:grassWearsThroughToDirt=true

    # Off out of the box. When true a surface that has worn through its own face goes on as a different material rather than hollowing out as more of itself: a stone road breaks into cobble, then into the grit that came off it, then into the earth it was laid on. When false every surface sinks as itself, which is what it did before this existed. It costs nothing in steps - a run is the same length either way and each step costs the same - so this changes what a rut looks like on the way down and nothing else. What each family becomes is families.<name>.wearsThroughTo. Grass is not among them: turf is a face rather than a substance and has no rut of its own to sink into, so it is grassWearsThroughToDirt above, and only that, which decides whether a path through turf ever goes bald. Nor is sculk, which answers to families.sculk.wearsThroughTo alone and ships showing the deep dark's rock in its rut; emptying that list makes it sink as itself.
    B:wearThroughToOtherSurfaces=false

    # Whether one step of wear costs what the ground is made of, or what the top of it currently looks like. A road that has worn through into another surface is still made of what it was made of, and charging its deep half at the price of the grit lying in it would take a stone road from about five thousand two hundred crossings to about two thousand two hundred, and cut the three hundred and twenty in-game days an abandoned one takes to recover to about a hundred and fifty. On, the block underneath decides both wearing and healing, so a family's thresholds and heal time mean what they say however far down its chain a position has been walked. Off restores the older behaviour, where each step was priced by the surface it happens to be drawing as, and grass's earth steps cost dirt's rate again rather than grass's.
    B:wearPaceFollowsTheGround=true

    # Whether worn paths physically hollow out. real: ruts you can walk down into. The server owns the collision, so every client is shown the ruts and cannot switch the overlay off while connected; without that, a player with it off would trip over dips they cannot see. visual: ruts you can see but not feel. Nothing is forced on anyone and the per-player toggle stays free, at the cost of standing slightly above the deepest ruts. off: flat wear only. Per-family depth is families.<name>.maxSinkPixels.
    S:physicalDecay=real

    # Who is told, as they join, that a newer TRMT: Reimagined is out. operators: whoever can update this copy - you in single player, the host of a LAN game, a server's operators. everyone: every player, privately. off: nobody, and the mod never asks. Once a launch, a server reads one small file from GitHub to learn the newest version; nothing about you or your world is sent.
    S:updateNotice=operators

    # Which newer releases updateNotice tells of. relevant: only one that changes this edition - every edition takes the new number with every release, so most releases change only some of them. all: every newer release. A release that changes nothing here is still written in the server's log. A release with a critical fix for this edition says so either way.
    S:updateNoticeReleases=relevant

    # Whether the world's wear is backed up. Every chunk's wear is also written, as the chunk saves, to a small mirror under the world's trmtgtnh/wear folder, and the mirror and this mod's world data (the heal clock, spawn grants and the rest) are frozen into a dated backup under trmtgtnh/backups: five minutes after the server or world starts when the last backup is older than wearBackupHours, then every wearBackupHours of play, before the first load of the world by a different version of this mod, and before /trmt purge. A chunk that loads without the wear the mirror holds for that same save is put back quietly. A bigger loss asks in single player, with Restore, Ignore and Don't ask again for this world; a dedicated server puts the missing wear back by itself and tells its operators as they join, with /trmt wear undo and /trmt wear restore <backup>. Off, none of this runs, and nothing already written is touched.
    B:wearBackups=true

    # Hours of play between scheduled wear backups, counted while the server or world runs. The first comes five minutes after the start when the newest backup is older than this. [range: 1 ~ 168, default: 6]
    I:wearBackupHours=6

    # How many wear backups a world keeps. Past this the oldest go, but never the newest, and never the one taken before a mod update. [range: 1 ~ 100, default: 5]
    I:wearBackupsKept=5

    # The most room a world's wear backups may take, in MB. Past it the oldest go, but never the newest, and never the one taken before a mod update, so those two stay even when they alone are larger. [range: 1 ~ 1048576, default: 256]
    I:wearBackupDiskMb=256

    # One dial over the whole mod. 2.0 means paths form twice as fast and recover twice as fast; 0.5 halves both. Moving both sides together changes how quickly the mod moves without changing its balance. The two rates below tilt one side against the other on top of this. [range: 0.01 ~ 1000.0, default: 1.0]
    D:globalSpeed=1.0

    # Scales every wear threshold at once. 2.0 erodes twice as fast, 0.5 half as fast. The shipped defaults are about eight times slower than upstream TRMT, so 8.0 restores upstream's pace. [range: 0.01 ~ 1000.0, default: 1.0]
    D:erosionSpeed=1.0

    # How far a handful of bone meal can reach when mending worn ground, in blocks. The patch it actually mends is a random size up to this, so repairing a track is a few scattered handfuls rather than one square at a time. 0 mends only the block used. [range: 0 ~ 8, default: 2]
    I:bonemealRadius=2

    # The most gradations one square can be mended by in a single handful. Each square in the patch rolls its own amount, from one gradation up to this, so the mend comes out blotchy rather than uniform. The default is a whole chain, meaning a lucky square can be fully restored. [range: 1 ~ 1000, default: 80]
    I:bonemealMaxSteps=80

    # Whether mending worn ground with bone meal also costs a block of the ground being mended, taken from anywhere in the player's inventory. Every kind of ground the handful mends pays for itself, once: a patch across a grass verge and a cobble road costs a block for the grass and another for the cobble, and a square whose ground you are carrying nothing for is left exactly as it was rather than mended at the expense of whatever you happened to click, and chat says so whenever the handful mended something or was aimed at worn ground. A block bought for one square covers another only when it would have paid for that one too. A block of exactly what is under a square always pays; families.<name>.repairBlocks names what else will, which is what lets grass and paths be mended with ordinary dirt, and healing.repairAnyInFamily lets any block of the same family pay. Nothing is taken for a handful that mended nothing. Creative pays nothing. Off restores the old behaviour, where a handful of bone meal repaired a season of traffic for nothing but the bone meal; bone meal spent from a player's hand still earns experience then, and a dispenser or another mod's fertiliser earns none. The chunk tamper is paid by this same rule and switched by this same setting, so off makes its mending free of material too - and because a chunk tamper that spends no material earns no experience, off also means a chunk tamper never earns any. A golem pays by this same rule but is not switched by this setting: off, it still spends its blocks, because a keeper that cost nothing to run would never need looking after. See golem.blockCost.
    B:bonemealCostsABlock=true

    # How far along its run any surface may wear, as a fraction of the whole - so 0.25 stops everything at a quarter of its eighty steps, about where a path is a path and not yet a hollow. A ceiling on the finished look rather than on the rate: ground still wears at whatever speed it was going to and simply stops when it arrives here. Each family has its own ceiling too, in families.<name>.maxWear, and whichever is lower wins. [range: 0.0 ~ 1.0, default: 1.0]
    D:maxWearFraction=1.0

    # Whether changing which blocks wear, and which creatures wear it, from the magic tamper's screen, is an operator's privilege. On by default because it writes this config and reloads it, which is not something one player should be able to do to everybody else's world. A player without the privilege is not shown the controls at all rather than shown them and refused.
    B:familyEditorOperatorsOnly=true

    # Scales how long a tamper lasts against its grade's own figure - 512 uses for iron, 256 for gold, 2048 for diamond and 4096 for netherite, read from the third field of each tamperGrades entry rather than from anything here. Only a gesture that actually changed something costs a use, so brushing one along ordinary ground is free. It never reaches nought: anything under a hundredth is held at a hundredth and every tamper keeps at least one use, so a very small figure makes tampers nearly disposable rather than unbreakable - the Wayfarer's is the one that never wears. Read live, so a change applies at once to every tamper, including one already in somebody's hand; lower it far enough and a well-used tamper can be left with fewer uses than it has already spent, and it breaks on its next one. [range: 0.0 ~ 10.0, default: 1.0]
    D:tamperDurabilityScale=1.0

    # How far out of the clicked block a newly made chunk tamper reaches, so 2 is a five-by-five-by-five cube. Right-clicking the air walks it up a step and round, and the tooltip says where it is. [range: 0 ~ 7, default: 2]
    I:chunkTamperDefaultReach=2

    # The furthest a chunk tamper may be set to reach. Seven is a fifteen-by-fifteen-by-fifteen cube, which is a chunk's width; the ceiling is there because the cost of a gesture goes as the cube of this number. [range: 0 ~ 7, default: 7]
    I:chunkTamperMaxReach=7

    # The most gradations one chunk tamper gesture may move a position. Sneak and right-click the air to walk it up. Every gradation put back is paid for, so a gesture costs as much as it puts back: over any real area of ground worn eight deep, a use set to eight costs very nearly eight times a use set to one - not quite, on a handful of squares, because the last block of each kind of ground is rounded up either way. See chunkTamperGradationsPerBlock. [range: 1 ~ 16, default: 8]
    I:chunkTamperMaxSteps=8

    # How many gradations of wear one block of material pays a chunk tamper to put back. Priced by the gradation rather than by the square, so filling a deep rut costs what it is deep: at the default a fifteen-by-fifteen layer of one kind of worn ground costs 57 blocks mended one gradation deep and 450 mended eight deep, about a quarter of what the hand tamper's single-square mend would charge for the same gradations at its own default. Each square in the cube is paid for from blocks that would mend it, by bone meal's rule (see bonemealCostsABlock, which also switches this cost off), and each kind of ground is rounded up on its own, so a cube holding one worn square of grass and one of cobble spends a block of each - and so does one holding grass and bare earth, although both are mended with earth. A block is taken only once the gradation it pays for has gone back, and ground whose material runs out is left as it is from there on, with a line in chat to say how many squares were. Replaces chunkTamperPositionsPerBlock, which counted positions however deep each was mended; a figure set under that name is carried across unchanged. A golem carrying a chunk tamper or the Wayfarer's is priced from this figure too: golem.blockCost blocks buy this many gradations of one kind of ground, rounded up for each kind on each stroke. A golem with a plain tamper puts back a single gradation a stroke, so it pays the whole of golem.blockCost for each one whatever this says. See golem.blockCost. [range: 1 ~ 256, default: 4]
    I:chunkTamperGradationsPerBlock=4

    # What the demonstrate command puts one of every item into, tried in the order written and settling on the first this pack can supply. A metadata suffix written as 'mod:block:meta' is read and ignored at this version, where the variants it used to pick out are separate blocks with names of their own - so a pack wanting a particular Iron Chest names it, 'ironchest:diamond_chest' for the roomiest. The default list is the older editions' and names blocks by their names there, so on a pack that has none of them the demonstration settles on a vanilla chest and places a second beside it when the list does not fit. Where a container is still too small a second is placed beside it, which for a vanilla chest is a double chest. Anything outside vanilla is skipped when the GTNH enhancements are off.
    S:demoContainer <
        Avaritia:Infinity_Chest
        IronChest:BlockIronChest:9
        minecraft:chest
     >

    # Whether the mod adds its own advancements - sixteen of them, on a tab of their own, with everything below switched on: the three tampers, the three modes an enchantment unlocks and the enchanted book that carries each one's lesson, the four guide books and the shelf for having read every one of them, standing a golem up, and the All Ways upgrade. Fewer where a pack cannot reach one of them. A mode and its book are registered only where that enchantment is both switched on and actually holding an id - the ids are claimed whatever the switches say, so that a tool already carrying one does not break when somebody turns the feature off, which means a claimed id alone proves nothing about whether anybody can use it. The golem and its upgrade go the same way. An advancement nobody in the pack can earn would sit on the tab for ever with no way to clear it. The setting keeps the name it has in the older editions, where these are achievements rather than advancements and sit on a page rather than a tab, so a settings file carries between versions unchanged. Off, nothing is registered and no advancement is ever awarded.
    B:achievements=true

    # How long, in REAL seconds, a broken block's record - its wear, its reinforcement, its spawn ward - is held in case the same block is put back. Put the exact same block back at the exact same spot inside this window and everything it carried returns; put a different block there and the record simply waits, so swapping a block out and back still works. After the window it is dropped for good. 0 turns this off and a break forgets immediately. [range: 0 ~ 86400, default: 900]
    I:blockBreakGraceSeconds=900

    # The grades a tamper and a chunk tamper can be made at, as name:oreName:uses:reach - reach is optional and is worked out from durability when it is left out, so a three-field entry is still valid. Any whose ore name the pack does not supply is skipped, so this same list works on plain vanilla and on GregTech. Durability is capped at 32767 whatever is written here, because a stack's damage is a short on disk and a larger number wraps negative the first time the world saves. The grade rides in the item's own data, so adding or removing one never touches a save's id map. The Wayfarer's tamper is built around a chunk tamper of one of these grades: netherite where integration.gtnhEnhanced is on and a netherite chunk tamper can be made, diamond where one can, and otherwise whichever grade that can be made has the most uses written against it, the first of equals in this list winning. So taking the diamond line out, or pointing it at an ore this pack does not supply, moves the Wayfarer onto another metal rather than leaving it uncraftable - and on the shipped list that is neutronium wherever the pack registers its ingot. It goes without a recipe, with a warning in the log, only where no grade here can be made into a chunk tamper or nothing is registered as blockDiamond. The grades are worked out once, as the game or server starts: /trmt reload and the settings screen read a changed list into memory, but no tamper, recipe or grade follows it until the next start.
    S:tamperGrades <
        iron:ingotIron:512:1
        gold:ingotGold:256:3
        diamond:gemDiamond:2048:2
        netherite:ingotNetherite:4096:3
        bronze:ingotBronze:768:1
        steel:ingotSteel:1536:2
        aluminium:ingotAluminium:2048:2
        stainlesssteel:ingotStainlessSteel:4096:3
        titanium:ingotTitanium:8192:3
        tungstensteel:ingotTungstenSteel:16384:4
        neutronium:ingotNeutronium:32767:4
        copper:ingotCopper:384
        tin:ingotTin:300
        lead:ingotLead:384
        nickel:ingotNickel:640
        zinc:ingotZinc:384
        silver:ingotSilver:512
        electrum:ingotElectrum:480
        invar:ingotInvar:900
        cupronickel:ingotCupronickel:640
        brass:ingotBrass:512
        wroughtiron:ingotWroughtIron:512
        tungsten:ingotTungsten:2600
        cobalt:ingotCobalt:1100
        chrome:ingotChrome:900
        nichrome:ingotNichrome:1200
        kanthal:ingotKanthal:1400
        tungstencarbide:ingotTungstenCarbide:9000
        hssg:ingotHSSG:5120
        hsse:ingotHSSE:7000
        hsss:ingotHSSS:8000
        damascussteel:ingotDamascusSteel:2600
        osmium:ingotOsmium:3400
        iridium:ingotIridium:12000
        platinum:ingotPlatinum:2000
        palladium:ingotPalladium:2200
        manganese:ingotManganese:512
        tantalum:ingotTantalum:1800
        molybdenum:ingotMolybdenum:1600
        vanadiumsteel:ingotVanadiumSteel:3200
        darksteel:ingotDarkSteel:2400
        redsteel:ingotRedSteel:3000
        bluesteel:ingotBlueSteel:3600
     >

    # What one right-click mend costs, in blocks of whatever the worn ground drops - earth under grass, cobble under stone. That gesture mends a scattered patch the size of the tamper's tier, which is why it costs more than the single-square mend. The price is charged once for each kind of ground the patch actually mends, taken as the first gradation of it goes back: a patch across a grass verge and a cobble road costs this in earth and this again in cobble, a stone floor beside a cobble road pays it twice although both are mended with cobble, cobble bought for one square never pays for mossy cobble or granite beside it, a square whose material you are not carrying is left as it was with a line in chat to say so, and a patch that mends nothing costs nothing. 0 makes this mend free, and free mending earns no experience, so at 0 this gesture never does. [range: 0 ~ 64, default: 2]
    I:tamperPatchCost=2

    # What one sneak + left-click mend costs, in blocks of whatever the worn ground drops, taken once the gradation has actually gone back. That gesture mends exactly one gradation of exactly one square. 0 makes it free, and free mending earns no experience, so at 0 this gesture never does: otherwise wearing a square in and mending it out again would be an experience farm with nothing to slow it but the tool. [range: 0 ~ 64, default: 1]
    I:tamperMendCost=1

    # The least time between two left-click gestures on the same square, in ticks. A new square always goes through immediately, so dragging a held click along a route paints it at full speed. This exists for creative, where the client re-sends the click four times a second for as long as the button is down and sends nothing at all when it is let go. [range: 0 ~ 100, default: 10]
    I:tamperCooldownTicks=10

    # Whether left-clicking with a tamper wears ground in deliberately. Turning this off leaves the tool able to mend and to pin, so paths can only ever be made by walking them.
    B:tamperCanWear=true

    # Whether sneak + right-clicking with a tamper pins a square against both wear and healing. A pin holds indefinitely and against everyone, so a server that would rather nobody could freeze its terrain should turn this off.
    B:tamperCanPin=true

    # Whether a block placed directly on worn ground hides the wear under it. Only the drawing stops - the wear is kept exactly as it was, so breaking the block on top brings the same path straight back. It is not a way to repair ground by paving over it.
    B:hideWearUnderBlocks=true

    # What hideWearUnderBlocks actually does when something is built on worn ground. On, the ground keeps the texture of the wear it has and simply fills its own cube again, so a path that runs under a block still reads as a path and only its dip goes away. Off, the wear is not drawn at all and the plain block shows through. Either way the wear itself is untouched and comes straight back when the block on top is broken. Has no effect unless hideWearUnderBlocks is on.
    B:flattenWearUnderBlocks=true

}

########################################################################################################
# What this mod writes for other mods that are here, and never links against. Quest chapters and trophy definitions are generated as those mods' own data files, which is why they need nothing on the compile path and cost nothing at all when the mod they are for is absent. The viaRomana settings are how worn ground and Via Romana's charted roads work together where Via Romana is installed: Via Romana is asked by name and never linked either, and without it they do nothing.
########################################################################################################

integration {
    # The pack personality switch. On, the mod tunes itself to the companion mods a GregTech pack ships: harder recipes, the compressed-block golem build, a Wayfarer built around a netherite chunk tamper where the pack can make one, tiered material costs, and the quest chapter written for BetterQuesting or FTB Quests. Off, all of that falls back to plain vanilla-Forge behaviour - plain recipes, a golem built from vanilla blocks only, a Wayfarer that no longer prefers netherite, and no quest chapter written, though a chapter an earlier launch wrote is left where it is. It is not a switch for every companion mod, whatever it once said. Trophies answer to integration.trophies and the chest finds to the loot settings, and neither asks this: neither changes what anything costs, so neither has a plainer version to fall back to, and turning this off removes no trophy and takes nothing out of any chest - loot.lootFinds is the switch that takes every find out. The map coloring and tooltip readouts, which change no gameplay, are not reached by it either. The default is decided the first time this file is written - on when GregTech is installed, off otherwise - and then kept, so a pack that ran once before GregTech was added keeps this off until it is turned on here.
    B:gtnhEnhanced=false

    # Whether an operator entering a world whose questbook has no chapter for this mod is told so, once, with the command that adds it. Only when it is actually true: the world's own quest database is read as it loads, and nothing is said on a world that already has the chapter, on a world new enough to have taken it as it was made, or in a pack that has told BetterQuesting to re-import its defaults on every load and will therefore take it unaided. Off, the chapter is still written for any world that has not yet been made; nobody is simply told about the ones that have.
    B:questbookNotice=true

    # Whether a quest line for this mod is written into config/betterquesting/DefaultQuests for BetterQuesting to pick up - seventeen quests covering wearing ground down, mending it, all three tampers, all three enchantments, the four books, the golem and its upgrades, with loot bag and Pam's food rewards pitched to sit alongside the pack's own. Fewer where a pack cannot reach one: a quest whose item does not exist is left out, and so is an enchantment's quest with reinforce.enabled, spawnward.enabled or pathlight.enabled off or with no free id for it to sit at, the golem's quests other than its book with golem.enabled off, and the All Ways quest with golem.upgrades off. Nothing is written unfinishable, whatever depended on a quest left out re-parents onto what is left, and the Wayfarer's Tamper offered as the last quest's prize carries only the enchantments the chapter still teaches. Turning one of those switches either way rewrites the folder at the next start, but only the folder: a world that has already taken the chapter keeps the quests it was given, and whether importing it again takes away one since left out is BetterQuesting's to decide. The write is additive: two new folders, one appended line in the tab order, and no existing quest file touched. Nothing is loaded into a running world - run /bq_admin default load when you want it. Requires the GTNH enhancements above and BetterQuesting to be installed.
    B:questbook=true

    # Whether trophy definitions are written into config/amazingtrophies/trophies/trmtgtnh for Amazing Trophies to pick up - seven of them, one each for the Wayfarer, each of the three unlock enchantments bound into a book, standing a golem up, the All Ways upgrade, and reading every guide book. Fewer where a pack has no part for one: a trophy whose advancement does not exist, because its feature is switched off, its item never registered or its enchantment found no free id, is left out rather than written unearnable. Inside that mod's own folder because that is the only place it looks, in a subfolder of this mod's own so nothing written here can collide with the pack's; it reads the whole tree and ignores anything that is not a .json. While trophies are being written the folder carries a fingerprint of what was written and is rewritten whenever that changes, so the list cannot go stale. The GTNH enhancements above are not asked, so a pack with them off still gets every trophy. Requires the advancements above, since every trophy is earned by earning one, and Amazing Trophies to be installed; on without either, nothing is written. Turning this off, or the advancements, stops the writing and takes nothing back: a folder an earlier launch wrote stays where it is and Amazing Trophies goes on reading it, trophies whose advancements no longer exist included, so delete that folder as well to take them away. The default is decided the first time this file is written - on when Amazing Trophies is installed - and then kept, so a pack that ran once before Amazing Trophies was added has this set false and writes nothing until it is turned on here.
    B:trophies=false

    # Via Romana only, and does nothing without it. From which gradation of its wear a worn square counts as a road block to Via Romana, so that a desire path walked into the world can be charted and its signs linked like a built road. Counted along the square's own run from untouched to as worn as it gets, the first visible wear being 1. 0, the default, is the gradation at which the square is drawn as bare path: the first after its face's own run, where turf has worn through to the earth beneath it and the ground drops its first pixel - the seventeenth for grass at the shipped settings - or the last a square can reach, where its run never sinks or a wear ceiling stops it short. A number past the run is never reached, so nothing worn counts. A worn square over a block Via Romana already counts as road, such as a dirt path or a cobbled road, counts as that block whatever this says. Via Romana asks this as a player charts, on that player's own machine, so on a server it is each player's own copy of this setting that decides what their charting counts. [range: 0 ~ 256, default: 0]
    I:viaRomanaRoadGradation=0

    # Via Romana only, and does nothing without it. Whether a fast trip along a charted road wears that road as if it had been walked. Once the traveller lands, each square of the road between the node they left and the node they reached is given integration.viaRomanaTripSteps of one ordinary player step (multipliers.player), through the same step a footstep takes, and the squares either side of it what a step bleeds onto them (multipliers.bleedSide). The road is the one with the fewest nodes between the two. Squares in chunks nobody has loaded are not loaded for it and wear nothing, and a trip that never lands, to a destination Via Romana calls unsafe, wears nothing. Off by default.
    B:viaRomanaTripWear=false

    # Via Romana only, and does nothing without it or with integration.viaRomanaTripWear off. How much a fast trip wears each square of the road it goes along, as a multiple of one ordinary player step: 1.0, the default, is one step, as though the traveller had walked the road once; 2.0 is two; 0 wears nothing. [range: 0.0 ~ 64.0, default: 1.0]
    D:viaRomanaTripSteps=1.0

    # Via Romana only, and does nothing without it. How fast a worn square on a charted Via Romana road heals, against the speed it would heal at anywhere else: 0.5, the default, is half speed, so a linked road nobody uses still fades back to grass in the end, only twice as slowly; 0 is never, and the square is held against time as a pinned square is; 1 heals it as any other ground. A square is on the road when it lies on the straight line between two joined nodes of a charted path, or on the square either side of that line, within two blocks of its height. [range: 0.0 ~ 1.0, default: 0.5]
    D:viaRomanaRoadHealing=0.5

}

########################################################################################################
# Which blocks wear at all, and how the mod decides. Detection runs at startup, writes what it found back into the family lists below, and never removes an entry - so the exclude list here is the way to take a block back out, and it is consulted by both the detection path and the hand-written lists.
########################################################################################################

surfaces {
    # Scan every installed block at startup and sort grass-, dirt-, sand-, gravel- and stone-like blocks into families automatically. This is what makes the mod cover the pack's modded terrain without naming each block by hand. Run /trmt surfaces to see what it found; per-family detection toggles and manual block lists live under the families category.
    B:autoDetect=true

    # Write everything detection finds into the per-family blocks lists, so you can see what it decided. To drop one block while leaving detection on, add it to the exclude list below; removing it from a blocks list only sticks once autoDetect is off, because detection would otherwise put it straight back.
    B:writeDetectedToConfig=true

    # Set by the mod, once. Builds before 0.9.229 worked out what each block is at the title screen, before any world's data said which blocks are in the leaves tag, and wrote the answer into the lists: a block a mod puts in that tag without being a leaves block in code (Better End's furs and outer leaves, Regions Unexplored's Spanish moss and Joshua leaves) went into the vegetation list, and into groundCoverBlocks where it grows on the ground, and stayed there. The first time a world loads with this false, those lines are taken out, and only those: each such block's bare name in those two lists, where the block is in the leaves tag, is not a leaves block in code, and detection makes it leaves. Each name taken out is written to the log, and this is set true so it never runs again. Put a name back after that and it stays where you put it.
    B:leavesTagLinesMended=true

    # Blocks that must never erode, whatever detection concludes. Registry names only, no metadata. Tilled soil is here because a field someone hoed should stay a field; paths are deliberately not, and resist wear instead - see families.dirt.resistantBlocks. Natura's double grass slab is a shape somebody built out of turf rather than ground that grew, and Amun-Ra's red grass turns itself into methane dirt anywhere but its own world, so wearing either is showing you something that is about to stop existing.
    S:exclude <
        minecraft:farmland
        etfuturum:farmland
        minecraft:tilled_field
        Natura:GrassSlabDouble
        GalacticraftAmunRa:tile.baseGrass
     >

    # Upper bound on how many distinct block faces get their own generated wear textures. Anything past it falls back to the family's vanilla-derived set, which is why a modded block would wear into a vanilla one. Metadata values that draw the same face share a set, so this counts faces rather than block states. Faces are offered their places in the plan's order: vanilla's own ground first, then every other face by registry name, so what this turns away is the last of a mod's faces before any of the vanilla ground a path is worn across. The default of 2048 holds the largest pack measured whole, 1513 faces on 1.20.1 with Chisel, Chipped and Rechiseled, with room to spare. It is not the only limit. The block atlas is measured at every stitch, and when the faces this lets through would not fit in the room it actually has, the ramp is drawn more coarsely first, never below sixteen gradations, and past that the faces last in the plan's order, vanilla's ground first and the rest by registry name, fall back too - so once the log says the atlas stopped the plan, raising this changes nothing. Zero gives no block its own wear at all. [range: 0 ~ 4096, default: 2048]
    I:maxTexturedSurfaces=2048

    # Also scan for ground cover at startup: the thin plant-material decorations that grow out of whatever is under them - tall grass, flowers, saplings, dead bushes and the modded equivalents. These are not surfaces and never wear; the list only decides what trampling.groundCover is allowed to knock down. What it finds is written into groundCoverBlocks below, the same way the family lists are filled in.
    B:groundCoverAutoDetect=true

    # Blocks that count as ground cover, filled in by detection and yours to add to. Registry names. A metadata suffix written for an older edition - 'biomesoplenty:foliage:15' - is accepted and ignored rather than refused, so a settings file moved from 1.7.10 or 1.12.2 still loads and still means the block it names; what it cannot mean any more is one variant of that block, because variants are separate blocks at this version and have names of their own. Use groundCoverExclude to take a block back out; removing it from here only sticks with detection off, because detection would put it straight back.
    S:groundCoverBlocks <
        farmersdelight:brown_mushroom_colony
        farmersdelight:budding_tomatoes
        farmersdelight:cabbages
        farmersdelight:onions
        farmersdelight:red_mushroom_colony
