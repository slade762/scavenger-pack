########################################################################################################
# The settings this server sets for its players' own: what each player's game is held to, or offered, while they are connected.
########################################################################################################

clientrules {
    # Settings this server sets for every player who joins, a line each: <setting> = <value> force, or suggest. A setting is named by its place in this file, client.glowingWear, presets.quality or families.sand.wearPattern, and only a client setting may be named: everything under client but settleOnWornGround, which the server's own rules already carry; presets.quality; and each family's wearPattern, classicWear and wearStrength. force holds the setting at this value while a player is connected and locks it in their settings menu; suggest applies it when they join and leaves them free to change it back, for that visit. Anything not listed stays each player's own, and nothing here is ever written to a player's own file: leaving gives them all their own settings back. A setting that rebuilds the wear pictures is applied once at join, with one reload. A player on a build older than 0.9.229 keeps their own. /trmt clientrules list, set, clear, clearall and copy change this list while the server runs, and send it to everyone online.
    S:rules <
     >

}

