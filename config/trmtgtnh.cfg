        # Which surfaces this one exposes as it wears through, named the way the headings here name them - grass, dirt, sand, gravel, stone, cobble, snow, ice, nether, end, flesh, taint, sculk, cloud - and listed in the order the ground reaches them. Stone shows cobble, then the grit that broke off it, then the earth the road was laid on; grass shows the earth it was growing out of. The pixels of depth this family sinks are shared out between however many are listed, earliest first, so the list changes what a rut looks like on the way down and changes neither how many steps it takes to get there nor what any of them costs. A name that is this family's own, a name nothing matches, and a family that is switched off are all skipped. Empty means the ground hollows out as itself, which is what sand and snow do. Turned off wholesale by general.wearThroughToOtherSurfaces - except for grass, which has no depth of its own to hollow out and so answers to general.grassWearsThroughToDirt instead, and sculk, which answers to this list alone: it ships showing the deep dark's rock in its rut, and emptying the list makes it sink as itself.
        S:wearsThroughTo <
            stone
         >

    }

    ########################################################################################################
    # Everything about how cloud wears: whether it does, how many gradations it goes through, how deep it sinks under foot, how long it takes to recover, and which blocks count as it. The blocks list is filled in by startup detection and is also yours to edit - see the surfaces heading for how removing an entry actually works.
    ########################################################################################################

    cloud {
        # Whether cloud surfaces erode at all.
        B:enabled=true

        # Whether slabs cut from cloud wear too. There is nothing separate to tune: a slab walks the same chain at the same prices as a whole block of the same stuff, so it takes exactly as many crossings to wear through and exactly as long to recover, and the only difference is that the rut is drawn half as deep - half a block cannot lose eight pixels and still be there. Detection finds them the same way it finds everything else, by what the block is made of and what it is called with the shape word taken off, so a modded slab of this material is included without anybody naming it.
        B:slabs=true

        # Whether stairs cut from cloud wear too, on the same terms as slabs above: the same chain, the same prices, and no depth at all. A stair states its own shape and never has a height clamped onto it, so it shows every gradation of its wear in its face and none of it underfoot - which is the one way a stair differs from the slab above, and is why it is worth its own switch.
        B:stairs=true

        # Whether startup detection may classify installed blocks into this family. Turn off and use the list below to control it by hand.
        B:autoDetect=true

        # Blocks treated as cloud. Detection fills this in with what it found, so it doubles as a record of what is actually being affected; anything you add by hand is kept. Format: modid:block, modid:block:meta, or modid:block:* for every metadata. Removing an entry only sticks once surfaces.autoDetect is off, because with it on detection puts the block straight back - use surfaces.exclude for that instead.
        S:blocks <
         >

        # How many wear gradations this surface shows before it starts to sink. Once it does, each further pixel of depth gets 'layersPerDepth' gradations of its own, so the whole run from untouched to the deepest rut is usually stages + layersPerDepth * maxSinkPixels steps - eighty at the shipped figures, and forty-eight for ice, which sinks only half as far as the rest. Two of the headings here are not that arithmetic, and both are worth knowing before pricing anything against it. Grass has no depth of its own, because turf is a face rather than a substance, so it has no pixels to measure a run in and borrows them from the first surface it wears through into: with general.grassWearsThroughToDirt on, which is how it ships, grass runs earth's eighty steps rather than the sixteen this sum would give, and with that switch off there is nothing to borrow from and the chain really does stop dead at sixteen. Dirt is one step shorter than the sum rather than longer, because a ghost showing no wear at all is indistinguishable from the earth it is covering, so dirt's first layer is skipped and its run is seventy-nine. Both figures matter beyond curiosity, since a run's length is what healDaysPerStage below is multiplied by for how long a fully worn path takes to fade. The wear table in game reads the real chain for every family, so it is the place to check a run after changing anything here. [range: 1 ~ 16, default: 16]
        I:stages=16

        # Wear needed to advance one stage, lower bound of the per-position random draw. The draw is what keeps path edges ragged instead of geometric. [range: 0.0 ~ 1000000.0, default: 0.8]
        D:thresholdMin=0.8

        # Upper bound of the per-position random draw. [range: 0.0 ~ 1000000.0, default: 1.6]
        D:thresholdMax=1.6

        # In-game days this family's stage must go untouched before it steps back. What a fully worn path costs altogether is this times the length of the family's whole run, and that run is longer than the stages figure above suggests: each pixel of depth adds layersPerDepth gradations of its own, and a family with no depth of its own takes both of those figures from the first surface it wears through into, because the ground beneath is then the only rut it can have. Which is why turf, whose maxSinkPixels is nought, still runs eighty gradations - sixteen of thinning green and then sixty-four down through the earth - and takes a hundred and twenty-five days to go rather than the twenty-five its own stages alone would come to. Turn general.grassWearsThroughToDirt off and there is nothing left for it to borrow: the run stops at sixteen, and twenty-five days is then the honest figure. Earth is one gradation shorter than the arithmetic gives, because a ghost showing no wear at all is indistinguishable from the dirt it is lying on and so its first layer is skipped; its run is seventy-nine rather than eighty, which is why its default is written as a hundred days divided by seventy-nine and comes out at a hundred exactly. All of this holds while general.wearPaceFollowsTheGround is on, which is how it ships, and that switch is what keeps every gradation of a run mended at the rate of the ground the path is made of rather than at the rate of whatever it happens to be drawn as by then. The wear table in game works the total out for every family from these same numbers and is the place to read it after changing one. Healing is applied from the world clock when a chunk loads, so a chunk nobody has visited still recovers. This is the family's own figure and is not worked out from its wear cost: what it takes to mark a surface and what it takes for that mark to fade are genuinely different questions, and snow against sand is the pair that proves it. [range: 0.01 ~ 100000.0, default: 0.125]
        D:healDaysPerStage=0.125

        # How the price of a gradation changes as this surface wears further down its run. Every step used to cost the same, which is not what any of these surfaces do and is why early wear read as inert: the gradation you actually watch appear, the first, cost exactly as much as the last. flat holds one price the whole way, which is right for dressed stone - it does not compact underfoot, and the hundredth scuff costs what the first did. sod starts cheap and ends about four fifths dearer, for turf that tears at a touch over earth that is packed and rooted and does not. settle climbs to two and a half times, for sand and gravel, which displace under the first passes and then settle into a shape they have already found. pack climbs fourfold and stops climbing three quarters of the way along, for snow: one footfall in fresh powder is a whole gradation, what it leaves is packed snow and a different substance, and once thoroughly packed there is nothing left to compress. glaze climbs twelvefold in a straight line and never levels off at all, for ice, which does not compact and settle but merely polishes what is left, so every gradation is dearer than the one before it right to the end. Whichever is chosen, the total does not move. The multipliers over a whole run average to exactly one, so a curve only redistributes what the run costs - it can never quietly make a family easier or harder while appearing to be a change of shape, and every figure in the wear table survives changing it. What changes is where the cost sits: how quickly a path first shows, against how hard it is to drive one all the way down.
        S:costCurve=pack

        # Whether this surface recovers only while it is being rained on - or snowed on, for snow and ice, which is the same weather asked of a colder place. Off, which is how every family ships, it recovers on the clock alone. On, the days it is owed still bank up exactly as they did, so nothing is lost by a dry spell and a chunk nobody has visited for a month still holds every day of it; what changes is that the debt is only paid while something is actually falling, and paid a gradation at a time rather than all at once. Read the weather heading before switching this on: three settings there decide whether sheltered ground, dry biomes and weatherless dimensions are excluded, and each of those is a place where this can quietly mean never.
        B:healsOnlyWhenWet=false

        # How much faster this surface recovers while rain is actually falling on it. One is no difference at all and is what stone, cobble, netherrack and end stone ship with; two, which is what turf, earth, sand and gravel ship with, means a rut mends in half the untouched days while it is raining on it. Unlike the healsOnlyWhenWet switch above, this can never mean never - it is a discount rather than a gate, so ground the rain cannot reach simply does not earn it and mends at its ordinary rate, and anything under one is read as one. Whether rain is reaching a particular square is decided by the same three settings under the weather heading that the switch above uses: an open sky, a biome that has weather, and a dimension that has any. A family that IS waiting for weather does not also get the discount, because that would be paying for the same storm twice. [range: 0.0 ~ 1000000.0, default: 1.0]
        D:wetRecoverySpeed=1.0

        # Which wear look shapes this family's textures, all worked from the block's own pixels so any of them is safe on a block nobody drew art for. grass takes the cover off in patches and lets the face underneath show through, which is what turf does and what anything with a different underside does - podzol, mycelium, mossy stone over clean. crack dulls a surface down and splits it open, for stone that fissures and grimes over rather than polishing smooth, and crack_lite is the same run stopped a little over halfway along, so a face grimes and hairlines without ever breaking up. smooth flattens a surface toward its own average, for something that buffs shiny underfoot, and smooth_heavy takes rather more of the relief with it, leaving about a third of the light and dark the block began with. dirt rubs a growing patch of the surface away, which is what a trodden path is, and dirt_lite rubs a narrower and shallower one, leaving three fifths of the face exactly as it was. The last four do two of those in one look, and every id is written in the order its own halves run, so a file says what will happen without anybody reading the source. smooth_crack and smooth_dirt buff the whole face flat before cracking it or before wearing a track across part of it, because everything the second half of those aims at is read out of the surface it is handed and buffing afterwards would only close up the fissures and the track that had just been made. crack_dirt goes the other way round, and for a measured reason rather than a preference: a crack run last blurs a track's edge away to a quarter of what it was, while a track worn last leaves two fifths of the face carrying the fracture network exactly as a plain crack drew it, pixel for pixel. It is shown in the wear table as cracked rubbed, and crack_dirt_lite is that same run stopped early - the identical call with the eased progress at 0.55 of itself and nothing else altered, so every picture it draws is one crack_dirt genuinely passes through, pixel for pixel. It is shown in the wear table as cracked rubbed lite. The four after those were made for one material each and are named for it. flesh darkens a growing trodden patch toward the block's own shadow color, closes its grain up and puts a few wet highlights on its raised points, for something soft that bruises rather than wears. taint darkens the ground in spreading blotches while the block's own lighter strands, and a fine network drawn over them, swell toward its brightest color, for a blight that grows back over a path. sculk puts most of the block's glints out one at a time, keeps about a fifth of them lit to the end, and flattens, greys and dulls the rest of the face, for a living skin trodden still. cloud packs the whole face flatter and presses a denser, slightly greyer track into it with a lighter rim of pushed-up fluff, for a soft white solid. Seven more were made for the older families, each named for its material and what a foot does to it: sand_trodden packs a firmer, darker line with loose grains heaped lighter along its edges; gravel_parted opens the gaps between stones and darkens them while the whole trodden ground grimes over, so the flint stands out; cobble_polished polishes the stone tops smooth and dulls them, grinds the mortar darker, and from a quarter of the way cracks and scuffs them, more finely and darker still toward the end; snow_packed packs a smoother, cooler, grey-blue track, walked in darker in patches, with a few glassy glints; ice_scuffed clouds the surface toward white frost in a spreading haze crossed by fine scratches, and past three quarters of the way dark cracks open through it; nether_charred chars a track darker, flatter and sootier, with flecks of ash; end_bleached bleaches a track paler, greyer and polished smooth, unevenly, with grit ground into it and, from two fifths of the way, a faint network of cracks. Each takes every color it uses from the block itself, lightened, darkened or greyed, so each is as safe on any block as the rest. dirt is what anything unrecognised falls back to - including the older sand and polish names, which are still read so that no file breaks. Read by your own client and by nobody else, so this is your choice on somebody else's server as much as in a world of your own, and a server's copy of this key changes nothing for anybody. Change this to experiment: a family's whole look follows from it. Each family with a look made for it ships that look; the look it shipped with before is its classic look, which classicWear below and client.classicWear bring back while this names the shipped default, and any other look written here wins over both. A file an earlier build wrote with the old default here untouched is moved on to the new default the first time this build reads it.
        S:wearPattern=cloud

        # Whether cloud is drawn in its classic look, dirt_lite, the one it shipped with before the look made for it, cloud. Only while wearPattern above names cloud: a look written there by hand wins over this. client.classicWear does the same for every family that has a classic look. Read by your own client and by nobody else. Takes effect on the next resource reload.
        B:classicWear=false

        # How strongly the pattern is applied, 0 to 1. Lower values leave more of the block's original character showing through. [range: 0.0 ~ 1000000.0, default: 1.0]
        D:wearStrength=1.0

        # How many visual gradations this family shows between one pixel of sinking and the next. The first run, before anything has sunk, uses the longer 'stages' count instead: that is the wear people actually watch, and it earns the detail. [range: 1 ~ 16, default: 8]
        I:layersPerDepth=8

        # How far this family's most worn stage physically sinks, in sixteenths of a block. 0 means it only ever discolors, unless it wears through into another surface: then it sinks as deep as the first of those, with that surface's layersPerDepth, which is how grass gets its rut. Whether that sinking is something you can walk down into or only something you can see is set by physicalDecay in the general category. [range: 0 ~ 15, default: 4]
        I:maxSinkPixels=4

        # Blocks in this family that wear far more slowly, listed the same way as the blocks setting above. Grass paths are here by default: someone already made that path on purpose, so it should stand up to traffic rather than being immune to it or degrading like turf.
        S:resistantBlocks <
         >

        # How much more wear the blocks listed above take before they advance a stage. Healing is unaffected, so a resistant surface recovers at the same rate as any other. [range: 0.0 ~ 1000000.0, default: 8.0]
        D:resistance=8.0

        # How far along its run this surface may wear, as a fraction of the whole. 1 is the entire run from untouched to a rut half a block deep; 0.25 stops it about where a path reads as a path. The global general.maxWearFraction applies as well and whichever is lower wins, so a world can be capped once without editing every family. [range: 0.0 ~ 1000000.0, default: 1.0]
        D:maxWear=1.0

        # What a worn cloud surface may also be mended with, besides a block of itself, listed the same way as the blocks setting above. Grass and dirt both take plain dirt out of the box: grass is what the world grows and earth is what a player digs, so the repair should cost the commoner of the two. Prefix an entry with 'ore:' to name an ore dictionary group instead of a block. Empty means only a block of this surface will do - or, while healing.repairAnyInFamily is on, any block of the same family. Read by bone meal and the chunk tamper while bonemealCostsABlock is on, and by the golem always; the hand tamper pays in what the ground drops and does not read this list.
        S:repairBlocks <
         >

        # Which surfaces this one exposes as it wears through, named the way the headings here name them - grass, dirt, sand, gravel, stone, cobble, snow, ice, nether, end, flesh, taint, sculk, cloud - and listed in the order the ground reaches them. Stone shows cobble, then the grit that broke off it, then the earth the road was laid on; grass shows the earth it was growing out of. The pixels of depth this family sinks are shared out between however many are listed, earliest first, so the list changes what a rut looks like on the way down and changes neither how many steps it takes to get there nor what any of them costs. A name that is this family's own, a name nothing matches, and a family that is switched off are all skipped. Empty means the ground hollows out as itself, which is what sand and snow do. Turned off wholesale by general.wearThroughToOtherSurfaces - except for grass, which has no depth of its own to hollow out and so answers to general.grassWearsThroughToDirt instead, and sculk, which answers to this list alone: it ships showing the deep dark's rock in its rut, and emptying the list makes it sink as itself.
        S:wearsThroughTo <
         >

    }

}

########################################################################################################
# Ready-made answers to the questions below, one chooser an axis so that wanting slow wear and quick recovery is a thing you can ask for rather than a compromise. Each also offers 'custom', which is what a chooser says when the numbers underneath it do not match any of its rungs. Editing one of those numbers moves the chooser to custom rather than having your edit overwritten; going custom, then to a rung, then back to custom gives you the same numbers you had. The bookkeeping that makes the second one possible lives under presets.remembered and is not meant to be read.
########################################################################################################

presets {
    # Faithful Mode: grass, dirt, sand, leaves and plants wear and heal by the original The Roads More Travelled's rules and numbers, which are under the faithful heading and start at its version 0.5.1's. Grass wears through five stages to bare earth and on to coarse dirt without sinking, dirt the same from its first worn stage, and sand through five stages that sink a little each. Your own settings for those five stay in this file as they are and are back the moment this is off; the other surfaces wear by this mod's settings either way.
    B:faithful=false

    # How much work this client does drawing worn ground. Yours alone: it reaches no server and no server overwrites it. The shipped setting is already the top of three of its four figures, so 'high' and 'ultra' only widen how many separate blocks get textures of their own - the room above default is genuinely small, and saying so is more use than pretending otherwise. 'low' and 'potato' are where the difference is: potato draws sixteen pictures a run at one rotation and turns per-surface textures off entirely, which is the difference between a stitch that takes half a minute and one that does not, and which leaves every worn block on its family's generic art with no layer behind it, so Chisel's lavastone and waterstone wear without their lava and water. No rung moves the settings for that layer; they are client.animateInnerLayers, client.innerLayerAnimationBudgetMb and client.innerLayerUploadsPerTick.
    S:quality=default

    # How much traffic it takes to mark ground, across every family at once. Each rung scales the shipped figures rather than replacing them, so the character of each surface is kept - snow still marks first and stone last - and only the pace changes. 'very_slow' is twice the traffic, 'quick' is half.
    S:wear=default

    # How long a mark lasts once nobody is using it. Scaled the same way and independent of the wear chooser above, which is the point of having two: slow to appear and quick to fade is a perfectly reasonable thing to want, and one bundled preset could not say it. 'very_slow' is twice as long to recover, 'quick' is half.
    S:healing=default

    # How many separate gradations a run passes through before it is as worn as it gets. Downwards only, because sixteen surface stages is the ceiling the record itself can hold. Fewer phases means each one is a larger visible step. The thresholds are not raised to match, so a run with fewer phases takes less traffic to wear all the way through; a phase count typed in the wear editor does raise them, to keep the end where it was.
    S:phases=default

    # How far ground physically sinks under foot. Scaled from each family's own figure, so ice still sinks half as far as earth does and turf still sinks not at all on its own account. 'none' turns the hollowing off entirely and leaves wear as something you can only see. On a server that has real ruts this is the server's to decide, and its answer overrides whatever is chosen here.
    S:depth=default

    ########################################################################################################
    # Not settings. This is where a chooser keeps the numbers you had before you picked a rung, so that going back to 'custom' gives them back rather than leaving you to type them again, and where it records which rung it last applied so it can tell a chooser being moved from a value being edited. Written automatically. Editing anything here by hand does nothing useful and may lose the values it is holding for you.
    ########################################################################################################

    remembered {
        # Bookkeeping rather than a setting, and written automatically. It records which rung the quality chooser last applied, which is the one thing a config file cannot work out for itself. A chooser that has been moved, and a number that has been edited under a chooser that has not, leave the file looking exactly the same afterwards - a chooser saying one thing and numbers saying another - and the two deserve opposite answers, because a chooser that moved should apply its rung while an edit should be kept and carry the chooser to custom. This record is what tells them apart. Changing it by hand tells the next read that the wrong one of those happened.
        S:qualityLastApplied=default

        # Bookkeeping rather than a setting, and written automatically. It holds the quality numbers that were in the file before a rung was picked, so that going back to 'custom' hands them straight back rather than leaving every family to be typed in again. Emptying it breaks nothing: with nothing remembered, 'custom' keeps whatever numbers the file has at the time, which is what asking for custom means anyway, and the log says so when it happens - but the older set this was holding is then gone for good.
        S:qualityCustom=80,4,262144,2048,1

        # Bookkeeping rather than a setting, and written automatically. It records which rung the wear chooser last applied, which is the one thing a config file cannot work out for itself. A chooser that has been moved, and a number that has been edited under a chooser that has not, leave the file looking exactly the same afterwards - a chooser saying one thing and numbers saying another - and the two deserve opposite answers, because a chooser that moved should apply its rung while an edit should be kept and carry the chooser to custom. This record is what tells them apart. Changing it by hand tells the next read that the wrong one of those happened.
        S:wearLastApplied=default

        # Bookkeeping rather than a setting, and written automatically. It holds the wear numbers that were in the file before a rung was picked, so that going back to 'custom' hands them straight back rather than leaving every family to be typed in again. Emptying it breaks nothing: with nothing remembered, 'custom' keeps whatever numbers the file has at the time, which is what asking for custom means anyway, and the log says so when it happens - but the older set this was holding is then gone for good.
        S:wearCustom=grass=8.0,16.0;dirt=8.0,12.0;sand=1.2,2.4;gravel=1.4,2.8;stone=25.0,40.0;cobble=12.5,20.0;nether=25.0,40.0;end=25.0,40.0;snow=0.8,1.6;ice=10.0,16.0;flesh=1.2,2.4;taint=12.5,20.0;sculk=1.2,2.4;cloud=0.8,1.6

        # Bookkeeping rather than a setting, and written automatically. It records which rung the healing chooser last applied, which is the one thing a config file cannot work out for itself. A chooser that has been moved, and a number that has been edited under a chooser that has not, leave the file looking exactly the same afterwards - a chooser saying one thing and numbers saying another - and the two deserve opposite answers, because a chooser that moved should apply its rung while an edit should be kept and carry the chooser to custom. This record is what tells them apart. Changing it by hand tells the next read that the wrong one of those happened.
        S:healingLastApplied=default

        # Bookkeeping rather than a setting, and written automatically. It holds the healing numbers that were in the file before a rung was picked, so that going back to 'custom' hands them straight back rather than leaving every family to be typed in again. Emptying it breaks nothing: with nothing remembered, 'custom' keeps whatever numbers the file has at the time, which is what asking for custom means anyway, and the log says so when it happens - but the older set this was holding is then gone for good.
        S:healingCustom=grass=1.5625;dirt=1.2658227848101267;sand=0.375;gravel=0.5625;stone=4.0;cobble=2.125;nether=5.0;end=5.0;snow=0.075;ice=0.65;flesh=0.46875;taint=1.5625;sculk=1.25;cloud=0.125

        # Bookkeeping rather than a setting, and written automatically. It records which rung the phases chooser last applied, which is the one thing a config file cannot work out for itself. A chooser that has been moved, and a number that has been edited under a chooser that has not, leave the file looking exactly the same afterwards - a chooser saying one thing and numbers saying another - and the two deserve opposite answers, because a chooser that moved should apply its rung while an edit should be kept and carry the chooser to custom. This record is what tells them apart. Changing it by hand tells the next read that the wrong one of those happened.
        S:phasesLastApplied=default

        # Bookkeeping rather than a setting, and written automatically. It holds the phases numbers that were in the file before a rung was picked, so that going back to 'custom' hands them straight back rather than leaving every family to be typed in again. Emptying it breaks nothing: with nothing remembered, 'custom' keeps whatever numbers the file has at the time, which is what asking for custom means anyway, and the log says so when it happens - but the older set this was holding is then gone for good.
        S:phasesCustom=grass=16,8;dirt=16,8;sand=16,8;gravel=16,8;stone=16,8;cobble=16,8;nether=16,8;end=16,8;snow=16,8;ice=16,8;flesh=16,8;taint=16,8;sculk=16,8;cloud=16,8

        # Bookkeeping rather than a setting, and written automatically. It records which rung the depth chooser last applied, which is the one thing a config file cannot work out for itself. A chooser that has been moved, and a number that has been edited under a chooser that has not, leave the file looking exactly the same afterwards - a chooser saying one thing and numbers saying another - and the two deserve opposite answers, because a chooser that moved should apply its rung while an edit should be kept and carry the chooser to custom. This record is what tells them apart. Changing it by hand tells the next read that the wrong one of those happened.
        S:depthLastApplied=default

        # Bookkeeping rather than a setting, and written automatically. It holds the depth numbers that were in the file before a rung was picked, so that going back to 'custom' hands them straight back rather than leaving every family to be typed in again. Emptying it breaks nothing: with nothing remembered, 'custom' keeps whatever numbers the file has at the time, which is what asking for custom means anyway, and the log says so when it happens - but the older set this was holding is then gone for good.
        S:depthCustom=grass=0;dirt=8;sand=8;gravel=8;stone=8;cobble=8;nether=8;end=8;snow=8;ice=4;flesh=8;taint=8;sculk=8;cloud=4

    }

}

########################################################################################################
# The original The Roads More Travelled's settings, each named after its own key in that mod's config/trmt.json, with its version 0.5.1's numbers as their defaults. presets.faithful runs grass, dirt, sand, leaves and plants by these; while it is off they change nothing.
########################################################################################################

faithful {
    # The wear one step on foot adds under Faithful Mode, to the square stepped on; a fifth of it to the square ahead and half to each side. The original's erosionMultipliers.player. [range: 0.0 ~ 100.0, default: 0.5]
    D:player=0.5

    # How many times over a step counts under Faithful Mode when riding. The original's erosionMultipliers.mounted. [range: 0.0 ~ 100.0, default: 2.0]
    D:mounted=2.0

    # How many times over a step counts under Faithful Mode for a creature on a lead, which wears only the square it stands on. The original's erosionMultipliers.leash. [range: 0.0 ~ 100.0, default: 1.5]
    D:leashed=1.5

    # In-game days each of the five worn grass stages waits untouched before it heals a stage under Faithful Mode, the first stage first. The original's deErosionTimeoutDays.grass.stage1 to stage5.
    D:grassHealDays <
        5.0
        5.0
        5.0
        5.0
        5.0
     >

    # In-game days a worn earth stage waits untouched before it heals a stage under Faithful Mode. The original's deErosionTimeoutDays.dirt.erodedDirt. [range: 0.01 ~ 100000.0, default: 8.0]
    D:dirtHealDays=8.0

    # In-game days the coarse end of a worn path waits untouched before it heals a stage under Faithful Mode. The original's deErosionTimeoutDays.dirt.erodedCoarseDirt. [range: 0.01 ~ 100000.0, default: 13.0]
    D:coarseHealDays=13.0

    # In-game days each of the five worn sand stages waits untouched before it heals a stage under Faithful Mode, the first stage first. The original's deErosionTimeoutDays.sand.stage1 to stage5.
    D:sandHealDays <
        3.0
        5.0
        8.0
        13.0
        13.0
     >

    # Whether worn dirt heals into grass under Faithful Mode, as in the original, where every worn earth stage heals on into turf even where it began as plain dirt. Off, worn plain dirt heals back to plain dirt.
    B:dirtHealsToGrass=true

    # Whether the coarse end of a path heals a stage about a minute after it forms under Faithful Mode, as the original's did because it kept no record of it, so a busy path's end flickers between worn earth and coarse dirt. Off, the coarse end waits its coarseHealDays like any other stage.
    B:coarseFlicker=false

    ########################################################################################################
    # How Faithful Mode wears and heals grass, from the original's erosion.grassEnabled, deErosion.grassEnabled and erosionThresholds.grass.
    ########################################################################################################

    grass {
        # Whether grass takes new wear under Faithful Mode. Off, no new wear starts and wear already there still heals. The original's erosion.grassEnabled.
        B:wears=true

        # Whether worn grass heals under Faithful Mode. Off, worn ground stays as it is. The original's deErosion.grassEnabled.
        B:heals=true

        # The least wear a stage of grass takes before it moves on under Faithful Mode, drawn afresh for each stage between the two. The original's erosionThresholds.grass.min. [range: 0.0 ~ 1000000.0, default: 2.0]
        D:thresholdMin=2.0

        # The most wear a stage of grass takes before it moves on under Faithful Mode, drawn afresh for each stage between the two. The original's erosionThresholds.grass.max. [range: 0.0 ~ 1000000.0, default: 4.0]
        D:thresholdMax=4.0

    }

    ########################################################################################################
    # How Faithful Mode wears and heals dirt, from the original's erosion.dirtEnabled, deErosion.dirtEnabled and erosionThresholds.dirt.
    ########################################################################################################

    dirt {
        # Whether dirt takes new wear under Faithful Mode. Off, no new wear starts and wear already there still heals. The original's erosion.dirtEnabled.
        B:wears=true

        # Whether worn dirt heals under Faithful Mode. Off, worn ground stays as it is. The original's deErosion.dirtEnabled.
        B:heals=true

        # The least wear a stage of dirt takes before it moves on under Faithful Mode, drawn afresh for each stage between the two. The original's erosionThresholds.dirt.min. [range: 0.0 ~ 1000000.0, default: 8.0]
        D:thresholdMin=8.0

        # The most wear a stage of dirt takes before it moves on under Faithful Mode, drawn afresh for each stage between the two. The original's erosionThresholds.dirt.max. [range: 0.0 ~ 1000000.0, default: 12.0]
        D:thresholdMax=12.0

    }

    ########################################################################################################
    # How Faithful Mode wears and heals sand, from the original's erosion.sandEnabled, deErosion.sandEnabled and erosionThresholds.sand.
    ########################################################################################################

    sand {
        # Whether sand takes new wear under Faithful Mode. Off, no new wear starts and wear already there still heals. The original's erosion.sandEnabled.
        B:wears=true

        # Whether worn sand heals under Faithful Mode. Off, worn ground stays as it is. The original's deErosion.sandEnabled.
        B:heals=true

        # The least wear a stage of sand takes before it moves on under Faithful Mode, drawn afresh for each stage between the two. The original's erosionThresholds.sand.min. [range: 0.0 ~ 1000000.0, default: 1.5]
        D:thresholdMin=1.5

        # The most wear a stage of sand takes before it moves on under Faithful Mode, drawn afresh for each stage between the two. The original's erosionThresholds.sand.max. [range: 0.0 ~ 1000000.0, default: 3.0]
        D:thresholdMax=3.0

    }

    ########################################################################################################
    # How Faithful Mode tramples leaves underfoot, from the original's erosion.leavesEnabled and erosionThresholds.leaves.
    ########################################################################################################

    leaves {
        # Whether Faithful Mode tramples leaves underfoot, in place of trampling.leaves while it is on. This breaks real blocks. The original's erosion.leavesEnabled.
        B:wears=true

        # The least wear a leaf takes before it breaks under Faithful Mode, drawn afresh for each one between the two. The original's erosionThresholds.leaves.min. [range: 0.0 ~ 1000000.0, default: 2.0]
        D:thresholdMin=2.0

        # The most wear a leaf takes before it breaks under Faithful Mode, drawn afresh for each one between the two. The original's erosionThresholds.leaves.max. [range: 0.0 ~ 1000000.0, default: 3.0]
        D:thresholdMax=3.0

        # Chance a leaf trampled under Faithful Mode drops what it would drop broken. The original's erosionThresholds.leaves.dropChance. [range: 0.0 ~ 1.0, default: 0.1]
        D:dropChance=0.1

    }

    ########################################################################################################
    # How Faithful Mode tramples plants walked through, from the original's erosion.vegetationEnabled, erosionThresholds.vegetation and erodableVegetation.
    ########################################################################################################

    vegetation {
        # Whether Faithful Mode tramples plants, in place of trampling.vegetation while it is on. This breaks real blocks. The original's erosion.vegetationEnabled.
        B:wears=true

        # The least wear a plant takes before it breaks under Faithful Mode, drawn afresh for each one between the two. The original's erosionThresholds.vegetation.min. [range: 0.0 ~ 1000000.0, default: 2.0]
        D:thresholdMin=2.0

        # The most wear a plant takes before it breaks under Faithful Mode, drawn afresh for each one between the two. The original's erosionThresholds.vegetation.max. [range: 0.0 ~ 1000000.0, default: 3.0]
        D:thresholdMax=3.0

        # Chance a plant trampled under Faithful Mode drops what it would drop broken. The original's erosionThresholds.vegetation.dropChance. [range: 0.0 ~ 1.0, default: 0.2]
        D:dropChance=0.2

        # The plants Faithful Mode tramples, in this edition's names: the original's eighteen out of the box, but for cornflower and lily of the valley, which this edition does not have. The original's erodableVegetation.
        S:blocks <
            minecraft:grass
            minecraft:tall_grass
            minecraft:dandelion
            minecraft:poppy
            minecraft:blue_orchid
            minecraft:allium
            minecraft:azure_bluet
