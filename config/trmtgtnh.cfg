        minecraft:jungle_sapling
        minecraft:lily_of_the_valley
        minecraft:mangrove_propagule
        minecraft:oak_sapling
        minecraft:orange_tulip
        minecraft:oxeye_daisy
        minecraft:pink_tulip
        minecraft:poppy
        minecraft:red_tulip
        minecraft:spruce_sapling
        minecraft:torchflower
        minecraft:white_tulip
        minecraft:wither_rose
        tidal:palm_sapling
     >

    # Cover that must never be treated as holding, whatever detection concludes. The way to make a sapling break with everything else rather than hold its ground.
    S:groundCoverHoldsExclude <
     >

    # Blocks that must never be treated as ground cover, whatever detection concludes. Registry names only, no metadata. Empty by default: stalks are deliberately included, so a cane or a cactus standing on ground that drops away comes down in full rather than hanging there. Put a name here for anything a pack would rather keep - the entry wins over detection, which is what makes it useful, because removing a name from groundCoverBlocks only sticks while detection is off.
    S:groundCoverExclude <
     >

    # Whether a map draws worn ground differently from ground nobody has crossed. <strong>Reduced at this version, and worth knowing how.</strong> Every map here reads one vanilla answer - getMapColor, handed the position - and that answer is one of sixty-four fixed palette entries, so there is no shade per gradation to give: a worn square that shows at all is drawn in the palette entry nearest its own color darkened by surfaces.mapWearDarkening, and does not darken further as it wears. A road is visible on the map; how worn it is, is not. Where the palette holds nothing darker than a particular ground, that ground keeps its color and the log says so once. On, a worn square is drawn in a color that has travelled toward whatever that ground is turning into - a turf path leaves green and arrives at earth in step with how far along its run it has walked - and darkened by how heavily it has been used. Which is a map that answers 'where do people go' as well as 'what is this made of', and it is why a road shows up on a minimap at all. Off, every square is drawn as the material it started as, and the darkening a world-reading map is given through client.mapWearThroughTint goes with it. One correction still reaches such a map with this off, because it is not wear: a modded turf has its tint put right, so a path through it does not read as a green stripe. What a map with no per-position color handler can do is coarser and cannot be helped: the vanilla map item works from a fixed palette of sixty-four colors with no darker sibling to pick, so it is given the right material and nothing about how worn it is. JourneyMap is asked per position and gets all of it; a map that reads the world, Xaero's Minimap among them, gets the darkening.
    B:mapTracksWear=true

    # How far a worn square is darkened on a map, as a fraction of the color it would otherwise be. <strong>Read once at full strength here rather than spread over the run</strong>: this version has sixty-four fixed palette entries to draw a map with and no fraction to apply, so what this figure decides is which entry is picked - the nearest one to the ground's color darkened by this much - and every square that shows wear is drawn in it. Raising it reaches for a darker entry and may land on the same one; lowering it reaches for a nearer one and at nought the square keeps its own color. The run-long easing below is 1.7.10's and is what this would mean there. The darkening is spread evenly over every gradation the ground has - eighty for most families - so this also sets how much one step of wear is worth: at the default, about eight tenths of one per cent each. Raise it to tell the levels apart more easily, at the cost of a worn road reading as a darker material rather than as the same material worn. There is a floor on what can be shown either way: eight-bit color has only so many values between a block's own shade and a fraction of it, and on already-dark ground several gradations will land on the same one however wide this is set. Nought means no darkening at all, and now genuinely does: it used to be read as a request for the default, so a pack that turned this off silently got it back. [range: 0.0 ~ 0.9, default: 0.62]
    D:mapWearDarkening=0.62

}

########################################################################################################
# Settings that are yours alone. Nothing here reaches the server and nothing here is overwritten by one, so they survive visiting somebody else's world. This is where to turn the overlay off, change how much detail the wear textures are drawn with, and decide whether snow and carpet settle into the ruts beneath them. Two settings that are just as much yours are not in here: hideWearUnderBlocks and flattenWearUnderBlocks, which decide how worn ground is drawn once a block is placed on it, sit under general instead. Nothing ever sends either of them to a client, so read what the general heading says about that category with those two set aside - the copy in your own file is what decides what you see, on somebody else's server exactly as much as in a world of your own.
########################################################################################################

client {
    # A ceiling on the wear sprites this mod plans into the block atlas, counting every one it registers: worn faces, the family fallbacks, the grass-side fringes, the grass side walls and the mended sides. It is not what decides whether they fit. At every stitch the mod measures how much of the atlas the rest of the pack has already taken and how large a texture this card will address, and plans no further than the room left: an 8192 square at most, or 16384 with client.largerAtlas, less a sixteenth held back for the stitcher, less the pack's own textures, each at the size its file says it is. That room is counted in sixteen-pixel slots, and a wear sprite is drawn at the resolution of the face it is worn from, so it takes one slot for a sixteen-pixel face, four for a thirty-two and sixteen for a sixty-four. While anisotropic filtering is on, every texture the game loads into the atlas for itself is sixteen pixels wider and taller, and the pack's own are priced that way; a wear sprite is not, because it is made from its face with that border taken off, so a sixteen-pixel face's wear takes one slot either way. Even with nothing else in an 8192 atlas that is 245,760 sprites at one slot apiece, under this default of 262,144, so at the default this setting never takes effect there at all: it exists to be turned down. With client.largerAtlas on the room can be four times that, and this default then holds the wear to an 8192 square's worth of sixteen-pixel sprites - which only a pack worn mostly at sixteen pixels reaches, since a larger face takes several slots for one sprite. Turned down far enough, it binds before the room does, which keeps the wear textures' share of video memory small on a machine short of it - 65,536 sixteen-pixel sprites are a 4096 square's worth, about eighty-five megabytes once mipmaps are counted, against about three hundred and forty for an 8192 square's worth. When it stops the plan, the ramp keeps its gradations and the faces last in the plan's order, vanilla's ground first and the rest by registry name, wear their family's generic art instead, and the log says so. The family fallbacks, fringes and walls are always planned in full, whatever this says and even where the room will not hold them, because without them worn ground has nothing to draw, and they count against this ceiling before any face does. Out of the box they come to five thousand four hundred and forty sprites at eighty gradations and four rotations, and two hundred and seventy-two at sixteen and one, plus one for every grass wall and mended side and one for the wall an unknown grass falls back on: seventeen appearances at every gradation and rotation, a fallback for each of the fourteen families that wear, one more for the earth under grass, one for the stone under sculk, and the fringe. Turning general.wearThroughToOtherSurfaces on, or joining a server whose rules turn it on, adds a fallback for every other surface a family wears through into, which at the shipped families.<name>.wearsThroughTo makes twenty-three appearances and those figures seven thousand three hundred and sixty and three hundred and sixty-eight. Set below what they come to, this gives no block its own wear at all and saves nothing further, and the log says so, and gives the figure that lets the first face in wherever the room would take it. Every face that wears with its own pixels costs gradations times rotations sprites, twice that for grass, which carries its earth as well. Where this ceiling stops the plan, lowering client.wearGradations fits more faces under it, but only below the count the log says was drawn, and never below sixteen; lowering client.wearRotations fits more too, though where the log also says the room drew fewer gradations than were asked, a rotation given up is spent on finer gradations first, up to the count asked for, and only what is left over brings faces back. Either way the log works out how many faces each change would keep. Where the room stops the plan, the ramp is at sixteen already, and lowering client.wearRotations is the only one of the two that can bring faces back. The log says how much room was measured and how much of it was used, every stitch. [range: 768 ~ 262144, default: 262144]
    I:maxWearSprites=262144

    # Let this mod plan its wear into a block atlas larger than an 8192 square - up to 16384, where your graphics card says it can address one. Off, the wear is planned into what an 8192 square has left once the pack's own textures are in, and a pack whose faces will not all fit at client.wearGradations draws every surface's ramp more coarsely, never below sixteen gradations, before any face falls back to its family's generic art; Chisel for 1.12.2's carvings, for one, drew every ramp at 62 of 80. On, they fit, and the price is video memory: a 16384 atlas is four times an 8192 one, about one and a third gigabytes with its smaller copies against about three hundred and forty megabytes. Turn it on only if your card has that to spare. The game builds the atlas without checking that the card accepted it, so a card that cannot hold one draws every block in the game black, with nothing in the log to say why - if that happens, turn this off again. A pack that needs more than 8192 for its own textures gets it from the game either way; this only lets the wear ask for the room. client.maxWearSprites still applies. Takes effect on the next resource reload.
    B:largerAtlas=false

    # Under Angelica, the pixels of border round each worn-ground picture in the block atlas, filled from the picture's own edge. Angelica gives every block texture sixteen at the game's four mipmap levels, and at that width the worn-ground pictures of a large pack need a block atlas past what map mods and many cards can take. auto uses the widest border at which every face, all four wear patterns and every gradation fit a block atlas your card and map mods can take, trying Angelica's own first and then 8, 4, 2, 1 and none; the log says which it chose and why. atLeast2 chooses the same way but never below 2 pixels, giving up wear patterns first and then gradations to keep them, and goes narrower only where not every face fits even at one pattern and one gradation. A number forces that border, never wider than Angelica's own: wider blends less at the farthest distances, narrower fits more. Where it is kept, wear patterns give way first and then gradations; where not every face fits at it even at one pattern and one gradation, the widest narrower border that fits is taken, and the log says so. 0, for no border, is still read from the file. Does nothing without Angelica, and so nothing in any edition but 1.7.10. Takes effect on the next resource reload.
    S:angelicaWearGutter=auto

    # Keep the shader material of the block underneath, so worn ground does not lose every property a shader pack gives it. A pack decides how a block behaves under light by looking it up by name in its own table, and the blocks this mod paints are in nobody's table - so with shaders on, a worn stone road was not merely duller, it was a stranger. This tells the shader pipeline to treat it as the block it is covering while it is still that material, and as whatever it has worn through into once it is not, so the shine goes as the road breaks up rather than the moment anybody walks on it. Needs a shader loader of the Iris family - Oculus on Forge, Iris itself on Fabric, which are the same code and leave the claim in the same place - and does nothing at all without one, or with one and no shader pack loaded: it is then one boolean read on a client that is not using them. Nothing of that mod is named unless it is actually installed, and the seam that reaches it is refused outright when it is not.
    B:inheritShaderMaterial=true

    # Let a worn block go on scattering whatever the block underneath it scatters - mycelium's spores, a lit block's sparkle, and whatever a modded terrain block does of its own accord. The client picks a thousand positions around you every tick and asks each block it lands on for its ambient particles, and it does that whether or not the block asked to be ticked, so a ghost is asked exactly as often as the ground it replaced and without this answers with silence. The one cost is that it runs the covered block's own code from the client tick, which is third-party code in a pack this size; a block that throws is noted once and skipped, and turning this off stops asking altogether.
    B:inheritAmbientParticles=true

    # Let worn ground go on doing to whoever walks into it whatever the block underneath does. Chisel's cloud is the one this was written for: it takes an entity's fall almost entirely away, and a worn one had stopped doing it, because what your client sees at that position is this mod's stand-in rather than the cloud. A fall is worked out by your own machine and the server takes the answer, so losing this lost the effect outright rather than halving it. Only the player at the controls and whatever they are riding: everything else is moved by the server and arrives here as positions to copy, so nudging one would buy jitter, and a block that hurts or ignites what stands in it should not be given a second chance to do it. Off, worn ground of that kind is simply ground. Blocks that keep state of their own are never covered by this mod at all, so nothing here can reach for something that is no longer there.
    B:inheritEntityCollision=true

    # Draw snow and carpet down with ground that has worn away underneath them. A snow layer lying on a rut half a block deep otherwise hangs in the air over it, because a block's shape is its own business and nothing tells it what has happened below. In the real wear mode where you stand comes down with them, so you stand on the snow you can see; in the visual mode only the picture moves. Deliberately just those two - a rail or a repeater would settle as easily and would then be drawn a step below the box the server still holds it at, and a patterned block would smear, because the renderer stretches a whole texture over a side face once a shape leaves its own block.
    B:settleOnWornGround=true

    # How many separate pictures each surface's run of wear is drawn with. A family's whole run is eighty steps at the shipped figures - sixteen gradations on the face as it stands, then a pixel of depth and eight more, eight times over - so eighty here, which is the default, gives every one of those its own picture and no two consecutive steps look alike. Sixteen is the floor, and there consecutive steps share a picture five ways. The wear textures in the block atlas grow in step with this, so eighty costs five times what sixteen does; lower it if a machine struggles to stitch. When the block atlas has not the room for this many on every face, fewer are drawn, never fewer than sixteen, and the log says how many and why; past that it is faces that give way rather than gradations. While the log says fewer were drawn than asked, setting this anywhere from that count up changes nothing. [range: 16 ~ 80, default: 80]
    I:wearGradations=80

    # How far every wear pattern's run is pushed away from the shape measured for it. One leaves each pattern on its own number and is what should normally be here. Below one the early steps of every run do more and the later ones less, so a path appears quickly and then deepens slowly; above one the reverse, and ground stays nearly untouched for a while before going all at once. This used to be a single exponent applied to every pattern alike, and that was the mistake it is now a scale to avoid: a crack spreads its own change almost evenly and goes on paying for a straight line to the end of its run, while a rub has barely started by the halfway mark and needs the curve to pull its late work forward - so the one number that suited the cracked families left the rubbed ones changing by a fifth of a color level a step, which is nothing. This is not the same question as how worn the ground gets, which is the family's own wearStrength and maxWear; it is only how the journey there is divided up. Two things to know before moving it far. Because it multiplies, the reachable range differs by pattern: 0.2 to 3.0 here is an effective 0.20 to 3.00 on the cracked and buffed patterns but only 0.12 to 1.80 on the rub, so setting three and finding the rub stopped at 1.8 is the setting working rather than failing. And the rub's own shape is sharp - taking this to about 1.3 costs it more than half of its smallest step, long before anything looks wrong on stone. [range: 0.2 ~ 3.0, default: 1.0]
    D:wearCurve=1.0

    # Whether every family that has a look made for it is drawn in its classic look instead, the one it shipped with before: sand, gravel, cobble, snow, ice, nether and end in their 0.9.228 looks (smooth_dirt, dirt, crack_dirt, crack_dirt_lite, crack_dirt, smooth_crack and smooth_crack), and flesh, taint, sculk and cloud in the looks they arrived with (smooth_dirt, crack_dirt, smooth_heavy and dirt_lite). Only for a family whose wearPattern names its shipped default: a look written there by hand wins over this. Each of those families has a classicWear of its own for bringing back just that one. Read by your own client and by nobody else. Takes effect on the next resource reload.
    B:classicWear=false

    # How many wear patterns a surface has to spread across neighbouring blocks - which pixels wear away first; how the picture is turned is client.wearTurns. A position already picks one of four, but only two used to be built and the other two folded onto them, which is why a long path read as striped in a two-block rhythm. Four is the most the position can distinguish. Every face's wear textures are gradations times rotations, so while everything asked for is drawn this multiplies what the wear takes in the block atlas exactly as client.wearGradations does, and lowering either lightens the stitch. Once the room left in the atlas or client.maxWearSprites limits the plan, a rotation given up is spent rather than saved: where the log says fewer gradations were drawn than asked, on finer gradations, up to the count asked for, and where it says faces gave way, on bringing faces back. Until everything asked for is drawn the atlas is about as full as before, so a lower setting here trades wear patterns for gradations or faces and leaves the stitch no lighter. To make it smaller where the log says fewer gradations were drawn and no face gave way, lower client.wearGradations below the count the log gives; where faces gave way, lower client.maxWearSprites below the sprites the log says were registered in all, which gives still more of them their family's generic art. [range: 1 ~ 4, default: 4]
    I:wearRotations=4

    # How a worn block's rotation is shown, so worn ground does not read as a repeating tile. both: each block draws one of four wear patterns, turned a quarter at a time from block to block. turn: one pattern, turned four ways, which takes a quarter of the room in the block atlas for the faces that turn. reseed: the four patterns, never turned, as before 0.9.229. Only a face with no direction turns - dirt, sand, gravel, cobble, netherrack, end stone, stone and the like; bricks, planks, tiles and anything else with lines or a grain keep their way up in all three, read from each face's own pixels and name, and a looks file's turns can say either way for a block. Takes effect on the next resource reload.
    S:wearTurns=both

    # When a worn block starts turning. game: before the block first sinks it keeps exactly the turn the game gives the unworn block - none in the 1.7.10 edition, and the game's own random turn for dirt, sand, grass tops and the like here - and from the first pixel of sinking each depth takes its own turn. sink: the stages before the first sink are drawn unturned, and the turn starts at the first pixel of sinking. first: the turn appears at the first stage of wear, as before. Shown as soon as the worn blocks are drawn again.
    S:wearTurnStart=game

    # Whether worn ground is forbidden from ever looking cleaner than it did a step ago. Off, the drawn gradation mixes how far through its current run a block is with how far through the whole chain it is, and the first of those restarts every time the ground sinks a pixel - so the texture jumps back toward clean at the exact moment the block drops lower. On, each run is given its own slice of the pictures and fills it from start to end, which keeps both readings and cannot go backwards. Turn it off to get the old behaviour back; wearCarriesWithDepth only does anything while it is off.
    B:wearNeverStepsBack=true

    # Whether a worn grass block's side fringe recedes toward dirt as its top wears, instead of keeping a full green edge down a bald path. On, the tinted fringe is thinned per gradation and the earth wall behind it is de-greened, so the sides of a path read as soil; off leaves the static grass side. This drives a second renderer mixin, so if a resource pack renames a modded grass side away from grass_side and its fringe drops out, turn this off to recover it.
    B:grassSideWear=true

    # Whether the purple cracks of worn end stone and the flecks of ash on worn netherrack glow in the dark. On, each of those pixels is drawn a second time as an overlay at a baked light, as the ender dragon's eyes are drawn at full light: by day it is the same pixels again and adds nothing, and at night the cracks and the ash stay lit while the ground around them goes dark. The end's cracks are lit at about three fifths of full and the nether's ash at about a third, and the light is only ever raised, never lowered, so a lit room or the day is untouched. Off, the overlays are not made at all, which saves their share of the block atlas, and the cracks and the ash are lit as the ground around them is. Turn it off to leave it to a shader pack that handles light itself. Takes effect on the next resource reload.
    B:glowingWear=true

    # How much of what a block looks like comes from its total wear rather than the gradation it is currently on. Gradations restart each time the ground sinks a pixel, so at 0 a deep rut looks freshly cut; at 1 only the total counts and the gradations stop reading. Half of each keeps both. [range: 0.0 ~ 1.0, default: 0.9]
    D:wearCarriesWithDepth=0.9

    # How worn the sides of a block look next to its top. 0 leaves them clean, 1 wears them as hard as the floor of the rut. The sides follow how far the ground has come overall rather than the gradation it is currently showing, so they only ever get worse. [range: 0.0 ~ 1.0, default: 0.5]
    D:sideWearFraction=0.5

    # Client only. When off you see plain terrain - with one exception worth knowing, because it is the shipped default rather than an edge: where the ruts are real enough to walk down into (general.physicalDecay=real) the drawing is held on whatever this says, in a world of your own as much as on somebody else's server, because a hollow you can fall into and cannot see is worse than one you did not want to look at; the server keeps tracking and other players are unaffected.
    B:showErosion=true

    # Client only. Whether The One Probe shows this mod's lines - how worn a square is, its reinforcement, ward and path light, and what a Golem of Ways is doing. Hwyla and Jade have a switch of their own for these lines; The One Probe has none, so this is it. Told to the server as you join, and again whenever it changes, since the probe's lines are written there.
    B:probeLines=true

    # Which settings screen opens: own, this mod's own; other, Forge's built-in screen (1.7.10, 1.12.2) or Cloth Config's where it is installed (the newer editions; without it, this mod's own opens). Shown on both screens, so either can switch to the other. The button at the top right of either screen switches between them and remembers the choice here.
    S:settingsScreen=own

    # A small button for these settings on the game's Options screen, beside its top row. Off hides it; /trmt config and the key still open them.
    B:optionsButton=true

    # Overlays further away than this many chunks are not painted. Independent of render distance, so a large view distance need not mean a large overlay cost. Read by this client alone: what a server sends follows the chunks it has actually sent a player, whatever this is set to on either machine, so lowering it costs nothing but what is drawn. [range: 2 ~ 32, default: 12]
    I:overlayDistanceChunks=12

    # Build wear textures per surface, so a Biomes O' Plenty grass or a Twilight Forest dirt wears in its own colors instead of vanilla's. Costs extra sprites in the block atlas at the resolution of the faces they are worn from, bounded by surfaces.maxTexturedSurfaces and client.maxWearSprites. Where the atlas has not the room for them all at client.wearGradations, every surface's ramp is drawn more coarsely first, the family fallbacks that everything else wears included, never below sixteen gradations, and only past that do the faces last in the plan's order, vanilla's ground first and the rest by registry name, fall back; the log says which. On a large pack, or one drawn at thirty-two pixels, that means this setting can cost every worn block in the world some of its gradations, and switching it off gives that room back to the ramp. Off, no worn block is drawn from its own pixels, so nothing named in client.innerLayerTextures is drawn into worn ground either: Chisel's lavastone and waterstone wear their family's generic art with no lava or water in it. The potato quality rung turns this off.
    B:perSurfaceTextures=true

    # Overlay positions written into the client world per tick. Spreading a large batch over several ticks keeps a frame spike out of the picture when you fly into a well-travelled area. [range: 32 ~ 16384, default: 512]
    I:overlayApplyBudget=512

    # Does nothing on this edition, and is kept so that every edition's settings are the same settings. On 1.7.10 it stops the lava and water inside Chisel's lavastone and waterstone flickering against the carved stone drawn over it: those blocks are two full cubes in exactly the same space, and the crack fix that comes with that version's modern chunk builder grows the liquid's faces a thousandth of a block and not the stone's, so the two fight pixel by pixel until the stone is lifted a hair proud. Chisel for this version has no lavastone or waterstone, so there is nothing for it to lift, and nothing reads it.
    B:liftLayeredBlockShell=false

    # How far, in blocks, the 1.7.10 edition lifts the carved stone of a layered block off the liquid beneath it. Does nothing on this edition, as the setting above says, and is kept so that every edition's settings are the same settings. [range: 0.0 ~ 0.05, default: 0.002]
    D:layeredBlockShellLift=0.002

    # What to draw behind a worn block whose own texture is cut away to show something underneath. A few blocks are a shell with a second layer behind them - Chisel's lavastone and waterstone are stone with lava or water showing through the gaps - and they draw that layer in a pass of their own. Worn ground is drawn by this mod in one pass and cannot do that, so before this setting existed the gaps in the shell were simply gaps: between a twentieth and three quarters of every face of a worn one was a hole with nothing behind it, and a worn waterstone came out plain grey with no water in it at all. Each entry says which texture belongs behind which block, written as modid:block=texture or modid:block:meta=texture, and the layer is painted into the worn picture once while the textures are being built rather than drawn again every frame - so it costs nothing at all while you are playing, and it sinks with the ground because it is part of the picture the ground is drawn with. Naming a block from a mod you do not have does nothing; the two entries shipped here are inert without Chisel, and a texture that cannot be found is said once in the log rather than quietly ignored. Emptying the list turns the whole thing off and gives the holes back. A layer is only ever laid into a worn picture made from the block's own pixels, so it is gone from any block that wears its family's generic art instead: every block while client.perSurfaceTextures is off, which the potato quality rung also does, and any block that surfaces.maxTexturedSurfaces, client.maxWearSprites or the room in the block atlas turns away, which the log says at the stitch where it happens. Where the texture named is one that moves, the layer moves with it and keeps step with the unworn blocks around it; see animateInnerLayers, which is what decides that and what it costs. Takes effect on the next resource reload.
    S:innerLayerTextures <
        chisel:lavastone=lava_still
        chisel:waterstone=water_still
     >

    # Let the layer behind a worn block be seen through, where it has any transparency of its own. Chisel's waterstone is stone with water behind it, and vanilla's water is drawn with about a third of its light coming from whatever is on the other side - but the block it belongs to is solid, and so is the worn ground this mod paints over it, so that third has nowhere to come from and the water reads as blue stone. On, the gaps a carving leaves are left genuinely open: the carved stone stays solid, and only the holes let anything through. It is a deliberate departure from what the block looks like unworn rather than a correction to it, which is why it asks first. How much comes through depends entirely on which chiselling it is, and on three of the seven it is almost nothing. The gaps in a carved face run from a thirty-second of it to three eighths, and vanilla's water is never less than two thirds solid in any of its thirty-two frames - so across a whole face the light arriving from behind is about one part in a hundred on the cobble, black and creeper carvings, one in thirty on the tiled, one in twenty on the chaotic, and one in nine on the plain panel, which is the only one where it is plainly a different block. Turning this on and looking at a worn cobble waterstone shows nothing whatever, and that is the setting working rather than failing; the panel and the chaotic are the ones to look at. Nothing at all is drawn through where the layer is solid, so lava is untouched by this and always will be. Costs nothing when off, and nothing at all without a mod that has such a block. Takes effect on the next resource reload.
    B:seeThroughInnerLayers=false

    # Whether the layer behind a worn block moves, when the texture named for it is one that moves. Chisel's lavastone and waterstone are stone with lava or water behind them, and that lava is animated - twenty pictures cycling every two ticks - so worn ground showing a single still frame of it sat dead beside the unworn blocks around it. On, the frame under the worn shell is laid again each time the liquid moves, and stays in step with the liquid in the block next door because it is counted by the same clock read out of the same file, including while you are looking the other way. What it costs is memory held for the session: the shell of every worn picture, kept rather than thrown away once it has been drawn, the still picture the atlas keeps beside it for anything that moves, and one copy of the liquid's frames per surface - a little over eleven megabytes for Chisel's fifteen faces at sixteen pixels and the settings shipped here, and about forty-five at thirty-two. The budget below counts all of it, which is what keeps a config naming fifty blocks from quietly costing far more. Nothing at all when innerLayerTextures is empty or names nothing that moves, or for a block with no worn pictures of its own, which is every block while client.perSurfaceTextures is off, as the potato quality rung also leaves it. No quality rung moves this, client.innerLayerAnimationBudgetMb or client.innerLayerUploadsPerTick. A lower rung lays the layer into fewer pictures and lets fewer blocks keep their own, and neither changes how many pictures one tick may redraw. Takes effect on the next resource reload.
    B:animateInnerLayers=true

    # The most memory, in megabytes, that moving layers may hold for the session. A surface whose layer moves is priced whole before any of it is granted, and the price is everything moving it makes the game keep: the shell of every worn picture of the surface, the still picture and its smaller copies that the atlas keeps for anything that moves and lets go of for everything else, and one copy of the liquid's frames for the surface, cut at the size its worn pictures are drawn at. So it rises with how many blocks you have named in innerLayerTextures, with client.wearGradations and client.wearRotations, the two settings that decide how many pictures a surface is drawn with, and with the square of the texture's resolution. At sixteen pixels, eighty gradations, four rotations and the game's default of four mipmap levels, one lavastone comes to three quarters of a megabyte and Chisel's eight lavastones and seven waterstones to a little over eleven, so the default has room for more than five times that; at thirty-two pixels each costs four times as much. Anisotropic filtering changes none of these figures. Surfaces are granted in the order they are built, each whole or not at all, and one the budget will not stretch to keeps its layer's first frame in every picture while a cheaper surface after it can still move. Below the price of a single surface nothing moves at all - a thirty-two pixel lavastone needs just under three megabytes, so two here moves nothing on such a pack - and the log says so rather than leaving it to be noticed. What is held, by kind, and the surfaces kept still, counted by the texture behind them, with what moving them would have needed, are written to the log at the end of every resource reload. Nought declines the whole thing, which is the same picture as turning the setting above off. [range: 0 ~ 512, default: 64]
    I:innerLayerAnimationBudgetMb=64

    # Does nothing in this edition, and left in the file so a pack can move between versions: here the frames of a moving layer are stacked into one picture and the game's own atlas animates it, as it animates the liquid itself, so there is no redrawing per picture for a ceiling to count. What follows is what it means on 1.7.10 and 1.12.2. How many moving layers may be redrawn in one tick. Every worn picture of a lavastone wants its lava laid again on the same tick, because they all follow one clock, so without a ceiling, on a plain client, every worn picture of a moving liquid on the atlas would send its upload on the same tick, whether or not any is in view - several thousand for Chisel's fifteen faces - and drop a frame doing it. A picture over the ceiling is not redrawn late: it keeps the frame it shows until its layer next moves and asks again, and because the pictures of a liquid all ask on the same ticks in the same order, past the ceiling it is the same pictures that miss out each time and stand still. The first tick after a resource reload that turns any picture away is written to the log with how many asked. A modern chunk builder already redraws only what is on screen, so on a client that has one this is almost never reached; on a plain client every moving picture asks, and Chisel's fifteen faces at the settings shipped here are four thousand eight hundred pictures. On a plain client the ceiling covers every moving picture on the atlas wherever you are, the menu included, so a regular stutter everywhere that goes away with client.animateInnerLayers off is the sign to lower it; only with a chunk builder that redraws what is on screen does the count follow how much worn chiselled ground is in view. Raise it if the log says it turned pictures away and you would rather see more of the liquid move. [range: 16 ~ 8192, default: 256]
    I:innerLayerUploadsPerTick=256

    # Does nothing in this edition, and left in the file so a pack can move between versions: there is no tint to withhold, because a worn square here is handed the covered block's own map color and nothing else. What follows is what it means on 1.7.10, where the tint is how a world-reading map is told anything at all. Whether worn ground reports how worn it is through its own tint, which is the one question about a particular square that a minimap reading the world can ask a block. JourneyMap does not need this and is not affected by it either way - it is handed a color handler of its own and asks that. Every other map on 1.7.10 works its colors out from the block, and for them this is the difference between a road that darkens as it wears and a road that looks exactly like the ground beside it. It costs nothing where nothing asks. What it rests on is worth knowing before switching it off for no reason, and worth knowing before leaving it on if something looks wrong: the tint is given only to a caller that hands over the world itself, because the renderer hands over a view of one chunk instead, and worn ground is already darkened in the picture it is drawn with - so a renderer told the same thing twice would draw it twice as dark. That test holds for vanilla's own mesher and for this pack's, both checked by name, and it is an inference about who is asking rather than a promise anybody made. If a future renderer or shader starts handing the whole world over, every worn block in the world goes too dark and this is the setting that puts it right. One thing already falls the wrong side of it and is left alone: the cracks drawn on a block you are breaking take the shade too, for as long as the swing lasts. Two further things are worth knowing before judging whether this is working. Xaero's asks in its Accurate block-color mode, which is the one it ships with, and in its Vanilla mode only when 'Biomes in Vanilla Color Mode' is also on - in plain Vanilla mode it takes the block's map color and hands it back without asking anything about the position, so this changes nothing there and a path shows only where the ground has worn through into a different material. And a map that keeps the tiles it has drawn only redraws one when something tells it the chunk changed; this mod tells Xaero's directly, because nothing else would, but any other map that caches the same way will show the wear as of the last time it drew that square.
    B:mapWearThroughTint=true

    # How far a worn square's color on the map is pulled toward the desire-path color below, at the point it is fully worn. Nought is off and off is what ships, so this means nothing at all until somebody deliberately raises it. Left alone, a map goes on drawing worn ground as the ground it is - travelling toward what it is turning into and darkening as it goes, which is what surfaces.mapTracksWear does. Turn this up and the map stops answering 'what material is this square' for worn ground and starts answering 'where does everybody actually walk'. That is a different map and a deliberate trade: a road drawn in violet is no longer a road drawn in stone. One puts a fully worn square entirely in the highlight color; a half leaves both readings at once, the material still recognisable with the traffic laid over it, and is the setting to try first. The pull is scaled by how worn each square is, so ground nobody has ever crossed is left exactly as it was - but be ready for how much ground is not that, because a square counts from its first crossing and around a base that is most of it. The scale is deliberately not a straight line but the square root of the wear, because a route is interesting the moment somebody starts using it and a straight line leaves a new one invisible until it is half worn out. Two things it cannot do: it needs JourneyMap and does nothing whatever without it, because the highlight is applied by the color handler this mod hands to JourneyMap and no other map is given one; and it does not repaint a map already drawn, so ground near you recolors as it is mapped again while ground you explored last week keeps its old colors until you go back. The log says once, the first time a square is actually highlighted, that all of this is working. [range: 0.0 ~ 1.0, default: 0.0]
    D:desirePathHighlight=0.0

    # The color worn ground is pulled toward when desirePathHighlight is above nought, as #RRGGBB. The default is a violet chosen for being a color no ground is: a map is greens, browns, greys and blues in every dimension this mod wears ground in, including the red of the Nether and the pale yellow of the End, so a violet path cannot be misread as a material the way an ochre or a red one could - and it stays separable for the common forms of color blindness, where an orange road over green terrain does not. Change it if it collides with something else your map draws. Anything that is not six hex digits falls back to the default and says so once in the log rather than quietly drawing black, because black is what a mistyped color would draw and worn ground is meant to be dark anyway, so the mistake would look exactly like the feature working. This is also the quickest way to find out whether any of it is running: set this to #00FF00, put desirePathHighlight to 1, and walk a path you know is worn.
    S:desirePathColor=#AA44CC

}

########################################################################################################
# What different things weigh, as far as the ground is concerned. A crossing by anything here counts for as many ordinary footsteps as the number says, so a horse can be made to cut a track four times faster than a player and a chicken can be made to leave no mark at all. A mob named at 0 in the mobs list leaves no mark while it walks loose, though on a lead it is counted by fromLeashedMobs; player at 0 means nothing that walks wears anything at all.
########################################################################################################

multipliers {
    # Whether players walking causes wear.
    B:fromPlayers=true

    # Whether mobs you are leading on a lead cause wear, whatever the mob, at the leashed multiplier. A loose mob is decided by the four switches below and the mobs list instead.
    B:fromLeashedMobs=true

    # Monsters wear the ground: every hostile mob, bosses included, at the hostile multiplier. A mob the mobs list names counts at its own number instead while fromCustom is on, and a mob named at 0 never wears.
    B:fromHostileMobs=true

    # Every other mob wears the ground - animals, iron and snow golems, water and ambient mobs - at the passive multiplier, except villagers, which fromVillagers decides. A mob the mobs list names counts at its own number instead while fromCustom is on, and a mob named at 0 never wears.
    B:fromPassiveMobs=true

    # Villagers wear the ground (wandering traders too, where the game has them), at the villager multiplier. A mob the mobs list names counts at its own number instead while fromCustom is on, and a mob named at 0 never wears.
    B:fromVillagers=true

    # The mobs list counts: each mob it names wears at the number beside it, in place of its group's. Off, the list's numbers are ignored - but a mob named at 0 still never wears, so the magic tamper's stop button always holds.
    B:fromCustom=true

    # Wear added when a player steps onto a new block, and the unit every other figure in this category is a multiple of rather than an alternative to. A mount, a lead, a mob's group or a named mob multiplies this number instead of replacing it, so halving it to soften the tracks players leave halves villagers and led animals by exactly as much; to quieten one kind of mover on its own, move that mover's own line. It is also what one crossing costs on the wear table, which is why the figures there shift when this does. Nought is a real setting and it means never: the step is abandoned before the ground is ever looked at, so nothing that walks wears anything at all, whatever the mob switches, the mob list and the lead switch say. That is not the same as turning players off, which is fromPlayers above, and it leaves explosions alone, because a blast is scoured by its own strength rather than by this. [range: 0.0 ~ 100.0, default: 0.5]
    D:player=0.5

    # Extra multiplier while riding. Hooves wear a path faster than boots. [range: 0.0 ~ 100.0, default: 2.0]
    D:mounted=2.0

    # Extra multiplier for an animal being led on a lead. Above 1 because a herd walked the same way every day is how a drove road gets worn in, and a lead is the clearest sign in the game that an animal is going somewhere rather than wandering. [range: 0.0 ~ 100.0, default: 1.5]
    D:leashed=1.5

    # How hard a monster's step wears the ground, against a player's 1.0. [range: 0.0 ~ 100.0, default: 0.25]
    D:hostile=0.25

    # How hard a passive mob's step wears the ground, against a player's 1.0. [range: 0.0 ~ 100.0, default: 0.25]
    D:passive=0.25

    # How hard a villager's step wears the ground, against a player's 1.0. [range: 0.0 ~ 100.0, default: 1.0]
    D:villager=1.0

    # Mobs counted by name, each at its own number: one name per line, as the game names it - minecraft:villager, or a modded mob by its mod's name for it - or as the 1.7.10 edition names it - Villager, Zombie, Pig - which is read as the mob it became, every kind of it where later versions split one, with ':' and a number for how hard it wears against a player's 1.0 - 'Zombie:2', 'Pig:0.5'; a bare name counts 1.0. A mob named here counts at its number in place of its group's while fromCustom is on. 'Zombie:0' keeps zombies off the ground always, whatever the switches say; it is what the magic tamper's stop button writes. A line of '*' counts every mob no line names whose group is switched off. A mob on a lead still wears while fromLeashedMobs is on, because that counts anything being led.
    S:mobs <
     >

    # At most playersPerChunk players wear the ground in one chunk at a time; the rest walk without wearing it.
    B:capPlayers=false

    # How many players may wear the ground in one chunk at a time, while capPlayers is on. [range: 1 ~ 256, default: 8]
    I:playersPerChunk=8

    # At most hostilePerChunk monsters wear the ground in one chunk at a time; the rest walk without wearing it.
    B:capHostileMobs=false

    # How many monsters may wear the ground in one chunk at a time, while capHostileMobs is on. [range: 1 ~ 256, default: 8]
    I:hostilePerChunk=8

    # At most passivePerChunk passive mobs wear the ground in one chunk at a time; the rest walk without wearing it.
    B:capPassiveMobs=false

    # How many passive mobs may wear the ground in one chunk at a time, while capPassiveMobs is on. [range: 1 ~ 256, default: 8]
    I:passivePerChunk=8

    # At most villagersPerChunk villagers wear the ground in one chunk at a time; the rest walk without wearing it.
    B:capVillagers=false

    # How many villagers may wear the ground in one chunk at a time, while capVillagers is on. [range: 1 ~ 256, default: 8]
    I:villagersPerChunk=8

    # At most customPerChunk mobs the mobs list names wear the ground in one chunk at a time; the rest walk without wearing it.
    B:capCustom=false

    # How many mobs the mobs list names may wear the ground in one chunk at a time, while capCustom is on. [range: 1 ~ 256, default: 8]
    I:customPerChunk=8

    # Fraction of a step's wear bled onto the block ahead. Softens the leading edge of a path. [range: 0.0 ~ 10.0, default: 0.2]
    D:bleedFront=0.2

    # Fraction bled onto each flanking block. This is what gives a path its width. [range: 0.0 ~ 10.0, default: 0.5]
    D:bleedSide=0.5

}

########################################################################################################
# How worn ground recovers, and what it is worth to hurry it along. Ground left alone mends itself over in-game days; bone meal and the tampers pay to skip the wait, and this is where that price and the experience it earns are set.
########################################################################################################

healing {
    # Whether any block of a family can mend any worn block of that same family. On by default, so a worn modded dirt can be filled with any other block the mod counts as dirt without listing every one in repairBlocks. The per-family repairBlocks lists still work on top of this and are how to allow something from outside the family - grass mended with earth. Off, only the block's own kind and its repairBlocks list will pay. Read by bone meal, the chunk tamper and the golem, which pay with a block of the ground itself; the hand tamper pays in what the ground drops and ignores this.
    B:repairAnyInFamily=true

    # Whether mending worn ground is worth experience. Priced per gradation put back rather than per block or per gesture, so filling a deep rut is worth more than brushing off one scuff. Only a gradation that cost something earns anything, because wearing ground in is free and a free way back out would make the round trip a farm. Bone meal spent from a player's hand earns outside creative whatever bonemealCostsABlock says, since the handful itself is spent; a dispenser, and another mod's fertiliser while that setting is off, earn nothing. A tamper earns only for the gradations it took material for. So creative mode, the Wayfarer's Tamper, a tamperMendCost or tamperPatchCost of 0 and a chunk tamper with bonemealCostsABlock off all mend for nothing and earn nothing at any xpPerGradation - and a tool with a repairing enchantment is not repaired by them either, because that repair is paid out of the same experience.
    B:xpFromHealing=true

    # Experience per gradation of wear mended and paid for, before any enchantment on the tool. A gradation that cost nothing earns nothing at any figure - see xpFromHealing. Fractions are honoured by chance rather than by rounding - at the default a quarter of the gradations pay a point each - because a whole orb is the only unit the game has and rounding a quarter down would pay nothing at all. [range: 0.0 ~ 64.0, default: 0.25]
    D:xpPerGradation=0.25

    # How much each level of an experience-boosting enchantment adds, as a fraction of the base. 0.25 means a level III boost pays 175 per cent. [range: 0.0 ~ 4.0, default: 0.25]
    D:xpBoostPerLevel=0.25

    # Name fragments that mark an enchantment as one that repairs a tool from experience. Matched by name rather than by id, because ids differ between installs, and by fragment rather than by exact name because a pack may add mending of its own: vanilla's Mending, which exists at this version and does not on 1.7.10, is caught by the default 'mending' along with anything else named like it. When a tamper carries one, experience earned mending ground repairs the tamper first at vanilla's rate of two durability per point, and only the remainder reaches the player.
    S:mendingEnchantments <
        mending
        repair
     >

    # Name fragments that mark an enchantment as one that increases experience gained. Matched the same way as mendingEnchantments, with punctuation and spaces ignored on both sides.
    S:xpBoostEnchantments <
        xpboost
        experienceboost
        xp
     >

    # Whether untouched ground recovers over time. Healing is applied lazily from the world clock, so a chunk nobody has visited for a month heals the moment it loads, exactly as if it had been loaded the whole time. Server downtime does not count: the clock is in-game time, not real time. With it off, trample tallies against plants and leaves never fade either.
    B:enabled=true

    # Whether natural recovery stops while nobody is connected. On, the clock healing is measured against is held still for as long as the server sits empty, so a road does not grow back overnight through time no player was there for. Golems are unaffected and that is the point: one left tending a road in a chunkloaded corner goes on working through the night and keeps what it did, which is what makes an unattended golem farm worth building. Wearing is unaffected too, since wear is counted per crossing rather than per second. The same holds for the tallies trampling.vegetation and trampling.leaves keep against plants and leaves: crossings still count while the clock is held and nothing fades, so a creature a chunk loader keeps moving can finish off a plant or a leaf overnight. The pause is a running total saved with the world, so it survives a restart, and it starts at zero on an existing save - the clock only begins to lag once the server has actually sat empty. Off, the clock runs whenever the server does, which is how this behaved before - though switching it off only stops the clock falling further behind, it does not give back time already held out, because that would age every road on the server the instant the switch was flipped. Nothing happens either way in single player.
    B:pauseWhenEmpty=true

    # How fast ground recovers. 2.0 recovers twice as fast, 0.5 half as fast - the same direction as every other rate in this config, and it multiplies every family at once. Per-family durations live under families.<name>.healDaysPerStage, and each of those is that family's own figure rather than anything worked out from its wear cost. They used to be derived - one constant times the average threshold - which made the table tidy and made it lie: snow and sand cost almost exactly the same traffic to mark and recover nothing like alike, because fresh snow covers a track in under a week and a rut in sand wants a month of wind. Out of the box a fully worn path takes six in-game days to disappear on snow, thirty on sand, forty-five on gravel, a hundred on dirt, a hundred and twenty-five on turf, a hundred and seventy on cobble, thirty-one on ice, three hundred and twenty on stone, and four hundred in the Nether or the End, where there is no weather to fill anything in. The wear table in game draws all of that from these same figures, so it is the place to look after changing one. [range: 0.01 ~ 1000.0, default: 1.0]
    D:healingRate=1.0

    # Fraction of the current stage's threshold that bleeds off per untouched in-game day. Without this a route crossed twice a year would still eventually become a path; with it, only sustained use leaves a mark. The same fraction fades the tallies trampling.vegetation and trampling.leaves keep against a plant or a leaf, and nothing else does: at 0.05 a full tally takes twenty in-game days to clear, whatever the speed settings. 0 disables partial decay, so only whole stages ever recover - and since a plant or a leaf has no stages, a tally against one then never fades at all. [range: 0.0 ~ 1.0, default: 0.05]
    D:wearDecayPerDay=0.05

}

########################################################################################################
# How a blast scours the ground it does not destroy. A crater with clean grass up to its lip reads as a hole somebody cut rather than as something that went off, and this is the ring of scuffed ground that fixes that. Strength falls away with distance, and the middle of it is usually inside the crater, so the reach setting matters as much as the strength one.
########################################################################################################

explosions {
    # Whether an explosion scours the ground around it as well as blowing a hole in it. What a blast does not destroy outright it still scours, and a crater with clean grass up to its lip reads as a hole somebody cut rather than as something that went off.
    B:explosionWear=true

    # How hard the ground is scoured at the very middle of a blast, in the same units a footstep uses, falling away to nothing at the edge. Quoted against a stick of dynamite; a creeper's blast is three quarters of it. The ground is scoured once the blast has taken its blocks, so the crater's own floor is worn hardest, its walls and lip less, and the ground around it less again. At the default a creeper's crater leaves its lip about two thirds as worn as its middle and the ground worn four to five blocks past the lip, fading gradually as it goes and ragged at the edge. [range: 0.0 ~ 1000.0, default: 168.0]
    D:explosionStrength=168.0

    # How far from a blast the scouring may reach, whatever radius the charge itself claims. A ceiling rather than a setting: the radius arrives from whatever set the explosion off, and a mod handing over a very large one would otherwise have the server walk a great many positions inside a single tick. See explosionMaxPositions, which bounds the work rather than the distance and is the one that will actually bite first on a very large charge. [range: 1.0 ~ 256.0, default: 64.0]
    D:explosionMaxRadius=64.0

    # How far the scouring reaches past the blast's own radius, as a multiple of that radius: at the default of 2 a creeper's blast, radius 3, scours out to nine blocks from its middle and a stick of dynamite to twelve. It also decides how much of the wear the ground around the crater gets: the fall-off runs in a straight line from the middle to nothing at the reach, so a short reach leaves the ground just past the crater's lip where the fall-off has already faded. [range: 0.1 ~ 8.0, default: 2.0]
    D:explosionReach=2.0

    # The most positions one blast may look at. A blast is handled inside the tick that set it off, and the sphere grows as the cube of its radius, so a very large charge would otherwise stall the server outright. When this bites, the reach is pulled in until the work fits - which costs the outermost ring, where the wear had faded to nothing anyway. [range: 1024 ~ 4194304, default: 262144]
    I:explosionMaxPositions=262144

}

########################################################################################################
# How something landing hard marks the ground it lands on. The same shape as a blast and a much smaller one: a fall puts its whole momentum through a patch the size of whatever fell, so it marks that patch and very little around it.
########################################################################################################

impacts {
    # Whether something landing hard scuffs the ground it lands on. The same idea as an explosion and much tamer: what comes down from a height puts its momentum through a patch of ground about its own size, marking that and very little around it.
    B:fallWear=true

    # How hard the ground is marked by a landing from fallReferenceDistance, in the same units a footstep uses. Everything else is in proportion to the speed it arrived at, which goes as the square root of the drop - so twice the height is not twice the blow. [range: 0.0 ~ 1000.0, default: 6.0]
    D:fallStrength=6.0

    # Below this a landing marks nothing. Anything shorter is a step somebody took rather than a fall, and it is already counted as one; it is also where vanilla stops doing fall damage. [range: 0.0 ~ 256.0, default: 3.0]
    D:fallMinDistance=3.0

    # The drop that fallStrength is quoted against. Raise it to make every landing gentler without touching the strength figure. [range: 1.0 ~ 256.0, default: 10.0]
    D:fallReferenceDistance=10.0

    # How far a landing's scuff can spread, however far the thing fell. A landing is a local thing; this stops a very long drop reading as a small explosion. [range: 1.0 ~ 16.0, default: 3.0]
    D:fallMaxRadius=3.0

}

########################################################################################################
# The reinforcement feature: an enchantment, only for the chunk tamper and the Wayfarer's, that unlocks a mode in which the tool reinforces a block against explosions and against traffic instead of mending ground. Right-click spends a material and reinforces the block; two left-clicks take a reinforcement off. Three reinforcements make a block blast-proof, and by default make it take four times the crossings to wear.
########################################################################################################

reinforce {
    # Whether the reinforcement feature exists at all: the enchantment that unlocks it, the tool mode, and the blast-proofing it grants. Off, the enchantment still registers so a save that has it on a tool does not lose an id, but the mode and its gestures do nothing, and nothing new of it is handed out: an enchanting table will not roll it onto a book or offer it for a tamper, a librarian will not offer it in a new trade, and the book's recipe, its chest finds, its two advancements, its trophy and its quest are left out. The mode, the table and librarians follow a change straight away, from /trmt reload or the config screen. The recipe, the chest finds, the advancements, the trophy and the quest are settled as the game starts and follow a change either way only after a restart, so until then a switch turned off still leaves the book craftable and findable, and one turned on leaves it neither. Nothing already made is taken back: a librarian who already sells the book keeps that trade, which is saved with the villager, a chest that already holds one keeps it, a world that has already taken the quest chapter keeps its quests, and a book of it will not go onto a tool while this is off, except by a player in creative mode. Another mod that picks enchantments from the game's book list for itself, rather than through an enchanting table or the game's librarian, is not held to this. The Waila readout reads this machine's own copy, so a client with it off shows no reinforcement even on a server that has it on.
    B:enabled=true

    # Does nothing in this edition, and left in the file so a pack can move between versions: an enchantment here is registered by name, and the number it travels under is the game's own to keep in step, so there is no slot to pin and nothing drifts. What follows is what it means on 1.7.10. The id the reinforcement enchantment registers at. -1 takes the first free slot at startup, which is fine for a single pack but drifts if the set of mods changes - and the id is written into the enchanted tool's own data, so a drift silently strips the enchantment off existing tools. Pin it to a fixed free number on a pack you intend to keep. [range: -1 ~ 255, default: -1]
    I:enchantId=-1

    # The most times one block may be reinforced. The top level is fully blast-proof; the levels below raise its blast resistance. Capped at 3 whatever is written, because the level is stored in two bits of the position's own record. [range: 1 ~ 3, default: 3]
    I:maxLevel=3

    # How much longer each reinforcement level makes a block take to wear, counted as whole extra lifetimes added per level. At the default of 1 a block reinforced once needs twice the traffic to move a step, twice needs three times and three times needs four - and because it applies to every one of the eighty steps, a fully reinforced road takes four times the walking to sink from new to bare. Healing is untouched: the recovery rate is a share of the threshold, so a reinforced block still mends a step in the same idle time. Only the rate is governed here. A reinforced leaf or plant is never trampled at all, as trampling.leaves and trampling.vegetation say, and reinforced ground never wears away under trampling.groundWearsAway, whatever this is set to. Set to 0 to take reinforcement off the rate ground wears at, as it was before this existed: it still guards against explosions, against trampling and against ground wearing away. [range: 0.0 ~ 16.0, default: 1.0]
    D:wearFactor=1.0

    # What one reinforcement costs, tried in the order written and paid with the first the player is carrying. A 'fluid:name' entry is a bucket or cell of that fluid, named as the fluid registry names it rather than as the tooltip spells it. A plain 'modid:name[:meta]' entry is one of that item, and is the form to use for a container that no mod registered as a fluid container - which is what GT New Horizons' two concrete buckets are, and why they are named outright here. Either way the container's own rule decides what comes back: a bucket that declares an empty gets its empty handed back, from the fluid registry or from the item's own container item, and a single-use clay one declares none and is spent. An entry naming something this pack does not have is skipped, so the whole list can name many things and find one - which is what the default does, preferring concrete in whichever form the pack has it and falling back to obsidian on plain Minecraft. On this edition the list names its own concrete too, after 1.7.10's three, which are kept first so a settings file moves between editions unchanged: every item a mod tags forge:concrete or c:concrete - the second is the namespace Fabric mods tag in, and on Forge it finds nothing and is skipped - and the game's sixteen concretes by name. A '#namespace:path' entry is every item in that item tag. If what you are carrying is not being taken, stand by the golem and run /trmt golem: it prints what the item actually is, what each entry here resolves to, and the exact line to add.
    S:materials <
        fluid:wet.concrete
        dreamcraft:dreamcraft_Concrete_bucket
        dreamcraft:clayBucketConcrete
        #forge:concrete
        #c:concrete
        minecraft:white_concrete
        minecraft:orange_concrete
        minecraft:magenta_concrete
        minecraft:light_blue_concrete
        minecraft:yellow_concrete
        minecraft:lime_concrete
        minecraft:pink_concrete
        minecraft:gray_concrete
        minecraft:light_gray_concrete
        minecraft:cyan_concrete
        minecraft:purple_concrete
        minecraft:blue_concrete
        minecraft:brown_concrete
        minecraft:green_concrete
        minecraft:red_concrete
        minecraft:black_concrete
        minecraft:obsidian
     >

    # The blast size a block reinforced once can withstand, on top of its own resistance. Vanilla TNT is size 4; a creeper 3. Above this size the block is destroyed as usual. [range: 0.0 ~ 100000.0, default: 8.0]
    D:ceilingLevel1=8.0

    # The blast size a block reinforced twice can withstand, on top of its own resistance. Reinforcing a third time makes it fully blast-proof whatever this says. [range: 0.0 ~ 100000.0, default: 30.0]
    D:ceilingLevel2=30.0

}

########################################################################################################
# Items handed to a player the first time they arrive in a world. Every one is off, and stays off: a mod that puts things in somebody's inventory uninvited is one they will remember for the wrong reason.
########################################################################################################

spawnitems {
    # Whether every player is given a plain tamper at the pack's first grade. Not only on a fresh spawn: anyone who has never been given one in this save gets it the next time they log in, so turning this on reaches people already playing. Nobody is ever given a second.
    B:tamper=false

    # Whether every player is given a chunk tamper at the pack's first grade. Not only on a fresh spawn: anyone who has never been given one in this save gets it the next time they log in, so turning this on reaches people already playing. Nobody is ever given a second.
    B:chunkTamper=false

    # Whether every player is given the Wayfarer's tamper, which is the whole ladder at once. Not only on a fresh spawn: anyone who has never been given one in this save gets it the next time they log in, so turning this on reaches people already playing. Nobody is ever given a second.
    B:wayfarerTamper=false

    # Whether every player is given the Wayfarer's Guide, Mk I. Not only on a fresh spawn: anyone who has never been given one in this save gets it the next time they log in, so turning this on reaches people already playing. Nobody is ever given a second.
    B:guideMk1=false

    # Whether every player is given the Wayfarer's Guide, Mk II. Not only on a fresh spawn: anyone who has never been given one in this save gets it the next time they log in, so turning this on reaches people already playing. Nobody is ever given a second.
    B:guideMk2=false

    # Whether every player is given the Commands guide. Not only on a fresh spawn: anyone who has never been given one in this save gets it the next time they log in, so turning this on reaches people already playing. Nobody is ever given a second.
    B:guideCommands=false

    # Whether every player is given the Golem of Ways guide. Not only on a fresh spawn: anyone who has never been given one in this save gets it the next time they log in, so turning this on reaches people already playing. Nobody is ever given a second.
    B:guideGolem=false

}

########################################################################################################
# Whether this mod's things turn up in chests the world generates, and how heavily each is weighted. Additive: nothing that was already findable stops being findable, and the weights are deliberately tiny against pools that total in the hundreds, so every other item keeps very nearly the odds it had. Every setting here is read once, as the game starts, so a change takes a restart.
########################################################################################################

loot {
    # Whether the mod's things turn up in world-generated chests - its tools, guide books, draughts, the golem and its upgrades, and enchanted books carrying its unlock enchantments. Additive: nothing that was already findable stops being findable, and the weights below are small enough that every other item keeps very nearly the odds it had. Off, the mod adds nothing to any chest. This is the one switch over all of them, and integration.gtnhEnhanced has no say: nothing a chest is given needs a GregTech pack, so a pack set to behave as plain Forge finds them too. Each find also has a weight below, where 0 leaves out whatever that weight covers, and three weights cover a group rather than one find: loot.enchantBook is all three unlock books, loot.guideBookRare the Mk II, Commands and Golem guides, and loot.golemUpgrade every ordinary golem upgrade, so none of those can be left out alone by weight - a single unlock book goes only by turning its enchantment off, which takes the enchantment out entirely. Every find also follows the switch of the feature it belongs to. Read once, as the game starts: a change takes a restart, /trmt reload alone neither adds nor removes anything, and a chest already generated keeps what it was filled with.
    B:lootFinds=true

    # How heavily a plain tamper, in dungeons, mineshafts and a smith's chest is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 3]
    I:tamper=3

    # How heavily a chunk tamper, in dungeons and strongholds is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 1]
    I:chunkTamper=1

    # How heavily the Wayfarer's tamper, in a stronghold library unless loot.wayfarerCategories names somewhere else - the rarest tool here is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 1]
    I:wayfarer=1

    # How heavily the Wayfarer's Guide Mk I, which is meant to be found early is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 5]
    I:guideBook=5

    # How heavily each of the Mk II, Commands and Golem guides, all three at this one weight, is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 2]
    I:guideBookRare=2

    # How heavily each of the enchanted books carrying the mode unlocks, all three at this one weight, is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 1]
    I:enchantBook=1

    # How heavily each of the golem's ordinary upgrades, all at this one weight, is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 2]
    I:golemUpgrade=2

    # How heavily a Draught of Lightness, in dungeons, mineshafts and a smith's chest is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 2]
    I:draughtLightness=2

    # How heavily a Draught of the Heavy Foot, which is the stranger of the two to come across is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 1]
    I:draughtHeavyFoot=1

    # How heavily the All Ways upgrade, which is every other one at once is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 1]
    I:golemOmniUpgrade=1

    # How heavily a dormant Golem of Ways - the rarest thing the mod generates is weighted in the chest pools it is added to. A pool totals in the hundreds, so these numbers are deliberately tiny. 0 means it is never generated. Read once, as the game starts: a change takes a restart, and /trmt reload alone changes no chest pool. [range: 0 ~ 100, default: 1]
    I:golemEgg=1

    # Which chest categories the Wayfarer's Tamper may be generated in. A category here is just the name a world generator asks for, so a pack can name its own End or dungeon structures' categories and the Wayfarer will turn up in them. This version of the game ships no End structure with a category of its own, which is why the default is the stronghold library - the rarest vanilla pool, and the room the End portal stands in. A name is matched exactly, case included, and a wrong one is refused nowhere: Forge makes an empty pool for a name nobody uses, and a Wayfarer filed only there would never be found. So as a server starts - in single player, as the first world is opened - the log warns about each name whose pool holds nothing but the Wayfarer and has no chest size, which is how a pool no other mod has touched looks, and when that is every name here the Wayfarer is filed in the stronghold library as well. A mod that fills its own pool only later than that is warned about too, and if every name is one of those the Wayfarer turns up in the library besides. What this cannot see is a real pool the world never draws from: bonusChest is filled only in a world made with a bonus chest, and a server with structures switched off makes no stronghold, mineshaft, village or temple chests - the library included - and a mod with its own structure switched off makes none of its own, so a Wayfarer named only in those is then found nowhere, without a word; dungeon chests are made either way, so a name such as dungeonChest still gives it out. A name written twice is filed twice and doubles the Wayfarer's odds there, which is the one way to weight one place above another. Empty means the library. Taken up once, as the game starts, so a change waits for a restart. A loot.wayfarer weight of 0 is the setting that leaves it out on purpose.
    S:wayfarerCategories <
        strongholdLibrary
     >

}

########################################################################################################
# The Golem of Ways: whether it exists, how far it reaches, how hard it works, and what it costs to keep. It is built in the world like an iron golem rather than crafted, and it is the only thing in this mod that will hold a stretch of ground at a wear level you choose without you walking it yourself. Everything here belongs to the world it is standing in.
########################################################################################################

golem {
    # Whether the Golem of Ways exists at all - whether it can be built, spawned, or do any work. Off, the shape does nothing and any golem already standing simply idles.
    B:enabled=true

    # Whether golem upgrades exist. Off, none are craftable and the golem's screen has no upgrade slot at all - not a slot that refuses things, no slot.
    B:upgrades=true

    # Whether a golem standing about shows you why. Three postures, each on a different part of it: head bowed and the body's sway all but stopped when it has been told nothing at all; its own tamper plate cast out from the hip when it has orders and not the means to carry them out; and a slow shift of weight from one foot to the other when the round is walked and the road needs nothing. Each takes about three seconds to arrive, so a golem between two jobs never strikes an attitude about it. Off, it goes back to rehearsing a third of its work stroke whenever it is holding a tamper with nothing to do, which is what it did before these were added.
    B:idlePoses=true

    # Whether the golem keeps what its own work shakes loose - the seeds, the flint, the snowballs - putting them in its storage while there is room and leaving them on the ground when there is not. It holds them for you to take out; you cannot put them back, because its slots only accept the tampers and the ground it mends with. A hopper or a dropper may put in only that ground, and never into its last empty slot, which is kept for what the golem picks up and for a tamper to replace one that breaks; and no hopper or hopper minecart can take anything out of it, these included. What it will not do is sweep up a battlefield: a mob drop is neither its earnings nor its materials, which keeps a golem that has been fighting from filling with rotten flesh and having nowhere left to put its gravel. Reinforcing rides on this too: a golem only notices reinforcing material thrown down while it is picking things up, so off here quietly switches golem.reinforces off with it.
    B:pickUpDrops=true

    # How far from its anchor a golem works without the range upgrade. [range: 1 ~ 64, default: 16]
    I:baseRadius=16

    # The furthest a golem can ever be told to work, with every upgrade fitted. [range: 1 ~ 64, default: 64]
    I:maxRadius=64

    # How many blocks a golem spends on one purchase of mending. A golem is priced the way the chunk tamper is: one purchase pays for general.chunkTamperGradationsPerBlock gradations of one kind of ground, rounded up for each kind on each stroke. So at the default of 2 a golem working a chunk tamper or the Wayfarer's spends two blocks wherever a chunk tamper in a player's hand would spend one - 114 blocks for a fifteen-by-fifteen layer of one kind of ground mended one gradation deep, where the chunk tamper spends 57 - and a golem working a plain tamper, which puts back a single gradation a stroke, spends two blocks for every gradation: twice the hand tamper's single-square mend at general.tamperMendCost's default of one. The golem never reads tamperMendCost, so changing that moves only the player's side of the comparison. A stroke that finds fewer gradations of some ground than one purchase pays for still buys a whole purchase, so ground a golem keeps up a gradation or two at a time costs it close to this figure for every gradation, whatever tamper it holds. The frugality upgrade halves this figure, rounding down and never below one: at the default that brings a golem level with a player doing the same work with a plain tamper or a chunk tamper at those tools' own defaults, at 3 it comes down to one as well, and at 1 it saves nothing. A golem is never free: the Wayfarer's Tamper costs a player nothing, and so does a chunk tamper with general.bonemealCostsABlock off, but neither reaches a golem, because a keeper that cost nothing to run would never need looking after. What pays is bone meal's rule - a block of the ground itself, whatever families.<name>.repairBlocks names, or with healing.repairAnyInFamily on any block of the same family - taken from the golem's own storage first and then, with the settled upgrade, from the containers around its anchor. [range: 1 ~ 16, default: 2]
    I:blockCost=2

    # Whether a golem defends the ground it keeps. With a tamper in its storage it hits back at whatever hits it and steps in front of a player or a villager a monster has gone for - monsters only, never a player, a villager, a pet or another golem, and never a creeper or a ghast, one of which it would blow up its own road over and the other of which it cannot reach. It never goes looking: those two things are the whole of it. Without a tamper it runs from monsters instead, creepers included, which is the same emptiness that stops it working at all. Off, none of this happens and a golem does nothing but its round.
    B:combat=true

    # What one of its blows takes off, in half-hearts, once a second. Deliberately well under the iron golem's seven to twenty-one: this one has sixty health and cannot be knocked back, so it is meant to win by outlasting a monster rather than by killing it quickly, and a road-mender that cleared a spawner would have stopped being a road-mender. Flat whatever tamper it is holding, because the grade list is yours to edit and a damage curve drawn over it would move under anybody who only meant to add a metal. Every landed blow costs the tamper a use, the same as a stroke of work does, so a golem left to fight spends the tools you gave it to work with. 0 leaves it shoving monsters about without hurting them. The fierce upgrade doubles whatever this says, so lowering it lowers that too. The stout upgrade is not on this dial at all - it doubles the golem's health, which is a flat sixty and has no setting of its own. [range: 0.0 ~ 20.0, default: 4.0]
    D:attackDamage=4.0

    # How long a golem's list of squares that want doing stands before it looks at its whole radius again, in seconds. The list is also thrown away the moment the last square on it is finished, whichever comes first, so this only matters to a golem that still has work it cannot reach or cannot pay for. Making the list is the expensive part - sixteen thousand columns for a golem keeping sixty-four blocks - so this is the dial that decides how often that is paid for. [range: 10 ~ 7200, default: 900]
    I:targetMemory=900

    # The least time between two full sweeps of a golem's ground, in seconds. Without it, a golem standing in a finished field would sweep its whole radius every stroke looking for work that is not there, which is the one case where the search costs far more than the work. Raise it on a server with many golems; it only ever delays a golem noticing new work, and only for this long. [range: 1 ~ 600, default: 10]
    I:scanCooldown=10

    # How many rings of equally distant work a golem will choose between when it picks somewhere to go. The list is sorted by rounded distance from its home, and each time it chooses it takes a number of rings between one and this, then picks at random from everything in them. At 1 it always takes the nearest work and sweeps the ground in a visible spiral; at 3 it keeps close to home while looking like a thing deciding where to go next. Large numbers let it wander to whatever it likes. [range: 1 ~ 16, default: 3]
    I:targetLayers=3

    # In-game days a golem carrying the stout upgrade takes to put one point of health back, or 0 for none. Only the stout ones, and the all-ways golem that carries every upgrade at once; nothing else mends at all. Deliberately slow - the upgrade doubles a golem's sixty health to a hundred and twenty, so at the default one knocked down to half its bar is sixty in-game days getting back to full, and twenty hours of that spent somewhere loaded - because the point of the upgrade is health to spend standing somewhere, not health that comes back between strokes. Counted off the golem's own age, so one in an unloaded chunk mends nothing while it is not there. [range: 0.0 ~ 100.0, default: 1.0]
    D:stoutHealDays=1.0

    # Whether a golem picks up reinforcing material thrown down beside it and lays it into its own round. One piece at a time, chewed through with the empty container handed straight back, and one square of its round taken up a level for each - so a whole stack can still be handed over at once and left with it, and it paces itself through the pile. It will not take a bite unless it has orders, a tamper, and a square wanting reinforcement, because the container goes back before the material is laid and it cannot hand back what it has already swallowed. What counts as material is whatever reinforce.materials names - the same list a tamper is paid from, which on a pack with GregTech means a bucket of concrete and on plain Minecraft means obsidian - so this needs nothing of its own and follows that list wherever it is pointed. A golem that can find nowhere left to reinforce takes no bite at all and waits a little before looking again; a mouthful it has already chewed is held until a square wants it, and falls with the rest of what it carries only if it dies. It rides on golem.pickUpDrops as well: a golem notices thrown material only while it is picking things up, so with that off this does nothing whatever it says. Off, thrown material is ignored and reinforcing stays a thing done by hand.
    B:reinforces=true

    # How far from itself a golem can reach to work a square, in blocks. It works everything within this of where it is standing and then walks to the next thing that needs doing, which is why a golem paces its road rather than standing still and rewriting ground sixty blocks away. Its work radius still says which ground is its business; this says how much of that is within arm's length at any moment. Large numbers turn it back into a thing that tends a whole field from one spot. [range: 1 ~ 16, default: 4]
    I:workReach=4

    # Whether a golem carrying the Settled Ways upgrade may use the containers around its anchor: taking a tamper or a block to mend with when it has run out, and putting its surplus back when it is full. It only ever puts something into a container that is already holding that same thing, so it can never decide for itself where anything ought to live, and it only reaches into what a hopper could reach into - so barrels, drawers and modded chests all work and none of them is named anywhere in this mod. Off, the upgrade is still craftable and still fits, and does nothing.
    B:areaStorage=true

    # How far past the ground it keeps a settled golem will reach for a container, in blocks. Its round plus this, the same shape as the guard range - because a chest sitting just off the edge of the ground a golem tends is a chest you would expect it to use. Zero confines it to exactly its own round. Larger numbers cost a wider scan every few seconds; the scan skips any chunk that is not loaded, so this can never pull terrain into memory. [range: 0 ~ 64, default: 8]
    I:storeReach=8

    # How far either side of its order a golem carrying the Green Ways upgrade drives the ground, in gradations of that family's own run. The order stops being a place to stop and becomes the middle of a band: the golem wears its whole round down to one edge, turns when it finds nothing left to do, mends it all back up to the other, and round again. Eight is about one physical level for most families, so a round breathes by roughly a level in each direction. Larger bands take longer to turn and shed more each time; a band of one is a golem fidgeting. [range: 1 ~ 64, default: 8]
    I:greenBand=8

    # The chance that a golem working ground down sheds something, rolled once each time a square physically drops a level rather than once per gradation. Its own number rather than the one traffic uses, because the two are different units: a footstep moves a shade and a golem takes a whole level off in one gesture. What it sheds is whatever that ground sheds - seeds from turf, flint from gravel, snowballs from snow - and it goes straight into the golem's own store, falling to the floor only when there is no room left. Zero stops it entirely; the master switch is still wearDrops in general. [range: 0.0 ~ 1.0, default: 0.5]
    D:wearDropChance=0.5

    # The least ground a golem will move over, in blocks from its home, whatever its round is narrowed to. One number bounds four things - how far it will step to meet something, how far it will chase, how far it wanders when idle, and how far out it will walk itself home from - so the tightest of the four decides all of them, and a golem told to keep a single square would otherwise be penned into nine blocks and stand perfectly still on one. Narrowing the round is meant to say what it keeps, not to nail its feet down. [range: 1 ~ 128, default: 16]
    I:roamFloor=16

    # Whether the nine upgrades bind into an Unstable All Ways rather than straight into the settled one. The unstable part carries the whole set and keeps only three to nine of them at a time, choosing again every minute, with the storage always among them so nothing the golem is carrying can be stranded by the roll - and it wears its name the way it wears the set, which is badly. A nether star settles it into the ordinary All Ways upgrade afterwards. Off, the nine parts craft straight to the settled version and the unstable one is never made, though anything already holding one keeps working.
    B:unstableOmni=true

    # How long an unstable golem holds on to one set of upgrades, in ticks. Twelve hundred is a minute, which is long enough to notice what it currently is and short enough that it is never that for long. Raising it makes an unstable golem nearly as good as a settled one; lowering it makes it useless for anything but watching. [range: 20 ~ 24000, default: 1200]
    I:unstablePeriod=1200

    # How far past its work radius a golem will stand. It bounds the search for a fight, the chase, and its idle wandering, so a golem no longer drifts off the ground it was set on and a monster that leads it over that line is let go. Running away is the one thing not bounded by it - a retreat that had to stay inside the thing you are retreating around would not be a retreat - but an unarmed golem walks back to its anchor once the monster has gone. Small numbers keep it tight to its road; large ones let it range, at the price of finding it somewhere you did not leave it. [range: 4 ~ 64, default: 8]
    I:guardRange=8

    # The block of packed stone that forms the golem's upper body, tried in the order written. Entries outside vanilla are skipped while the GTNH enhancements are off, so a pack asking to behave as plain Forge builds the plain shape even if the compressed blocks happen to be installed.
    S:bodyTop <
        ExtraUtilities:cobblestone_compressed:3
        minecraft:stone_bricks
     >

    # The block of packed earth that forms the golem's lower body, tried in the order written.
    S:bodyBottom <
        ExtraUtilities:cobblestone_compressed:11
        minecraft:dirt
     >

    # The blocks that form the golem's two arms, either side of its upper body, tried in the order written.
    S:arms <
        ExtraUtilities:cobblestone_compressed:10
        minecraft:dirt
     >

}

########################################################################################################
# Worlds made with The Roads More Travelled, the mod this one began from: how their worn blocks are carried over as each chunk loads. Server-owned, because it changes what the world saves.
########################################################################################################

conversion {
    # Server only. Whether a world made with The Roads More Travelled, the mod this one began from, has its worn blocks converted as each chunk loads: worn grass, dirt and coarse dirt become grass blocks and worn sand becomes sand, each square given this mod's own wear as far along as it was drawn, so its paths are carried over. Each chunk is converted once, as it is first loaded, and saved without any of that mod's blocks. Nothing is converted while The Roads More Travelled itself is installed. Off, nothing is converted and the game itself turns each of that mod's blocks into air as its chunk loads. Either way, keep a copy of the world from before today if you may go back to that mod. A chunk already converted stays converted.
    B:enabled=true

    # Server only. Whether the original mod's worn dirt and worn coarse dirt become grass blocks worn as far as they were, as that mod heals every worn dirt back to grass in the end. Off, they become dirt, worn as far along this mod's dirt as they were. A block cannot say whether it was grass or dirt before it was worn, which is why this is one switch for both.
    B:dirtBecomesGrass=true

}

########################################################################################################
# The ward: an enchantment that lets a tamper mark ground where nothing will spawn. Server-owned, because where monsters may appear is not a thing a client gets an opinion about.
########################################################################################################

spawnward {
    # Whether the spawn-ward feature exists at all: the enchantment that unlocks it, the tool mode, and the mob-spawn barring it grants. Off, the enchantment still registers so a save that has it on a tool does not lose an id, but the mode and its gestures do nothing, and nothing new of it is handed out: an enchanting table will not roll it onto a book or offer it for a tamper, a librarian will not offer it in a new trade, and the book's recipe, its chest finds, its two advancements, its trophy and its quest are left out. The mode, the table and librarians follow a change straight away, from /trmt reload or the config screen. The recipe, the chest finds, the advancements, the trophy and the quest are settled as the game starts and follow a change either way only after a restart, so until then a switch turned off still leaves the book craftable and findable, and one turned on leaves it neither. Nothing already made is taken back: a librarian who already sells the book keeps that trade, which is saved with the villager, a chest that already holds one keeps it, a world that has already taken the quest chapter keeps its quests, and a book of it will not go onto a tool while this is off, except by a player in creative mode. Another mod that picks enchantments from the game's book list for itself, rather than through an enchanting table or the game's librarian, is not held to this. The Waila readout reads this machine's own copy, so a client with it off shows no ward even on a server that has it on.
    B:enabled=true

    # Does nothing in this edition, and left in the file so a pack can move between versions: an enchantment here is registered by name, and the number it travels under is the game's own to keep in step, so there is no slot to pin and nothing drifts. What follows is what it means on 1.7.10. The id the spawn-ward enchantment registers at. -1 takes the first free slot from the top at startup - fine for one pack, but it drifts if the mod set changes, and the id is written into the enchanted tool, so a drift strips it off existing tools. Pin it to a fixed free number on a pack you keep. [range: -1 ~ 255, default: -1]
    I:enchantId=-1

    # How many of the material barring one category of mob from one block costs. The Wayfarer's tamper pays half of this. Letting a category back is free but for a scratch of durability. 0 makes barring free. [range: 0 ~ 64, default: 2]
    I:cost=2

    # What barring hostile mobs from a block costs, tried in the order written and paid with the first the player has enough of. A 'modid:name[:meta]' entry is that item. The default is an eye of ender per unit of 'cost'.
    S:hostileMaterials <
        minecraft:ender_eye
     >

    # What barring passive mobs from a block costs, tried in the order written and paid with the first the player has enough of. A 'modid:name[:meta]' entry is that item. The default is a golden carrot per unit of 'cost'.
    S:passiveMaterials <
        minecraft:golden_carrot
     >

}

########################################################################################################
# The path light: an enchantment that lets a tamper make ground glow without placing a light source in it. The glow is drawn rather than lit, so nothing about it changes what spawns or what the world thinks the brightness is.
########################################################################################################

pathlight {
    # Whether path lighting exists at all: the enchantment that unlocks it, the tool mode, and the glow itself. Off, the enchantment still registers so a save that has it on a tool does not lose an id, but the mode and its gestures do nothing, no block glows, and nothing new of it is handed out: an enchanting table will not roll it onto a book or offer it for a tamper, a librarian will not offer it in a new trade, and the book's recipe, its chest finds, its two advancements, its trophy and its quest are left out. The mode, the table and librarians follow a change straight away, from /trmt reload or the config screen. The recipe, the chest finds, the advancements, the trophy and the quest are settled as the game starts and follow a change either way only after a restart, so until then a switch turned off still leaves the book craftable and findable, and one turned on leaves it neither. Nothing already made is taken back: a librarian who already sells the book keeps that trade, which is saved with the villager, a chest that already holds one keeps it, a world that has already taken the quest chapter keeps its quests, and a book of it will not go onto a tool while this is off, except by a player in creative mode. Another mod that picks enchantments from the game's book list for itself, rather than through an enchanting table or the game's librarian, is not held to this. Only ground that is already worn can be lit, because the glow is emitted by the ghost this mod paints over worn ground - so this lights paths, not walls.
    B:enabled=true

    # Does nothing in this edition, and left in the file so a pack can move between versions: an enchantment here is registered by name, and the number it travels under is the game's own to keep in step, so there is no slot to pin and nothing drifts. What follows is what it means on 1.7.10. The id the path-light enchantment registers at. -1 takes the first free slot from the top at startup - fine for one pack, but it drifts if the mod set changes, and the id is written into the enchanted tool, so a drift strips it off existing tools. Pin it to a fixed free number on a pack you keep. [range: -1 ~ 255, default: -1]
    I:enchantId=-1

    # How brightly a lit block glows. For scale: a torch is 14 and glowstone 15. The glow is drawn on each player's own screen and is no light the world knows of, so however bright, it keeps no mob from spawning on the road. [range: 1 ~ 15, default: 12]
    I:level=12

    # How many of the material lighting one block costs. The Wayfarer's tamper pays half. Recoloring an already-lit block and putting one out are free but for a scratch of durability. 0 makes lighting free. [range: 0 ~ 64, default: 1]
    I:cost=1

    # What lighting a block costs, tried in the order written and paid with the first the player has enough of. A 'modid:name[:meta]' entry is that item. The default is a glowstone dust per unit of 'cost'.
    S:materials <
        minecraft:glowstone_dust
     >

}

########################################################################################################
# The two draughts, and the effects they pour. A Draught of Lightness is the original mod's own Potion of Lightness, brought across with its ingredients intact: while it lasts, that walker wears no ground whatever - not the block underfoot and not the ones around it a footstep normally bleeds onto - which is the same total suppression that sneaking gives. A Draught of the Heavy Foot is its opposite and is new here, made the way vanilla makes any opposite, by corrupting the first with a fermented spider eye. The two items are registered whatever the switches here say, and that is deliberate rather than untidy: the item id map is compared between a client and a server when they connect, so a switch that changed which items exist would stop two machines that disagree about it from connecting at all. What these switches turn off is the effect, the recipe and the chance of finding one - never the item. A draught already in a chest with the feature off is an ornament, and drinking it says so.
########################################################################################################

potions {
    # Whether the draughts do anything. Off, both effects stop working, neither recipe is registered and neither turns up in a chest - but both items still exist, because which items exist is compared when a client connects to a server and may not depend on a setting.
    B:enabled=true

    # Whether a Draught of Lightness exempts its drinker. The exemption is total rather than partial - no wear on the block underfoot, none on the ones a footstep spreads onto, and none from a landing - and it covers whatever the drinker is riding as well, so a splash over a horse genuinely exempts the horse. It does not mend ground that is already worn; recovering is a separate mechanic and this does not hurry it.
    B:lightness=true

    # Whether a Draught of the Heavy Foot multiplies its drinker's wear. This one is not in the original mod. Because the factor is applied to the figure that reaches the block underfoot, the blocks a footstep spreads onto and any crop being trodden on, a heavy walker widens a track as well as deepening it - which is more than the words 'more wear' promise, and is worth knowing before turning it up.
    B:heavyFoot=true

    # How many ordinary crossings one heavy-footed crossing counts as. At the default of four, a stone road wants sixteen passes a gradation instead of sixty-five, and turf six instead of twenty-four. Nothing is compounded when a heavy rider sits on a heavy mount: two doses is still one heavy thing walking. Nought does not mean no wear: anything at or under nought is read as one, so the draught then does nothing at all. [range: 0.0 ~ 64.0, default: 4.0]
    D:heavyFootFactor=4.0

    # How long one Draught of Lightness lasts, in seconds. Three minutes is the original mod's own figure, to the tick. Nought makes the draught do nothing: the bottle is still drunk and the effect is gone the next tick. [range: 0 ~ 86400, default: 180]
    I:lightnessSeconds=180

    # How long one Draught of the Heavy Foot lasts, in seconds. Matched to Lightness, since it is meant to be the same bottle read backwards. Nought makes the draught do nothing, the same way. [range: 0 ~ 86400, default: 180]
    I:heavyFootSeconds=180

    # Does nothing in this edition, and left in the file so a pack can move between versions: an effect here is registered by name, and the number it travels under is the game's own to keep in step, so there is no slot to pin. What follows is what it means on 1.7.10. The effect id Lightness registers at. -1 takes the first free slot counting up from 24, which is right for a pack that does not change - but an effect id is written into your save and sent to clients as a single byte, so a server and a client that resolved to different numbers disagree about what was drunk. Where the other side has a different effect at that number it shows the wrong one; where it has nothing there, the effect is simply dropped on arrival and a line in the client's log says so. It used to be worse than either - an effect with nothing behind it threw inside the client's own world tick - and that is guarded now, but agreeing on the number is still the only way to see the right thing. On a pack you intend to keep, pin this to a number you know is spare and pin the same number on every machine. Plain Minecraft leaves 24 to 31 free. Numbers of 128 and above only survive the journey on a pack that widens the byte they travel in, so the automatic search takes everything below 128 first and says so if it cannot. [range: -1 ~ 255, default: -1]
    I:lightnessPotionId=-1

    # Does nothing in this edition, and left in the file so a pack can move between versions: an effect here is registered by name, and the number it travels under is the game's own to keep in step, so there is no slot to pin. What follows is what it means on 1.7.10. The effect id Heavy-Footedness registers at, under the same rules and the same warning as the setting above. Lightness is claimed first, so where a pack has exactly one slot left it goes to the faithful effect and this one is skipped. The log says which at startup, and so does /trmt status, which is the quickest way to compare two machines. [range: -1 ~ 255, default: -1]
    I:heavyFootPotionId=-1

}

########################################################################################################
# Two different things the sky does to ground, kept under one heading because both of them are weather, and only one of them is waiting to be asked for. The first is snow lying on ground taking the traffic instead of the ground beneath it, which is on out of the box and is what the three snowCover settings decide: walking a snowy road treads the snow away layer by layer, and only once the last of it has gone does what is underneath begin to mark. That half is at work in every world without anything being switched on. The second is ground that mends only while the weather is doing the mending, and that half is off out of the box - a surface waits for weather when its own families.<name>.healsOnlyWhenWet is switched on, and every one of the sixteen families ships that off, so until somebody turns one on wetHealingEnabled and wetHealSecondsPerStage decide nothing whatever. The rule they then decide is that elapsed time still banks up exactly as it always did, so a dry spell delays recovery rather than cancelling it and a chunk nobody has visited for a month still holds every day of it - but the bank is only paid out while precipitation is actually falling on that spot, and paid at a rate rather than in a lump, so a storm fills a path in while you stand in it instead of undoing it the instant it starts. The three settings after those - whether ground has to see the sky, whether its biome has to be one that gets weather, and what to do in a dimension that has none - are each there because they name a place where waiting for weather would quietly mean never. Two of them are earning their keep already with every family switch still off, because the same questions decide where rain counts toward the families.<name>.wetRecoverySpeed discount, which ships at two for turf, earth, sand and gravel: narrow either one and a sheltered or a dry path stops earning its faster mending as well as being shut out of the gate. The dimension setting only ever matters to the gate, since rain never falls in a world with no sky for it to fall from.
########################################################################################################

weather {
    # Whether snow lying on the ground takes the traffic instead of the ground under it. On, walking a snowy road treads the snow away layer by layer, and only once the last of it has gone does the ground start to wear - which is what a path through snow looks like, and is not what happened before. What happened before was two different wrong things at once, neither of them chosen: one layer of snow, which is the only depth this game ever lays by itself, has a collision box of no height whatever, so feet landed on the ground beneath and the ground wore at full speed with snow visibly lying on it; two layers or more and the step arrived addressed to the snow, which is not a wearing surface, and was thrown away entirely - shelter that was total, permanent, free, and not even a debt banked against the thaw. Off, both of those come back. Nothing here touches recovery: ground under snow goes on mending at its usual rate, so a path quietly fills in beneath a snowfall, which is the one thing about all this that was already right.
    B:snowCovers=true

    # How much walking one layer of snow absorbs before it is trodden away. At the default of six, and with an ordinary crossing worth half of one, that is twelve crossings a layer - so a single fresh fall gives way inside a minute of use while a drift several layers deep takes real effort to break a road through. The snow is taken one layer at a time and the ground beneath is not touched until the last of it has gone. Nothing is dropped when a layer goes: what carried it off was somebody's boots. [range: 0.5 ~ 1000.0, default: 6.0]
    D:snowCoverWear=6.0

    # How many untouched in-game days it takes for a half-trodden track through snow to fill back in, as if it had been snowed over. At the default of one day a route crossed a few times and then left alone is gone by morning, which is the same argument the ground's own partial decay makes: only sustained use should leave a mark. Set to 0 and a half-trodden layer waits for ever, so a single crossing a year would eventually break through. None of this is written to the save - the game lays and melts snow on its own schedule, so a half-trodden layer is a fact with a lifetime measured in minutes, and a layer met again after a reload is met fresh. [range: 0.0 ~ 365.0, default: 1.0]
    D:snowCoverFadeDays=1.0

    # Whether snow eight layers deep counts as solid ground over whatever it lies on. Off, the default, a full drift is snow like any other: with snowCovers on it is trodden away a layer at a time before the ground beneath it wears, a tamper wears the ground under it, the golem works it, and wear already there is drawn as worn. On, a drift eight layers deep shelters the ground under it completely - nothing wears it, no tamper or golem works it, and wear already under it is hidden until the drift thins - which is how the 1.16.5 and later editions treated full drifts before 0.9.228. One to seven layers are never solid either way. For a pack that relied on full drifts leaving the ground alone.
    B:fullSnowDriftsSolid=false

    # Whether the per-family 'only mends in the wet' switches do anything at all. Off, every one of them is inert: no family waits for weather, whatever its own switch says, which is the quickest way to take that gate back out without editing a switch a family. It does not take the whole of the weather out of recovery, though, and the part it leaves behind runs the other way. The wetRecoverySpeed discount is only ever given to a family that is not already being paid by the rain through the meter, because cheapening a gated family as well would be paying for one storm twice - so switching this off makes every family eligible for that discount rather than fewer, including any that were waiting for weather a moment ago. And since every family ships with its own switch off, the usual effect of turning this off is nothing whatever: turf, earth, sand and gravel are already earning the discount and go on mending in half the untouched days while rain is actually falling on them, with this on or off. To have recovery owe nothing at all to the sky, set every families.<name>.wetRecoverySpeed to one as well.
    B:wetHealingEnabled=true

    # Seconds of falling weather bought per gradation of recovery. At the default of three, a surface worn all the way through wants four minutes of rain to come all the way back - which is roughly a third of one storm, so a badly worn path takes several. Set to 0 to pay the whole banked debt the moment it starts raining, which is the behaviour without a meter at all. This is real time rather than the recovery already owed: a gradation still costs its family's own healDaysPerStage of untouched days, and this decides how quickly what is already owed is handed over. [range: 0.0 ~ 600.0, default: 3.0]
    D:wetHealSecondsPerStage=3.0

    # Whether ground has to be able to see the sky. On, a path under a roof, in a cave or beneath a thick canopy never mends while its family is waiting for weather, because nothing is falling on it - which is right, since nothing washes an indoor floor, and is also a large thing to discover rather than choose. Off, shelter makes no difference and covered ground recovers whenever it rains outside.
    B:wetHealingNeedsOpenSky=true

    # Whether a biome that never has weather is excluded. On, a desert gets no rain and sand in one never recovers - which is awkward, because being filled back in is sand's whole character and what does the filling is wind, which this game does not have. Off, a dry biome counts as wet, so desert sand mends whenever it is raining somewhere in that world. Snow and ice are unaffected either way: those two always ask whether it is cold enough here to be snowing.
    B:wetHealingNeedsRainyBiome=true

    # What to do in a dimension that has no weather whatever - the Nether, the End, and anything built like them. On, the rule simply does not apply there and ground recovers the ordinary way, which is the safe answer. Off, it does apply, and since it will never rain in either place that means ground there never recovers again for as long as the world exists. That is a legitimate thing to want and it is not something anybody should arrive at by accident.
    B:wetHealingSkipsWeatherlessDimensions=true

}

########################################################################################################
# What a route does to what stands in it and to what it is walked across. Two switches, both off, keep a tally of crossings against a plant in the way or a leaf underfoot and break it when the tally runs out. The rest follow the ground: a plant comes down when the square under it drops a level, a planted thing can hold its square instead, and ground worn the whole way through is removed. Nothing here changes vanilla's own rule for trampling farmland.
########################################################################################################

trampling {
    # Break a plant once enough crossings have gone through it. Out of the box that is tall grass, ferns, flowers, double plants and dead bushes, and detection adds whatever else is made of plant or vine and is not a full block - crops, saplings, sugar cane, mushrooms and vines among them, because what a block is made of cannot tell a field from a meadow; surfaces.exclude is how to spare one. Lily pads are detected too and are never trampled, since they are stood on rather than walked through. Each plant keeps a tally of its own, counted where the feet are rather than on the ground beneath, so a plant can go on a square that still looks untouched. At the shipped figures a plant's tally runs to sixteen to twenty-four, in the wear multipliers.player adds per step: thirty-two to forty-eight crossings on foot, half that mounted, fewer for anything the multipliers heading weights heavier, and general.erosionSpeed and general.globalSpeed divide that exactly as they divide a gradation of ground. The tally fades at healing.wearDecayPerDay, so a plant crossed now and then recovers. At the shipped speeds only a plant crossed more than about twice an in-game day is brought down; the speeds divide that rate along with the tally, so at an erosionSpeed of 8 a plant crossed more often than about once every three to five days goes in the end, and healing.healingRate does not reach the fade at all. With healing.enabled off or healing.wearDecayPerDay at 0 nothing fades, and every plant crossed that many times over any span of time is eventually broken. Nothing fades either while healing.pauseWhenEmpty holds the clock on an empty server, and creatures still count then wherever a chunk loader keeps them moving, so villagers can finish off overnight a plant that would have recovered with somebody online. Villagers and anything on a lead count as they do for ground, and one milling about a doorway or tied to a post treads the same few plants again and again; general.retriggerCooldown holds a creature back here exactly as it does on the ground, which slows that down without stopping it. A plant carrying a reinforcement or a spawn ward is never trampled, and neither is a plant standing in tilled soil unless trampling.groundCoverOnTilled is on, which is what spares a farm. trampling.groundCoverHolds does not apply here, so a sapling or a flower goes the way tall grass does. Nothing is counted while sneaking with general.sneakSuppresses on, under the Draught of Lightness, or outside general.minY to general.maxY, and no new tally is started in a chunk already holding performance.maxEntriesPerChunk records, though one already there goes on counting. No claim or protection mod is asked, because the event those mods listen for has to name a player to blame and this break is made in nobody's name - so on a server with land claims, anybody walking through somebody else's claim wears its plants down as they would their own. This destroys real blocks and is NOT undone by removing the mod, which is why it ships off.
    B:vegetation=false

    # Wear away the leaf block a route crosses on top of - a way over a canopy, or a bridge of leaves - until it breaks and whatever is standing on it falls, from however high the leaf was. The leaf counted is the one underfoot, since nothing stands inside a leaf, and only the one under the middle of whoever is walking. A floor or a roof of leaves that anyone moves about on goes far sooner than a route across one, because every step from one leaf to the next counts. Anything laid on the leaf - a slab, a carpet - takes the traffic and the leaf keeps no tally; a plant counted as vegetation hanging into the space above it does not, so what the vegetation heading counts decides this too. Snow lying on it is trodden through first when weather.snowCovers is on, as on ground; with that off, snow two layers deep or more shelters the leaf for as long as it lies. The tally, its figures and its fading are those of trampling.vegetation: thirty-two to forty-eight crossings on foot at the shipped speeds, recovery for a leaf crossed less than about twice an in-game day, and no fading with healing.enabled off, with healing.wearDecayPerDay at 0, or while healing.pauseWhenEmpty holds the clock on an empty server. A leaf carrying a reinforcement or a spawn ward is never trampled, which is the way to keep a leaf bridge standing. Creatures count as they do for ground, and a mount under its rider; a multipliers.mobs line of '*' takes in spiders on a canopy and ocelots in a jungle, and general.retriggerCooldown slows one loitering on the same few leaves without stopping it. A broken leaf lets the leaves around it decay exactly as breaking it by hand would. Leaves anybody placed never decay, but a tree holds its leaves only within four leaves of its trunk, and giant jungle trees and big oaks grow canopy beyond that which stands only because nothing has disturbed it - so a route over one can let a good deal more of the canopy around it go than the route itself, and leaves a structure was generated with and no trunk holds can go the whole way. Vines hanging from a broken leaf or clinging to its side come down with it and leave nothing behind. No claim or protection mod is asked, for the reason given under trampling.vegetation. This destroys real blocks and is NOT undone by removing the mod, which is why it ships off.
    B:leaves=false

    # Chance a trampled plant gets to drop what it would drop broken by hand: a flower itself, tall grass its occasional seeds, a crop what its stage gives. 0 means a trampled plant leaves nothing behind - except where it is the foot of a stalk of sugar cane, whose pieces above come down with it and each drop in full, because that is the cane's own rule for standing on nothing - or where it is the top half of a two-block plant, whose lower half then drops in full by vanilla's own rule. [range: 0.0 ~ 1.0, default: 0.2]
    D:vegetationDropChance=0.2

    # Chance a trampled leaf gets to drop what a decaying leaf would. That is never the leaf block itself: for vanilla leaves it is a sapling one time in twenty, one in forty for jungle, and from oak and dark oak an apple one time in two hundred, while a modded leaf decides for itself - so at the shipped 0.1 a sapling turns up roughly once in two hundred broken leaves. 0 means a trampled leaf never leaves anything behind. [range: 0.0 ~ 1.0, default: 0.1]
    D:leavesDropChance=0.1

    # Remove a block that has been worn the whole way through, rather than letting it sit at the end of its run taking no further notice of anything. It drops nothing: what wore away was carried off a grain at a time by whatever walked over it, and a rule that paid you for it would be a mining technique. A square must be worn a full threshold PAST the end of its chain before it goes, which is both the grace an older world needs - so nothing already worn out vanishes the moment this arrives - and what stops a single charge taking untouched ground to a hole inside one tick. A pin, a reinforcement, a spawn ward and a wayfinding glow each refuse it outright, on the reasoning that a tamper charge somebody spent is a refusal rather than a delay. So does a plant holding the square under trampling.groundCoverHolds, for as long as it stands, and so does any wear ceiling below the whole run - general.maxWearFraction or a family's own maxWear - because ground told to stop short of the end never reaches it. This destroys real blocks and is NOT undone by removing the mod.
    B:groundWearsAway=true

    # Break the plants standing on a square when the ground under them gives way, as though whatever wore it had gone through them to do it. Not the same thing as trampling.vegetation: that one counts crossings of the plant itself and breaks it on its own tally, where this one asks the plant nothing and takes it down with the ground. It is the cheaper of the two, because nothing at all is recorded for the plant's position, and the better behaved, because a plant only ever goes where a path has visibly formed - which is why this one ships on and the vegetation and leaves switches do not. Cactus and sugar cane count, and taking the bottom of a stalk takes the whole stalk, because neither will stand on nothing. Which blocks count is decided by detection and listed under surfaces.groundCoverBlocks. It still destroys real blocks, and that is NOT undone by removing the mod.
    B:groundCover=true

    # Let a planted thing hold the ground it is standing on instead of being knocked off it. A sapling or a flower on a square that keeps being walked over holds that square just short of dropping a level: the wear goes on being counted, and the ground goes on darkening through its surface gradations, but it does not sink and it does not go on into the material underneath while the plant is there. Break the plant and the square shows everything it had been holding back, at once. This is the third answer to what a route does to what is standing in it, and the only one that neither destroys somebody's orchard nor pretends the ground under it is untouched. Which plants hold rather than break is decided by detection and listed under surfaces.groundCoverHoldsBlocks - saplings and flowers out of the box, because a sapling is a tree somebody planted where a tuft of grass is weather, and nothing in the block registry draws that line for us.
    B:groundCoverHolds=true

    # Wait for the ground to physically drop a level before knocking the plants off it, rather than acting on every gradation. A family's whole run is eighty gradations and eight sunk pixels, so this is roughly a tenth as often - and it is the honest moment, because a gradation is a change of shade where a level is the ground going out from under the thing standing on it. Turn it off and a plant goes at the first gradation its square wears, which on a busy route means almost at once. Note that a family configured never to sink, or a world with physical decay switched off in its chain, then never brings a plant down at all.
    B:groundCoverOnSink=true

    # Whether plants standing on hoed ground go down with everything else. Off, anything planted in tilled soil is left alone, which is the only honest way to spare a field: asking the plant what it is cannot separate a farm from a meadow, because Natura's cotton and barley are crops by Forge's own reckoning and also grow wild on plain grass, but asking what they were planted in can. It decides trampling.vegetation as well: off, a plant standing in tilled soil keeps no tally and is never trampled, however often it is crossed. For trampling.groundCover this only ever comes up where tilled soil has been made erodable, since it is on the surface exclude list by default and ground that never wears never drops a level; for trampling.vegetation it matters in every field.
    B:groundCoverOnTilled=false

    # Chance a plant taken down by the ground wearing still drops its item. Higher than leavesDropChance and vegetationDropChance on purpose. With groundCoverOnSink on, as it ships, this fires only where a square has actually dropped a level, and on turf and earth, where nearly every plant grows, that takes far more crossings than a trampled plant's own tally running out, so it can afford to be generous - and a path that quietly eats a rare flower and leaves nothing behind reads as a bug rather than as weather. [range: 0.0 ~ 1.0, default: 0.5]
    D:groundCoverDropChance=0.5

}

########################################################################################################
# The ceilings that keep all of this cheap: how many positions are tracked, how often they are looked at, how much is sent to a client and how much of it is applied per tick. Raising these buys detail and spends frames and bandwidth; lowering them does the reverse. None of it changes how ground behaves, only how much of it is watched at once.
########################################################################################################

performance {
    # Ticks between healing sweeps over loaded chunks. Unloaded chunks need no sweeping; they catch up the moment they load. [range: 20 ~ 24000, default: 200]
    I:sweepIntervalTicks=200

    # Chunks examined per sweep. The sweep round-robins, so this bounds its cost however much world is loaded. [range: 1 ~ 4096, default: 64]
    I:sweepChunksPerPass=64

    # Hard cap on tracked positions in one chunk. Stops a save growing without bound under sustained traffic. A chunk at the cap starts no new record from traffic: ground not already tracked there stops wearing, and trampling starts no new tally. Work done on purpose is not held to it - a tamper or a golem wearing ground down, and a reinforcement or a ward put down, are still recorded past it. Tallies against plants and leaves count towards it while they last - a single crossing's for about half an in-game day at the shipped figures, a nearly spent one's for up to twenty - and for ever while healing.enabled is off or healing.wearDecayPerDay is 0, since nothing then fades them away. [range: 16 ~ 65536, default: 3072]
    I:maxEntriesPerChunk=3072

    # Ticks between movement checks per entity. Wear is counted per block entered rather than per tick, so raising this only loses accuracy when sprinting diagonally. [range: 1 ~ 20, default: 2]
    I:movementSampleTicks=2

}

########################################################################################################
# One heading per kind of surface. Each decides whether that kind wears, how many gradations it wears through, how deep it sinks, how long it takes to grow back, and which blocks count as it. This is where to make stone all but permanent and sand wear in a dozen crossings.
########################################################################################################

families {
    ########################################################################################################
    # Everything about how grass wears: whether it does, how many gradations it goes through, how deep it sinks under foot, how long it takes to recover, and which blocks count as it. The blocks list is filled in by startup detection and is also yours to edit - see the surfaces heading for how removing an entry actually works.
    ########################################################################################################

    grass {
        # Whether grass surfaces erode at all.
        B:enabled=true

        # Whether slabs cut from grass wear too. There is nothing separate to tune: a slab walks the same chain at the same prices as a whole block of the same stuff, so it takes exactly as many crossings to wear through and exactly as long to recover, and the only difference is that the rut is drawn half as deep - half a block cannot lose eight pixels and still be there. Detection finds them the same way it finds everything else, by what the block is made of and what it is called with the shape word taken off, so a modded slab of this material is included without anybody naming it.
        B:slabs=true

        # Whether stairs cut from grass wear too, on the same terms as slabs above: the same chain, the same prices, and no depth at all. A stair states its own shape and never has a height clamped onto it, so it shows every gradation of its wear in its face and none of it underfoot - which is the one way a stair differs from the slab above, and is why it is worth its own switch.
        B:stairs=true

        # Whether startup detection may classify installed blocks into this family. Turn off and use the list below to control it by hand.
        B:autoDetect=true

        # Blocks treated as grass. Detection fills this in with what it found, so it doubles as a record of what is actually being affected; anything you add by hand is kept. Format: modid:block, modid:block:meta, or modid:block:* for every metadata. Removing an entry only sticks once surfaces.autoDetect is off, because with it on detection puts the block straight back - use surfaces.exclude for that instead.
        S:blocks <
            immersive_weathering:rooted_grass_block
            mcwlights:shroomlight_slab
            minecraft:dried_kelp_block
            minecraft:grass_block
            minecraft:mycelium
            minecraft:nether_wart_block
            minecraft:shroomlight
            minecraft:target
            minecraft:warped_wart_block
            prefab:block_grass_slab
            prefab:block_grass_stairs
            supplementaries:flax_block
         >

        # How many wear gradations this surface shows before it starts to sink. Once it does, each further pixel of depth gets 'layersPerDepth' gradations of its own, so the whole run from untouched to the deepest rut is usually stages + layersPerDepth * maxSinkPixels steps - eighty at the shipped figures, and forty-eight for ice, which sinks only half as far as the rest. Two of the headings here are not that arithmetic, and both are worth knowing before pricing anything against it. Grass has no depth of its own, because turf is a face rather than a substance, so it has no pixels to measure a run in and borrows them from the first surface it wears through into: with general.grassWearsThroughToDirt on, which is how it ships, grass runs earth's eighty steps rather than the sixteen this sum would give, and with that switch off there is nothing to borrow from and the chain really does stop dead at sixteen. Dirt is one step shorter than the sum rather than longer, because a ghost showing no wear at all is indistinguishable from the earth it is covering, so dirt's first layer is skipped and its run is seventy-nine. Both figures matter beyond curiosity, since a run's length is what healDaysPerStage below is multiplied by for how long a fully worn path takes to fade. The wear table in game reads the real chain for every family, so it is the place to check a run after changing anything here. [range: 1 ~ 16, default: 16]
        I:stages=16

        # Wear needed to advance one stage, lower bound of the per-position random draw. The draw is what keeps path edges ragged instead of geometric. [range: 0.0 ~ 1000000.0, default: 8.0]
        D:thresholdMin=8.0

        # Upper bound of the per-position random draw. [range: 0.0 ~ 1000000.0, default: 16.0]
        D:thresholdMax=16.0

        # In-game days this family's stage must go untouched before it steps back. What a fully worn path costs altogether is this times the length of the family's whole run, and that run is longer than the stages figure above suggests: each pixel of depth adds layersPerDepth gradations of its own, and a family with no depth of its own takes both of those figures from the first surface it wears through into, because the ground beneath is then the only rut it can have. Which is why turf, whose maxSinkPixels is nought, still runs eighty gradations - sixteen of thinning green and then sixty-four down through the earth - and takes a hundred and twenty-five days to go rather than the twenty-five its own stages alone would come to. Turn general.grassWearsThroughToDirt off and there is nothing left for it to borrow: the run stops at sixteen, and twenty-five days is then the honest figure. Earth is one gradation shorter than the arithmetic gives, because a ghost showing no wear at all is indistinguishable from the dirt it is lying on and so its first layer is skipped; its run is seventy-nine rather than eighty, which is why its default is written as a hundred days divided by seventy-nine and comes out at a hundred exactly. All of this holds while general.wearPaceFollowsTheGround is on, which is how it ships, and that switch is what keeps every gradation of a run mended at the rate of the ground the path is made of rather than at the rate of whatever it happens to be drawn as by then. The wear table in game works the total out for every family from these same numbers and is the place to read it after changing one. Healing is applied from the world clock when a chunk loads, so a chunk nobody has visited still recovers. This is the family's own figure and is not worked out from its wear cost: what it takes to mark a surface and what it takes for that mark to fade are genuinely different questions, and snow against sand is the pair that proves it. [range: 0.01 ~ 100000.0, default: 1.5625]
        D:healDaysPerStage=1.5625

        # How the price of a gradation changes as this surface wears further down its run. Every step used to cost the same, which is not what any of these surfaces do and is why early wear read as inert: the gradation you actually watch appear, the first, cost exactly as much as the last. flat holds one price the whole way, which is right for dressed stone - it does not compact underfoot, and the hundredth scuff costs what the first did. sod starts cheap and ends about four fifths dearer, for turf that tears at a touch over earth that is packed and rooted and does not. settle climbs to two and a half times, for sand and gravel, which displace under the first passes and then settle into a shape they have already found. pack climbs fourfold and stops climbing three quarters of the way along, for snow: one footfall in fresh powder is a whole gradation, what it leaves is packed snow and a different substance, and once thoroughly packed there is nothing left to compress. glaze climbs twelvefold in a straight line and never levels off at all, for ice, which does not compact and settle but merely polishes what is left, so every gradation is dearer than the one before it right to the end. Whichever is chosen, the total does not move. The multipliers over a whole run average to exactly one, so a curve only redistributes what the run costs - it can never quietly make a family easier or harder while appearing to be a change of shape, and every figure in the wear table survives changing it. What changes is where the cost sits: how quickly a path first shows, against how hard it is to drive one all the way down.
        S:costCurve=sod

        # Whether this surface recovers only while it is being rained on - or snowed on, for snow and ice, which is the same weather asked of a colder place. Off, which is how every family ships, it recovers on the clock alone. On, the days it is owed still bank up exactly as they did, so nothing is lost by a dry spell and a chunk nobody has visited for a month still holds every day of it; what changes is that the debt is only paid while something is actually falling, and paid a gradation at a time rather than all at once. Read the weather heading before switching this on: three settings there decide whether sheltered ground, dry biomes and weatherless dimensions are excluded, and each of those is a place where this can quietly mean never.
        B:healsOnlyWhenWet=false

        # How much faster this surface recovers while rain is actually falling on it. One is no difference at all and is what stone, cobble, netherrack and end stone ship with; two, which is what turf, earth, sand and gravel ship with, means a rut mends in half the untouched days while it is raining on it. Unlike the healsOnlyWhenWet switch above, this can never mean never - it is a discount rather than a gate, so ground the rain cannot reach simply does not earn it and mends at its ordinary rate, and anything under one is read as one. Whether rain is reaching a particular square is decided by the same three settings under the weather heading that the switch above uses: an open sky, a biome that has weather, and a dimension that has any. A family that IS waiting for weather does not also get the discount, because that would be paying for the same storm twice. [range: 0.0 ~ 1000000.0, default: 2.0]
        D:wetRecoverySpeed=2.0

        # Which wear look shapes this family's textures, all worked from the block's own pixels so any of them is safe on a block nobody drew art for. grass takes the cover off in patches and lets the face underneath show through, which is what turf does and what anything with a different underside does - podzol, mycelium, mossy stone over clean. crack dulls a surface down and splits it open, for stone that fissures and grimes over rather than polishing smooth, and crack_lite is the same run stopped a little over halfway along, so a face grimes and hairlines without ever breaking up. smooth flattens a surface toward its own average, for something that buffs shiny underfoot, and smooth_heavy takes rather more of the relief with it, leaving about a third of the light and dark the block began with. dirt rubs a growing patch of the surface away, which is what a trodden path is, and dirt_lite rubs a narrower and shallower one, leaving three fifths of the face exactly as it was. The last four do two of those in one look, and every id is written in the order its own halves run, so a file says what will happen without anybody reading the source. smooth_crack and smooth_dirt buff the whole face flat before cracking it or before wearing a track across part of it, because everything the second half of those aims at is read out of the surface it is handed and buffing afterwards would only close up the fissures and the track that had just been made. crack_dirt goes the other way round, and for a measured reason rather than a preference: a crack run last blurs a track's edge away to a quarter of what it was, while a track worn last leaves two fifths of the face carrying the fracture network exactly as a plain crack drew it, pixel for pixel. It is shown in the wear table as cracked rubbed, and crack_dirt_lite is that same run stopped early - the identical call with the eased progress at 0.55 of itself and nothing else altered, so every picture it draws is one crack_dirt genuinely passes through, pixel for pixel. It is shown in the wear table as cracked rubbed lite. The four after those were made for one material each and are named for it. flesh darkens a growing trodden patch toward the block's own shadow color, closes its grain up and puts a few wet highlights on its raised points, for something soft that bruises rather than wears. taint darkens the ground in spreading blotches while the block's own lighter strands, and a fine network drawn over them, swell toward its brightest color, for a blight that grows back over a path. sculk puts most of the block's glints out one at a time, keeps about a fifth of them lit to the end, and flattens, greys and dulls the rest of the face, for a living skin trodden still. cloud packs the whole face flatter and presses a denser, slightly greyer track into it with a lighter rim of pushed-up fluff, for a soft white solid. Seven more were made for the older families, each named for its material and what a foot does to it: sand_trodden packs a firmer, darker line with loose grains heaped lighter along its edges; gravel_parted opens the gaps between stones and darkens them while the whole trodden ground grimes over, so the flint stands out; cobble_polished polishes the stone tops smooth and dulls them, grinds the mortar darker, and from a quarter of the way cracks and scuffs them, more finely and darker still toward the end; snow_packed packs a smoother, cooler, grey-blue track, walked in darker in patches, with a few glassy glints; ice_scuffed clouds the surface toward white frost in a spreading haze crossed by fine scratches, and past three quarters of the way dark cracks open through it; nether_charred chars a track darker, flatter and sootier, with flecks of ash; end_bleached bleaches a track paler, greyer and polished smooth, unevenly, with grit ground into it and, from two fifths of the way, a faint network of cracks. Each takes every color it uses from the block itself, lightened, darkened or greyed, so each is as safe on any block as the rest. dirt is what anything unrecognised falls back to - including the older sand and polish names, which are still read so that no file breaks. Read by your own client and by nobody else, so this is your choice on somebody else's server as much as in a world of your own, and a server's copy of this key changes nothing for anybody. Change this to experiment: a family's whole look follows from it. Each family with a look made for it ships that look; the look it shipped with before is its classic look, which classicWear below and client.classicWear bring back while this names the shipped default, and any other look written here wins over both. A file an earlier build wrote with the old default here untouched is moved on to the new default the first time this build reads it.
        S:wearPattern=grass

        # How strongly the pattern is applied, 0 to 1. Lower values leave more of the block's original character showing through. [range: 0.0 ~ 1000000.0, default: 1.0]
        D:wearStrength=1.0

        # How many visual gradations this family shows between one pixel of sinking and the next. The first run, before anything has sunk, uses the longer 'stages' count instead: that is the wear people actually watch, and it earns the detail. [range: 1 ~ 16, default: 8]
        I:layersPerDepth=8

        # How far this family's most worn stage physically sinks, in sixteenths of a block. 0 means it only ever discolors, unless it wears through into another surface: then it sinks as deep as the first of those, with that surface's layersPerDepth, which is how grass gets its rut. Whether that sinking is something you can walk down into or only something you can see is set by physicalDecay in the general category. [range: 0 ~ 15, default: 0]
        I:maxSinkPixels=0

        # Blocks in this family that wear far more slowly, listed the same way as the blocks setting above. Grass paths are here by default: someone already made that path on purpose, so it should stand up to traffic rather than being immune to it or degrading like turf.
        S:resistantBlocks <
         >

        # How much more wear the blocks listed above take before they advance a stage. Healing is unaffected, so a resistant surface recovers at the same rate as any other. [range: 0.0 ~ 1000000.0, default: 8.0]
        D:resistance=8.0

        # How far along its run this surface may wear, as a fraction of the whole. 1 is the entire run from untouched to a rut half a block deep; 0.25 stops it about where a path reads as a path. The global general.maxWearFraction applies as well and whichever is lower wins, so a world can be capped once without editing every family. [range: 0.0 ~ 1000000.0, default: 1.0]
        D:maxWear=1.0

        # What a worn grass surface may also be mended with, besides a block of itself, listed the same way as the blocks setting above. Grass and dirt both take plain dirt out of the box: grass is what the world grows and earth is what a player digs, so the repair should cost the commoner of the two. Prefix an entry with 'ore:' to name an ore dictionary group instead of a block. Empty means only a block of this surface will do - or, while healing.repairAnyInFamily is on, any block of the same family. Read by bone meal and the chunk tamper while bonemealCostsABlock is on, and by the golem always; the hand tamper pays in what the ground drops and does not read this list.
        S:repairBlocks <
            minecraft:dirt
         >

        # Which surfaces this one exposes as it wears through, named the way the headings here name them - grass, dirt, sand, gravel, stone, cobble, snow, ice, nether, end, flesh, taint, sculk, cloud - and listed in the order the ground reaches them. Stone shows cobble, then the grit that broke off it, then the earth the road was laid on; grass shows the earth it was growing out of. The pixels of depth this family sinks are shared out between however many are listed, earliest first, so the list changes what a rut looks like on the way down and changes neither how many steps it takes to get there nor what any of them costs. A name that is this family's own, a name nothing matches, and a family that is switched off are all skipped. Empty means the ground hollows out as itself, which is what sand and snow do. Turned off wholesale by general.wearThroughToOtherSurfaces - except for grass, which has no depth of its own to hollow out and so answers to general.grassWearsThroughToDirt instead, and sculk, which answers to this list alone: it ships showing the deep dark's rock in its rut, and emptying the list makes it sink as itself.
        S:wearsThroughTo <
            dirt
         >

    }

    ########################################################################################################
    # Everything about how dirt wears: whether it does, how many gradations it goes through, how deep it sinks under foot, how long it takes to recover, and which blocks count as it. The blocks list is filled in by startup detection and is also yours to edit - see the surfaces heading for how removing an entry actually works.
    ########################################################################################################

    dirt {
        # Whether dirt surfaces erode at all.
        B:enabled=true

        # Whether slabs cut from dirt wear too. There is nothing separate to tune: a slab walks the same chain at the same prices as a whole block of the same stuff, so it takes exactly as many crossings to wear through and exactly as long to recover, and the only difference is that the rut is drawn half as deep - half a block cannot lose eight pixels and still be there. Detection finds them the same way it finds everything else, by what the block is made of and what it is called with the shape word taken off, so a modded slab of this material is included without anybody naming it.
        B:slabs=true

        # Whether stairs cut from dirt wear too, on the same terms as slabs above: the same chain, the same prices, and no depth at all. A stair states its own shape and never has a height clamped onto it, so it shows every gradation of its wear in its face and none of it underfoot - which is the one way a stair differs from the slab above, and is why it is worth its own switch.
        B:stairs=true

        # Whether startup detection may classify installed blocks into this family. Turn off and use the list below to control it by hand.
        B:autoDetect=true

        # Blocks treated as dirt. Detection fills this in with what it found, so it doubles as a record of what is actually being affected; anything you add by hand is kept. Format: modid:block, modid:block:meta, or modid:block:* for every metadata. Removing an entry only sticks once surfaces.autoDetect is off, because with it on detection puts the block straight back - use surfaces.exclude for that instead.
        S:blocks <
            etfuturum:grass_path
            immersive_weathering:loam
            immersive_weathering:mulch_block
            minecraft:coarse_dirt
            minecraft:dirt
            minecraft:grass_path
            minecraft:podzol
            minecraft:rooted_dirt
            prefab:block_dirt_slab
            prefab:block_dirt_stairs
         >

