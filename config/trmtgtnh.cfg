        # Whether stairs cut from snow wear too, on the same terms as slabs above: the same chain, the same prices, and no depth at all. A stair states its own shape and never has a height clamped onto it, so it shows every gradation of its wear in its face and none of it underfoot - which is the one way a stair differs from the slab above, and is why it is worth its own switch.
        B:stairs=true

        # Whether startup detection may classify installed blocks into this family. Turn off and use the list below to control it by hand.
        B:autoDetect=true

