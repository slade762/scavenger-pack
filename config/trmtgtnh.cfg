        S:wearPattern=cobble_polished

        # Whether cobble is drawn in its classic look, crack_dirt, the one it shipped with before the look made for it, cobble_polished. Only while wearPattern above names cobble_polished: a look written there by hand wins over this. client.classicWear does the same for every family that has a classic look. Read by your own client and by nobody else. Takes effect on the next resource reload.
        B:classicWear=false

        # How strongly the pattern is applied, 0 to 1. Lower values leave more of the block's original character showing through. [range: 0.0 ~ 1000000.0, default: 1.0]
        D:wearStrength=1.0

        # How many visual gradations this family shows between one pixel of sinking and the next. The first run, before anything has sunk, uses the longer 'stages' count instead: that is the wear people actually watch, and it earns the detail. [range: 1 ~ 16, default: 8]
        I:layersPerDepth=8

        # How far this family's most worn stage physically sinks, in sixteenths of a block. 0 means it only ever discolors, unless it wears through into another surface: then it sinks as deep as the first of those, with that surface's layersPerDepth, which is how grass gets its rut. Whether that sinking is something you can walk down into or only something you can see is set by physicalDecay in the general category. [range: 0 ~ 15, default: 8]
        I:maxSinkPixels=8

        # Blocks in this family that wear far more slowly, listed the same way as the blocks setting above. Grass paths are here by default: someone already made that path on purpose, so it should stand up to traffic rather than being immune to it or degrading like turf.
        S:resistantBlocks <
         >

        # How much more wear the blocks listed above take before they advance a stage. Healing is unaffected, so a resistant surface recovers at the same rate as any other. [range: 0.0 ~ 1000000.0, default: 8.0]
        D:resistance=8.0

        # How far along its run this surface may wear, as a fraction of the whole. 1 is the entire run from untouched to a rut half a block deep; 0.25 stops it about where a path reads as a path. The global general.maxWearFraction applies as well and whichever is lower wins, so a world can be capped once without editing every family. [range: 0.0 ~ 1000000.0, default: 1.0]
        D:maxWear=1.0

        # What a worn cobble surface may also be mended with, besides a block of itself, listed the same way as the blocks setting above. Grass and dirt both take plain dirt out of the box: grass is what the world grows and earth is what a player digs, so the repair should cost the commoner of the two. Prefix an entry with 'ore:' to name an ore dictionary group instead of a block. Empty means only a block of this surface will do - or, while healing.repairAnyInFamily is on, any block of the same family. Read by bone meal and the chunk tamper while bonemealCostsABlock is on, and by the golem always; the hand tamper pays in what the ground drops and does not read this list.
        S:repairBlocks <
         >

        # Which surfaces this one exposes as it wears through, named the way the headings here name them - grass, dirt, sand, gravel, stone, cobble, snow, ice, nether, end, flesh, taint, sculk, cloud - and listed in the order the ground reaches them. Stone shows cobble, then the grit that broke off it, then the earth the road was laid on; grass shows the earth it was growing out of. The pixels of depth this family sinks are shared out between however many are listed, earliest first, so the list changes what a rut looks like on the way down and changes neither how many steps it takes to get there nor what any of them costs. A name that is this family's own, a name nothing matches, and a family that is switched off are all skipped. Empty means the ground hollows out as itself, which is what sand and snow do. Turned off wholesale by general.wearThroughToOtherSurfaces - except for grass, which has no depth of its own to hollow out and so answers to general.grassWearsThroughToDirt instead, and sculk, which answers to this list alone: it ships showing the deep dark's rock in its rut, and emptying the list makes it sink as itself.
        S:wearsThroughTo <
            gravel
            dirt
         >

    }

    ########################################################################################################
    # Which blocks count as leaves, and whether any do. Nothing counted as leaves is ever drawn worn, and it has no gradations; this heading exists for trampling.leaves, the only thing that reads it. The tally is fixed at sixteen to twenty-four, in the wear multipliers.player adds per step - thirty-two to forty-eight crossings on foot at the shipped speeds - and is not set anywhere in this file; how fast it fades is healing.wearDecayPerDay. The blocks list is filled in by startup detection and is also yours to edit - see the surfaces heading for how removing an entry actually works.
    ########################################################################################################

    leaves {
        # Whether any block counts as leaves at all. Off, trampling.leaves has nothing to act on and never breaks anything, and every tally it was keeping is dropped at the next sweep, as a block's is when it is taken out of the list below - where switching trampling.leaves itself off keeps its tallies and lets them fade.
        B:enabled=true

        # Whether slabs of leaves count as leaves. There is nothing to tune: a slab of it is trampled exactly as a whole block is.
        B:slabs=true

        # Whether stairs of leaves count as leaves, on the same terms as slabs above.
        B:stairs=true

        # Whether startup detection may classify installed blocks into this family. Turn off and use the list below to control it by hand.
        B:autoDetect=true

        # Blocks treated as leaves. Detection fills this in with what it found, so it doubles as a record of what is actually being affected; anything you add by hand is kept. Format: modid:block, modid:block:meta, or modid:block:* for every metadata. Removing an entry only sticks once surfaces.autoDetect is off, because with it on detection puts the block straight back - use surfaces.exclude for that instead.
        S:blocks <
            anomalyzone:psi_pine_leaves
            anomalyzone:red_forest_leaf_litter
            anomalyzone:red_forest_leaves_blood
            anomalyzone:red_forest_leaves_orange
            anomalyzone:red_forest_leaves_rust
            anomalyzone:red_forest_needles
            minecraft:acacia_leaves
            minecraft:azalea_leaves
            minecraft:birch_leaves
            minecraft:cherry_leaves
            minecraft:dark_oak_leaves
            minecraft:flowering_azalea_leaves
            minecraft:jungle_leaves
            minecraft:mangrove_leaves
            minecraft:oak_leaves
            minecraft:spruce_leaves
         >

    }

    ########################################################################################################
    # Which blocks count as vegetation, and whether any do. Nothing counted as vegetation is ever drawn worn, and it has no gradations; this heading exists for trampling.vegetation, which reads it, and trampling.leaves asks it too, since only a plant counted here leaves a leaf beneath it open to the traffic. The tally is fixed at sixteen to twenty-four, in the wear multipliers.player adds per step - thirty-two to forty-eight crossings on foot at the shipped speeds - and is not set anywhere in this file; how fast it fades is healing.wearDecayPerDay. The blocks list is filled in by startup detection and is also yours to edit - see the surfaces heading for how removing an entry actually works.
    ########################################################################################################

    vegetation {
        # Whether any block counts as vegetation at all. Off, trampling.vegetation has nothing to act on and never breaks anything, and every tally it was keeping is dropped at the next sweep, as a block's is when it is taken out of the list below - where switching trampling.vegetation itself off keeps its tallies and lets them fade. Off also means no plant above a leaf leaves the leaf open to trampling.leaves.
        B:enabled=true

        # Whether slabs of vegetation count as vegetation. There is nothing to tune: a slab of it is trampled exactly as a whole block is.
        B:slabs=true

        # Whether stairs of vegetation count as vegetation, on the same terms as slabs above.
        B:stairs=true

